<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="The Core HR implementation sequence: discover and decide, design structures, build and load, test lifecycles, prove downstream, with a gate defining good enough to build on">
  <defs>
    <linearGradient id="hdr2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="88" fill="url(#hdr2)"/>
  <text x="48" y="40" font-family="Georgia, serif" font-size="29" fill="#ffffff">Implementing Core HR: The Sequence</text>
  <text x="48" y="70" font-family="Arial, sans-serif" font-size="20" fill="#94A3B8">Foundation first — downstream modules build once, on records they can trust</text>

  <g>
    <rect x="40" y="112" width="208" height="210" rx="12" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="2"/>
    <text x="56" y="152" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">1 · Discover</text>
    <text x="56" y="192" font-family="Arial, sans-serif" font-size="20" fill="#ffffff">Decide the</text>
    <text x="56" y="222" font-family="Arial, sans-serif" font-size="20" fill="#ffffff">person model</text>
    <text x="56" y="252" font-family="Arial, sans-serif" font-size="20" fill="#ffffff">and name the</text>
    <text x="56" y="282" font-family="Arial, sans-serif" font-size="20" fill="#ffffff">owners</text>
  </g>
  <text x="249" y="228" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2B6CB0">&#8250;</text>
  <g>
    <rect x="264" y="112" width="208" height="210" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="280" y="152" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1A202C">2 · Design</text>
    <text x="280" y="192" font-family="Arial, sans-serif" font-size="20" fill="#475569">Entities,</text>
    <text x="280" y="222" font-family="Arial, sans-serif" font-size="20" fill="#475569">locations, jobs</text>
    <text x="280" y="252" font-family="Arial, sans-serif" font-size="20" fill="#475569">and position</text>
    <text x="280" y="282" font-family="Arial, sans-serif" font-size="20" fill="#475569">rules</text>
  </g>
  <text x="473" y="228" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2B6CB0">&#8250;</text>
  <g>
    <rect x="488" y="112" width="208" height="210" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="504" y="152" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1A202C">3 · Build</text>
    <text x="504" y="192" font-family="Arial, sans-serif" font-size="20" fill="#475569">Configure and</text>
    <text x="504" y="222" font-family="Arial, sans-serif" font-size="20" fill="#475569">load cleansed,</text>
    <text x="504" y="252" font-family="Arial, sans-serif" font-size="20" fill="#475569">reconciled</text>
    <text x="504" y="282" font-family="Arial, sans-serif" font-size="20" fill="#475569">foundation data</text>
  </g>
  <text x="697" y="228" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2B6CB0">&#8250;</text>
  <g>
    <rect x="712" y="112" width="208" height="210" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="728" y="152" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1A202C">4 · Test</text>
    <text x="728" y="192" font-family="Arial, sans-serif" font-size="20" fill="#475569">Lifecycle stories</text>
    <text x="728" y="222" font-family="Arial, sans-serif" font-size="20" fill="#475569">over time, dated</text>
    <text x="728" y="252" font-family="Arial, sans-serif" font-size="20" fill="#475569">history and</text>
    <text x="728" y="282" font-family="Arial, sans-serif" font-size="20" fill="#475569">security roles</text>
  </g>
  <text x="921" y="228" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2B6CB0">&#8250;</text>
  <g>
    <rect x="936" y="112" width="208" height="210" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="952" y="152" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1A202C">5 · Prove</text>
    <text x="952" y="192" font-family="Arial, sans-serif" font-size="20" fill="#475569">Payroll, time</text>
    <text x="952" y="222" font-family="Arial, sans-serif" font-size="20" fill="#475569">and reporting</text>
    <text x="952" y="252" font-family="Arial, sans-serif" font-size="20" fill="#475569">consume the</text>
    <text x="952" y="282" font-family="Arial, sans-serif" font-size="20" fill="#475569">records cleanly</text>
  </g>
  <g>
    <rect x="40" y="346" width="1118" height="150" rx="12" fill="#ffffff" stroke="#2563EB" stroke-width="2"/>
    <text x="60" y="386" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1A202C">The Gate — Good Enough to Build On</text>
    <text x="60" y="422" font-family="Arial, sans-serif" font-size="20" fill="#475569">Stable owned structures, working lifecycle events, tested roles,</text>
    <text x="60" y="452" font-family="Arial, sans-serif" font-size="20" fill="#475569">and loaded, reconciled data. Integrity now; depth can follow.</text>
    <text x="820" y="386" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A202C">If a structure is disputed:</text>
    <text x="820" y="422" font-family="Arial, sans-serif" font-size="20" fill="#64748B">Settle it here, not in</text>
    <text x="820" y="452" font-family="Arial, sans-serif" font-size="20" fill="#64748B">payroll testing</text>
  </g>
  <g>
    <rect x="40" y="520" width="1118" height="64" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="60" y="560" font-family="Arial, sans-serif" font-size="20" fill="#475569">Sequencing follows dependency — every downstream build reads what this sequence settles.</text>
  </g>
  <text x="48" y="620" font-family="Arial, sans-serif" font-size="20" fill="#64748B">Build the foundation first, and the rest of the programme builds once.</text>
</svg>
