<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="hdr2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2B6CB0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="72" fill="url(#hdr2)"/>
  <text x="40" y="45" font-size="26" font-weight="bold" fill="#ffffff">The scale model: enable once, teach everywhere</text>
  <g font-size="15" fill="#475569">
    <rect x="30" y="150" width="280" height="220" rx="10" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="48" y="182" font-size="17" font-weight="bold" fill="#1A202C">Central enablement</text>
    <text x="48" y="212">Project and training team</text>
    <text x="48" y="238">Controlled materials set</text>
    <text x="48" y="264">Shared practice environment</text>
    <text x="48" y="290">Common session plans</text>
    <text x="48" y="316">Certification standard</text>
    <text x="48" y="342">Release refresh briefings</text>
    <rect x="430" y="150" width="280" height="220" rx="10" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="448" y="182" font-size="17" font-weight="bold" fill="#1A202C">Certified trainer network</text>
    <text x="448" y="212">Selected for credibility</text>
    <text x="448" y="238">and teaching aptitude</text>
    <text x="448" y="264">Trained a level deeper</text>
    <text x="448" y="290">Observed and certified</text>
    <text x="448" y="316">A bench for every</text>
    <text x="448" y="342">critical audience</text>
    <rect x="830" y="110" width="330" height="82" rx="10" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
    <text x="848" y="142" font-size="17" font-weight="bold" fill="#1A202C">Sites and locations</text>
    <text x="848" y="168">The same course, locally delivered</text>
    <rect x="830" y="219" width="330" height="82" rx="10" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
    <text x="848" y="251" font-size="17" font-weight="bold" fill="#1A202C">Language groups</text>
    <text x="848" y="277">Taught in-language, not interpreted live</text>
    <rect x="830" y="328" width="330" height="82" rx="10" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
    <text x="848" y="360" font-size="17" font-weight="bold" fill="#1A202C">Shift populations</text>
    <text x="848" y="386">Short sessions inside shift patterns</text>
  </g>
  <line x1="310" y1="260" x2="428" y2="260" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr2)"/>
  <line x1="710" y1="220" x2="828" y2="160" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr2)"/>
  <line x1="710" y1="260" x2="828" y2="260" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr2)"/>
  <line x1="710" y1="300" x2="828" y2="360" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr2)"/>
  <path d="M995,410 L995,470 L170,470 L170,372" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="400" y="460" font-size="15" fill="#64748B">Feedback loop: difficult questions and agreed answers flow back to the centre</text>
  <text x="40" y="525" font-size="15" fill="#64748B">Consistency is owned at the centre; credibility is delivered locally, by trainers each audience already trusts.</text>
</svg>
