<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Five-stage AI adoption maturity model for project management">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#2b6cb0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" rx="16"/>
  <text x="60" y="72" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="bold" fill="#f0f4f8">AI Adoption Maturity Model for Project Managers</text>
  <text x="60" y="108" font-family="Verdana, Arial, sans-serif" font-size="19" fill="#93c5fd">Where is your team today? Advance one level at a time.</text>

  <!-- Level 1 -->
  <g>
    <rect x="60" y="430" width="190" height="160" rx="10" fill="url(#bar)" opacity="0.55"/>
    <text x="90" y="150" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="bold" fill="#f0f4f8">Level 1</text>
    <text x="155" y="480" font-family="Verdana, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Curious</text>
    <text x="155" y="512" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">Ad hoc chatbots,</text>
    <text x="155" y="536" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">no policy,</text>
    <text x="155" y="560" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">heroic individuals</text>
  </g>
  <!-- Level 2 -->
  <g>
    <rect x="270" y="370" width="190" height="220" rx="10" fill="url(#bar)" opacity="0.68"/>
    <text x="365" y="420" font-family="Verdana, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Piloting</text>
    <text x="365" y="452" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">Bounded pilots,</text>
    <text x="365" y="476" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">one use case,</text>
    <text x="365" y="500" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">measured baseline,</text>
    <text x="365" y="524" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">30 to 90 days</text>
  </g>
  <!-- Level 3 -->
  <g>
    <rect x="480" y="310" width="190" height="280" rx="10" fill="url(#bar)" opacity="0.82"/>
    <text x="575" y="360" font-family="Verdana, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Governed</text>
    <text x="575" y="392" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">Pilot-Prove-Produce,</text>
    <text x="575" y="416" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">AI use policy,</text>
    <text x="575" y="440" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">human-in-the-loop,</text>
    <text x="575" y="464" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">risk register live</text>
  </g>
  <!-- Level 4 -->
  <g>
    <rect x="690" y="250" width="190" height="340" rx="10" fill="url(#bar)" opacity="0.94"/>
    <text x="785" y="300" font-family="Verdana, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Scaled</text>
    <text x="785" y="332" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">PMO-wide adoption,</text>
    <text x="785" y="356" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">value measured,</text>
    <text x="785" y="380" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">prompt libraries,</text>
    <text x="785" y="404" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">trained PMs</text>
  </g>
  <!-- Level 5 -->
  <g>
    <rect x="900" y="190" width="190" height="400" rx="10" fill="url(#bar)"/>
    <text x="995" y="240" font-family="Verdana, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Native</text>
    <text x="995" y="272" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">AI in the delivery</text>
    <text x="995" y="296" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">operating model,</text>
    <text x="995" y="320" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">continuous</text>
    <text x="995" y="344" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle">improvement loop</text>
  </g>

  <line x1="60" y1="620" x2="1090" y2="620" stroke="#93c5fd" stroke-width="2"/>
  <polygon points="1090,620 1076,613 1076,627" fill="#93c5fd"/>
  <text x="60" y="650" font-family="Verdana, Arial, sans-serif" font-size="16" fill="#93c5fd">Time and discipline increase left to right. Most teams sit at Level 1 or 2 today.</text>
</svg>
