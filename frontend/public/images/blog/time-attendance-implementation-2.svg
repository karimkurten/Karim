<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Time and attendance control diagram: a time record captured and matched to schedule and absence, rules applied, exceptions reviewed and time approved before payroll, with audit and privacy controls">
  <defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient></defs>
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="88" fill="url(#hdr)"/>
  <text x="48" y="40" font-family="Georgia, serif" font-size="29" fill="#ffffff">One Time Record, Checked Before It Becomes Pay</text>
  <text x="48" y="70" font-family="Arial, sans-serif" font-size="20" fill="#94A3B8">Capture to comparison to approval — with audit and privacy throughout</text>
  <g><rect x="40" y="112" width="340" height="200" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/><text x="64" y="146" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Time Captured</text><text x="64" y="180" font-family="Arial, sans-serif" font-size="15" fill="#475569">Employee records start,</text><text x="64" y="202" font-family="Arial, sans-serif" font-size="15" fill="#475569">finish, and breaks by the</text><text x="64" y="224" font-family="Arial, sans-serif" font-size="15" fill="#475569">method for their setting.</text><text x="64" y="246" font-family="Arial, sans-serif" font-size="15" fill="#475569">Fallback defined for failures.</text><text x="64" y="292" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Owner: Employee</text></g>
  <g><rect x="430" y="112" width="340" height="200" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="454" y="146" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Compared and Ruled</text><text x="454" y="180" font-family="Arial, sans-serif" font-size="15" fill="#475569">Actual time matched to the</text><text x="454" y="202" font-family="Arial, sans-serif" font-size="15" fill="#475569">roster and approved absence.</text><text x="454" y="224" font-family="Arial, sans-serif" font-size="15" fill="#475569">Pay rules applied in the</text><text x="454" y="246" font-family="Arial, sans-serif" font-size="15" fill="#475569">defined order.</text><text x="454" y="292" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Owner: System, Ops</text></g>
  <g><rect x="820" y="112" width="340" height="200" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="844" y="146" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Exceptions and Approval</text><text x="844" y="180" font-family="Arial, sans-serif" font-size="15" fill="#475569">Pay-changing exceptions</text><text x="844" y="202" font-family="Arial, sans-serif" font-size="15" fill="#475569">reviewed; time approved</text><text x="844" y="224" font-family="Arial, sans-serif" font-size="15" fill="#475569">or held by the deadline</text><text x="844" y="246" font-family="Arial, sans-serif" font-size="15" fill="#475569">rule, published in advance.</text><text x="844" y="292" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Owner: Supervisor</text></g>
  <g><rect x="40" y="344" width="340" height="140" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="64" y="378" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Payroll Handoff</text><text x="64" y="412" font-family="Arial, sans-serif" font-size="15" fill="#475569">Approved totals flow to</text><text x="64" y="434" font-family="Arial, sans-serif" font-size="15" fill="#475569">payroll with rule detail.</text><text x="64" y="464" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Effect: Payroll</text></g>
  <g><rect x="430" y="344" width="340" height="140" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="454" y="378" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Employee View</text><text x="454" y="412" font-family="Arial, sans-serif" font-size="15" fill="#475569">Punches, edits, and applied</text><text x="454" y="434" font-family="Arial, sans-serif" font-size="15" fill="#475569">rules visible to the employee.</text><text x="454" y="464" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Effect: Trust</text></g>
  <g><rect x="820" y="344" width="340" height="140" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="844" y="378" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Dispute Route</text><text x="844" y="412" font-family="Arial, sans-serif" font-size="15" fill="#475569">A clear query route with a</text><text x="844" y="434" font-family="Arial, sans-serif" font-size="15" fill="#475569">correction commitment.</text><text x="844" y="464" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Effect: Fairness</text></g>
  <rect x="40" y="508" width="1120" height="72" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="540" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Audit and privacy strip</text>
  <text x="64" y="566" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Original values preserved, edits approved and visible, biometric collection only by deliberate, advised decision.</text>
  <text x="40" y="612" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Figure 2 — Time and attendance control diagram</text>
</svg>