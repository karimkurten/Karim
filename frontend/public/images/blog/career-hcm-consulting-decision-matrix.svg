<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Career decision matrix plotting entry routes by speed of entry against depth of specialization">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#2b6cb0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" rx="16"/>
  <text x="60" y="70" font-family="Verdana, Arial, sans-serif" font-size="32" font-weight="bold" fill="#f0f4f8">Career Entry Routes — Speed vs. Specialization Depth</text>
  <text x="60" y="104" font-family="Verdana, Arial, sans-serif" font-size="18" fill="#93c5fd">Choose the quadrant that matches the capital you already own.</text>
<rect x="190" y="150" width="880" height="420" fill="#1e3a5f" opacity="0.45" rx="10"/><line x1="630" y1="150" x2="630" y2="570" stroke="#93c5fd" stroke-width="1.5" opacity="0.6"/><line x1="190" y1="360" x2="1070" y2="360" stroke="#93c5fd" stroke-width="1.5" opacity="0.6"/><rect x="210" y="170" width="400" height="170" rx="8" fill="url(#bar)" opacity="0.95"/><text x="228" y="204" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="bold" fill="#93c5fd">SLOWER ENTRY - DEEP</text><text x="228" y="234" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">Specialist build</text><text x="228" y="262" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#e2e8f0">Payroll / cross-border depth</text><text x="228" y="284" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#e2e8f0">Highest long-run pricing</text><rect x="650" y="170" width="400" height="170" rx="8" fill="url(#bar)" opacity="0.8"/><text x="668" y="204" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="bold" fill="#93c5fd">FAST ENTRY - DEEP</text><text x="668" y="234" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">Domain-insider conversion</text><text x="668" y="262" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#e2e8f0">Payroll or HR lead on a</text><text x="668" y="284" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#e2e8f0">live implementation</text><rect x="210" y="380" width="400" height="170" rx="8" fill="url(#bar)" opacity="0.4"/><text x="228" y="414" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="bold" fill="#93c5fd">SLOWER ENTRY - GENERAL</text><text x="228" y="444" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">Drift risk zone</text><text x="228" y="472" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#e2e8f0">Credentials without a</text><text x="228" y="494" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#e2e8f0">beachhead or scope</text><rect x="650" y="380" width="400" height="170" rx="8" fill="url(#bar)" opacity="0.65"/><text x="668" y="414" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="bold" fill="#93c5fd">FAST ENTRY - GENERAL</text><text x="668" y="444" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">Associate programs</text><text x="668" y="472" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#e2e8f0">Vendor / partner academies,</text><text x="668" y="494" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#e2e8f0">project-adjacent roles</text><text x="630" y="608" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#f0f4f8" text-anchor="middle">Depth of specialization &#8594;</text><text x="70" y="360" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="bold" fill="#f0f4f8" text-anchor="middle" transform="rotate(-90 70 360)">Speed of entry &#8594;</text><text x="60" y="640" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#93c5fd">Rule: enter through the quadrant your existing capital supports; specialize after two full delivery cycles.</text></svg>