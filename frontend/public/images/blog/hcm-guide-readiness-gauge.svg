<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Go-live readiness gauge showing verification checkpoints across workstreams">
  <rect x="0" y="0" width="1200" height="700" fill="#F4F6F8"/>
  <rect x="16" y="16" width="1168" height="668" rx="16" fill="#FFFFFF"/>

  <text x="60" y="66" font-size="26" font-weight="700" fill="#16294A">Go-Live Readiness: Eight Gates, One Decision</text>
  <text x="60" y="94" font-size="14" fill="#5A6C7D">Verification checkpoints across workstreams, converging on the go / no-go decision.</text>

  <!-- Arc base -->
  <path d="M 150,480 A 300,300 0 0 1 750,480" fill="none" stroke="#DCE4EE" stroke-width="10" stroke-linecap="round"/>

  <!-- Connector lines from checkpoints to center -->
  <g stroke="#B9C7DA" stroke-width="2">
    <line x1="150" y1="480" x2="450" y2="480"/>
    <line x1="180" y1="350" x2="450" y2="480"/>
    <line x1="263" y1="245" x2="450" y2="480"/>
    <line x1="383" y1="188" x2="450" y2="480"/>
    <line x1="517" y1="188" x2="450" y2="480"/>
    <line x1="637" y1="245" x2="450" y2="480"/>
    <line x1="720" y1="350" x2="450" y2="480"/>
    <line x1="750" y1="480" x2="450" y2="480"/>
  </g>

  <!-- Center decision card -->
  <rect x="330" y="418" width="240" height="124" rx="14" fill="#E8A33D" stroke="#16294A" stroke-width="2"/>
  <text x="450" y="456" font-size="22" font-weight="800" fill="#16294A" text-anchor="middle">GO / NO-GO</text>
  <text x="450" y="482" font-size="12" fill="#16294A" text-anchor="middle">Decided by the executive sponsor</text>
  <text x="450" y="501" font-size="12" fill="#16294A" text-anchor="middle">— all eight gates verified</text>
  <text x="450" y="520" font-size="12" fill="#16294A" text-anchor="middle">in writing, before the date</text>

  <!-- Checkpoint dots -->
  <g font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="150" cy="480" r="22" fill="#1E3A5F"/><text x="150" y="485">1</text>
    <circle cx="180" cy="350" r="22" fill="#1E3A5F"/><text x="180" y="355">2</text>
    <circle cx="263" cy="245" r="22" fill="#1E3A5F"/><text x="263" y="250">3</text>
    <circle cx="383" cy="188" r="22" fill="#1E3A5F"/><text x="383" y="193">4</text>
    <circle cx="517" cy="188" r="22" fill="#1E3A5F"/><text x="517" y="193">5</text>
    <circle cx="637" cy="245" r="22" fill="#1E3A5F"/><text x="637" y="250">6</text>
    <circle cx="720" cy="350" r="22" fill="#1E3A5F"/><text x="720" y="355">7</text>
    <circle cx="750" cy="480" r="22" fill="#1E3A5F"/><text x="750" y="485">8</text>
  </g>

  <!-- Right checklist panel -->
  <g>
    <rect x="790" y="118" width="350" height="452" rx="12" fill="#FFFFFF" stroke="#DCE4EE" stroke-width="2"/>
    <text x="810" y="148" font-size="14" font-weight="700" fill="#16294A">Workstream gate criteria</text>
    <g font-size="12">
      <text x="810" y="176" font-weight="700" fill="#1E3A5F">1 · Configuration</text>
      <text x="810" y="193" fill="#5A6C7D">Built per signed design, reviewed</text>
      <text x="810" y="218" font-weight="700" fill="#1E3A5F">2 · Data</text>
      <text x="810" y="235" fill="#5A6C7D">Final mock load reconciled, business sign-off</text>
      <text x="810" y="260" font-weight="700" fill="#1E3A5F">3 · Testing</text>
      <text x="810" y="277" fill="#5A6C7D">UAT signed by process owners; criticals at zero</text>
      <text x="810" y="302" font-weight="700" fill="#1E3A5F">4 · Payroll</text>
      <text x="810" y="319" fill="#5A6C7D">Parallel run reconciled</text>
      <text x="810" y="344" font-weight="700" fill="#1E3A5F">5 · Compliance</text>
      <text x="810" y="361" fill="#5A6C7D">Tax setup validated per jurisdiction</text>
      <text x="810" y="386" font-weight="700" fill="#1E3A5F">6 · Training</text>
      <text x="810" y="403" fill="#5A6C7D">Completion targets met (managers ≥ 90%)</text>
      <text x="810" y="428" font-weight="700" fill="#1E3A5F">7 · Cutover</text>
      <text x="810" y="445" fill="#5A6C7D">Runbook finalized; mock go-live completed</text>
      <text x="810" y="470" font-weight="700" fill="#1E3A5F">8 · Support</text>
      <text x="810" y="487" fill="#5A6C7D">Hypercare roster, SLAs, exit criteria agreed</text>
    </g>
  </g>

  <text x="60" y="640" font-size="12" font-style="italic" fill="#5A6C7D">A go-live that slips but pays everyone correctly is a success with a scheduling problem — the reverse is a failure.</text>
</svg>
