<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Diagram of the three migration passes: trial load, full mock load, and production load, with defects feeding back into cleansing">
  <defs>
    <marker id="arr2" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L10,6 L0,12 z" fill="#E8A33D"/>
    </marker>
    <marker id="arrBack" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L10,6 L0,12 z" fill="#1E3A5F"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="500" fill="#F4F6F8"/>
  <text x="600" y="56" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#1E3A5F">The three migration passes</text>

  <!-- Pass 1 -->
  <g>
    <rect x="55" y="110" width="290" height="210" rx="16" fill="#FFFFFF" stroke="#DCE3EA" stroke-width="2"/>
    <circle cx="200" cy="152" r="22" fill="#1E3A5F"/>
    <text x="200" y="160" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#E8A33D">1</text>
    <text x="200" y="208" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#1E3A5F">Trial load</text>
    <rect x="165" y="220" width="70" height="4" rx="2" fill="#E8A33D"/>
    <text x="200" y="248" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#5A6B7D">Test environment</text>
    <text x="200" y="274" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#5A6B7D">validates the mechanics</text>
  </g>

  <!-- Pass 2 -->
  <g>
    <rect x="455" y="110" width="290" height="210" rx="16" fill="#FFFFFF" stroke="#DCE3EA" stroke-width="2"/>
    <circle cx="600" cy="152" r="22" fill="#1E3A5F"/>
    <text x="600" y="160" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#E8A33D">2</text>
    <text x="600" y="208" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#1E3A5F">Full mock load</text>
    <rect x="565" y="220" width="70" height="4" rx="2" fill="#E8A33D"/>
    <text x="600" y="248" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#5A6B7D">Validates the data,</text>
    <text x="600" y="274" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#5A6B7D">reconciled completely</text>
  </g>

  <!-- Pass 3 -->
  <g>
    <rect x="855" y="110" width="290" height="210" rx="16" fill="#1E3A5F"/>
    <circle cx="1000" cy="152" r="22" fill="#E8A33D"/>
    <text x="1000" y="160" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#1E3A5F">3</text>
    <text x="1000" y="208" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Production load</text>
    <rect x="965" y="220" width="70" height="4" rx="2" fill="#E8A33D"/>
    <text x="1000" y="248" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#C7D2DE">Cutover window —</text>
    <text x="1000" y="274" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#C7D2DE">the real thing</text>
  </g>

  <!-- Forward arrows -->
  <line x1="357" y1="215" x2="443" y2="215" stroke="#E8A33D" stroke-width="3" marker-end="url(#arr2)"/>
  <line x1="757" y1="215" x2="843" y2="215" stroke="#E8A33D" stroke-width="3" marker-end="url(#arr2)"/>

  <!-- Return feedback loop -->
  <path d="M 1000 320 L 1000 400 L 200 400 L 200 332" fill="none" stroke="#1E3A5F" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrBack)"/>
  <text x="600" y="450" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-style="italic" fill="#1E3A5F">Same defects twice? Fix the cleansing process, not just the data.</text>
</svg>
