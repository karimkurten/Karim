<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Arial, Helvetica, sans-serif">
<defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient></defs>
<rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="72" fill="url(#hdr)"/>
<text x="40" y="45" font-size="26" font-weight="bold" fill="#ffffff">Priority conflict map: four conflict types</text>
<text x="40" y="105" font-size="15" fill="#64748B">Conflicts are structural, not personal — name the source first, because each type resolves through a different route.</text>
<rect x="30" y="130" width="230" height="44" rx="8" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
<text x="44" y="158" font-size="15" font-weight="bold" fill="#1A202C">Conflict type</text>
<rect x="270" y="130" width="430" height="44" rx="8" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
<text x="284" y="158" font-size="15" font-weight="bold" fill="#1A202C">Where it comes from</text>
<rect x="710" y="130" width="460" height="44" rx="8" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
<text x="724" y="158" font-size="15" font-weight="bold" fill="#1A202C">Resolution route</text>
<rect x="38" y="196" width="230" height="88" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<rect x="30" y="188" width="230" height="88" rx="10" fill="#ffffff" stroke="#2B6CB0" stroke-width="2"/>
<text x="44" y="222" font-size="15" font-weight="bold" fill="#1A202C">Scope vs date</text>
<rect x="278" y="196" width="430" height="88" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<rect x="270" y="188" width="430" height="88" rx="10" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
<text x="284" y="218" font-size="13" fill="#475569">More functionality demanded inside a fixed window;</text>
<text x="284" y="237" font-size="13" fill="#475569">both stated as non-negotiable.</text>
<rect x="718" y="196" width="460" height="88" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<rect x="710" y="188" width="460" height="88" rx="10" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
<text x="724" y="218" font-size="13" fill="#475569">Price the options, then decide at sponsor level: phase</text>
<text x="724" y="237" font-size="13" fill="#475569">the scope, move the date, or add capacity.</text>
<rect x="38" y="292" width="230" height="88" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<rect x="30" y="284" width="230" height="88" rx="10" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
<text x="44" y="318" font-size="15" font-weight="bold" fill="#1A202C">Local vs global process</text>
<rect x="278" y="292" width="430" height="88" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<rect x="270" y="284" width="430" height="88" rx="10" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
<text x="284" y="314" font-size="13" fill="#475569">A standard process protects reporting and support;</text>
<text x="284" y="333" font-size="13" fill="#475569">local practice grew up for a real reason.</text>
<rect x="718" y="292" width="460" height="88" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<rect x="710" y="284" width="460" height="88" rx="10" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
<text x="724" y="314" font-size="13" fill="#475569">Surface the local constraint; allow a configured</text>
<text x="724" y="333" font-size="13" fill="#475569">exception before a separate local process.</text>
<rect x="38" y="388" width="230" height="88" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<rect x="30" y="380" width="230" height="88" rx="10" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
<text x="44" y="414" font-size="15" font-weight="bold" fill="#1A202C">Compliance vs</text>
<text x="44" y="436" font-size="15" font-weight="bold" fill="#1A202C">convenience</text>
<rect x="278" y="388" width="430" height="88" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<rect x="270" y="380" width="430" height="88" rx="10" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
<text x="284" y="410" font-size="13" fill="#475569">Statutory deadlines and audit rules feel like</text>
<text x="284" y="429" font-size="13" fill="#475569">friction to managers focused on daily operations.</text>
<rect x="718" y="388" width="460" height="88" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<rect x="710" y="380" width="460" height="88" rx="10" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
<text x="724" y="410" font-size="13" fill="#475569">Treat compliance as a fixed constraint; arbitrate only</text>
<text x="724" y="429" font-size="13" fill="#475569">how work is organised around it.</text>
<rect x="38" y="484" width="230" height="88" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<rect x="30" y="476" width="230" height="88" rx="10" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
<text x="44" y="510" font-size="15" font-weight="bold" fill="#1A202C">Capacity vs ambition</text>
<rect x="278" y="484" width="430" height="88" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<rect x="270" y="476" width="430" height="88" rx="10" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
<text x="284" y="506" font-size="13" fill="#475569">The experts needed for design and testing are the</text>
<text x="284" y="525" font-size="13" fill="#475569">people departments can least spare.</text>
<rect x="718" y="484" width="460" height="88" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<rect x="710" y="476" width="460" height="88" rx="10" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
<text x="724" y="506" font-size="13" fill="#475569">Agree named people and protected time early; escalate</text>
<text x="724" y="525" font-size="13" fill="#475569">any shortfall as a dated project risk.</text>
<rect x="30" y="684" width="1140" height="52" rx="8" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
<text x="54" y="716" font-size="15" font-weight="bold" fill="#1A202C">Name the type first: the source of the conflict tells you which resolution route will settle it.</text>
</svg>