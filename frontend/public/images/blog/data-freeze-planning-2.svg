<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="The freeze communication and control sequence from announcement to thaw">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2B6CB0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="92" fill="url(#hdr)"/>
  <text x="48" y="46" font-family="Georgia, serif" font-size="30" fill="#ffffff">The Freeze Sequence</text>
  <text x="48" y="74" font-family="Arial, sans-serif" font-size="16" fill="#94A3B8">Six stages from announcement to thaw — each with its owner and its message</text>

  <!-- row 1 -->
  <g>
    <rect x="40" y="140" width="360" height="170" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="64" y="178" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">1 · Announce the Scope</text>
    <text x="64" y="208" font-family="Arial, sans-serif" font-size="14" fill="#475569">Scope categories and freeze dates</text>
    <text x="64" y="232" font-family="Arial, sans-serif" font-size="14" fill="#475569">published when the freeze is agreed</text>
    <text x="64" y="262" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Message: what freezes, and when</text>
    <text x="64" y="286" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Owner: cutover lead</text>
  </g>
  <path d="M 404 225 L 416 225" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>
  <g>
    <rect x="420" y="140" width="360" height="170" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="444" y="178" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">2 · Remind and Publish</text>
    <text x="444" y="208" font-family="Arial, sans-serif" font-size="14" fill="#475569">Reminder as the window approaches,</text>
    <text x="444" y="232" font-family="Arial, sans-serif" font-size="14" fill="#475569">with the exception route attached</text>
    <text x="444" y="262" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Message: what to do with urgency</text>
    <text x="444" y="286" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Owner: HR and payroll leads</text>
  </g>
  <path d="M 784 225 L 796 225" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>
  <g>
    <rect x="800" y="140" width="360" height="170" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="824" y="178" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">3 · Enforce</text>
    <text x="824" y="208" font-family="Arial, sans-serif" font-size="14" fill="#475569">Update access restricted at the</text>
    <text x="824" y="232" font-family="Arial, sans-serif" font-size="14" fill="#475569">timestamp, auditing switched on</text>
    <text x="824" y="262" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Message: the freeze is now live</text>
    <text x="824" y="286" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Owner: system administrator</text>
  </g>

  <!-- wrap connector -->
  <path d="M 980 314 L 980 332 L 220 332 L 220 346" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>

  <!-- row 2 -->
  <g>
    <rect x="40" y="350" width="360" height="170" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="64" y="388" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">4 · Exception Window</text>
    <text x="64" y="418" font-family="Arial, sans-serif" font-size="14" fill="#475569">Urgent changes approved, logged,</text>
    <text x="64" y="442" font-family="Arial, sans-serif" font-size="14" fill="#475569">and queued for reconciliation</text>
    <text x="64" y="472" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Message: the route is working</text>
    <text x="64" y="496" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Owner: exception approver</text>
  </g>
  <path d="M 404 435 L 416 435" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>
  <g>
    <rect x="420" y="350" width="360" height="170" rx="12" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="2"/>
    <text x="444" y="388" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#ffffff">5 · Extract and Convert</text>
    <text x="444" y="418" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">Final extract taken, control totals</text>
    <text x="444" y="442" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">validated, conversion runs</text>
    <text x="444" y="472" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Message: extract totals agreed</text>
    <text x="444" y="496" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Owner: data lead</text>
  </g>
  <path d="M 784 435 L 796 435" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>
  <g>
    <rect x="800" y="350" width="360" height="170" rx="12" fill="#ffffff" stroke="#2B6CB0" stroke-width="2"/>
    <text x="824" y="388" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">6 · Thaw by Criteria</text>
    <text x="824" y="418" font-family="Arial, sans-serif" font-size="14" fill="#475569">Conversion verified, exceptions</text>
    <text x="824" y="442" font-family="Arial, sans-serif" font-size="14" fill="#475569">reconciled, one system of record</text>
    <text x="824" y="472" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Message: the new system is live</text>
    <text x="824" y="496" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Owner: decision-maker</text>
  </g>

  <rect x="40" y="556" width="1120" height="92" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="592" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A202C">Every stage repeats the two facts people need — what is frozen,</text>
  <text x="64" y="620" font-family="Arial, sans-serif" font-size="15" fill="#475569">and what to do with an urgent change — because those facts prevent the quiet workaround.</text>
</svg>
