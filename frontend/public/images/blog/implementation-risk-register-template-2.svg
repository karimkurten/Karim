<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="780" height="600" rx="16" fill="#F4F6F8"/>
  <text x="40" y="48" font-size="24" font-weight="700" fill="#16294A">Risk Scoring Matrix — Probability × Impact</text>
  <text x="40" y="76" font-size="14" fill="#5A6C7D">Score = probability × impact on a 3×3 grid.</text>

  <!-- Column labels -->
  <g font-size="14" font-weight="600" fill="#1E3A5F" text-anchor="middle">
    <text x="290" y="106">Low impact (1)</text>
    <text x="410" y="106">Medium impact (2)</text>
    <text x="530" y="106">High impact (3)</text>
  </g>

  <!-- Row labels -->
  <g font-size="14" font-weight="600" fill="#1E3A5F" text-anchor="end">
    <text x="216" y="196">High prob (3)</text>
    <text x="216" y="316">Medium prob (2)</text>
    <text x="216" y="436">Low prob (1)</text>
  </g>

  <!-- Grid cells: (fill, text color) by score zone -->
  <g text-anchor="middle" font-size="44" font-weight="700">
    <!-- High prob row: 3, 6, 9 -->
    <rect x="230" y="120" width="120" height="120" rx="8" fill="#5DA85D"/>
    <text x="290" y="197" fill="#FFFFFF">3</text>
    <rect x="350" y="120" width="120" height="120" rx="8" fill="#E8A33D"/>
    <text x="410" y="197" fill="#16294A">6</text>
    <rect x="470" y="120" width="120" height="120" rx="8" fill="#D64541"/>
    <text x="530" y="197" fill="#FFFFFF">9</text>
    <!-- Medium prob row: 2, 4, 6 -->
    <rect x="230" y="240" width="120" height="120" rx="8" fill="#5DA85D"/>
    <text x="290" y="317" fill="#FFFFFF">2</text>
    <rect x="350" y="240" width="120" height="120" rx="8" fill="#E8A33D"/>
    <text x="410" y="317" fill="#16294A">4</text>
    <rect x="470" y="240" width="120" height="120" rx="8" fill="#E8A33D"/>
    <text x="530" y="317" fill="#16294A">6</text>
    <!-- Low prob row: 1, 2, 3 -->
    <rect x="230" y="360" width="120" height="120" rx="8" fill="#5DA85D"/>
    <text x="290" y="437" fill="#FFFFFF">1</text>
    <rect x="350" y="360" width="120" height="120" rx="8" fill="#5DA85D"/>
    <text x="410" y="437" fill="#FFFFFF">2</text>
    <rect x="470" y="360" width="120" height="120" rx="8" fill="#5DA85D"/>
    <text x="530" y="437" fill="#FFFFFF">3</text>
  </g>

  <!-- Legend -->
  <g font-size="15" fill="#34495E">
    <rect x="40" y="500" width="28" height="28" rx="6" fill="#D64541"/>
    <text x="78" y="521"><tspan font-weight="700" fill="#16294A">7–9 · Red</tspan> — active plan, executive visibility, weekly review.</text>
    <rect x="40" y="536" width="28" height="28" rx="6" fill="#E8A33D"/>
    <text x="78" y="557"><tspan font-weight="700" fill="#16294A">4–6 · Amber</tspan> — plan drafted, biweekly review.</text>
    <rect x="40" y="572" width="28" height="28" rx="6" fill="#5DA85D"/>
    <text x="78" y="593"><tspan font-weight="700" fill="#16294A">1–3 · Green</tspan> — watchlist, monthly review.</text>
  </g>
</svg>
