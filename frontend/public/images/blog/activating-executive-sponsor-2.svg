<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Arial, Helvetica, sans-serif">
<defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B6CB0"/></marker></defs>
<rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="72" fill="url(#hdr)"/>
<text x="40" y="45" font-size="26" font-weight="bold" fill="#ffffff">The sponsor calendar: visible moments across the phases</text>
<text x="40" y="105" font-size="15" fill="#64748B">Sponsorship becomes real at specific moments — put them on the sponsor&apos;s calendar like any deliverable.</text>
<rect x="38" y="138" width="520" height="84" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<rect x="30" y="130" width="520" height="84" rx="10" fill="#ffffff" stroke="#2B6CB0" stroke-width="2"/>
<text x="54" y="164" font-size="16" font-weight="bold" fill="#1A202C">1 — Kickoff</text>
<text x="54" y="188" font-size="13" fill="#475569">Sponsor opens the project and states why it matters, in their own words.</text>
<rect x="598" y="138" width="572" height="84" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<rect x="590" y="130" width="572" height="84" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<text x="614" y="164" font-size="13" font-weight="bold" fill="#1A202C">Sets legitimacy</text>
<text x="614" y="188" font-size="13" fill="#475569">Leaders hear the mandate from the person who owns it.</text>
<line x1="290" y1="222" x2="290" y2="238" stroke="#2B6CB0" stroke-width="2" marker-end="url(#arr)"/>
<rect x="38" y="254" width="520" height="84" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<rect x="30" y="246" width="520" height="84" rx="10" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
<text x="54" y="280" font-size="16" font-weight="bold" fill="#1A202C">2 — Design sign-off</text>
<text x="54" y="304" font-size="13" fill="#475569">Sponsor confirms the design direction and the trade-offs it locks in.</text>
<rect x="598" y="254" width="572" height="84" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<rect x="590" y="246" width="572" height="84" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<text x="614" y="280" font-size="13" font-weight="bold" fill="#1A202C">Locks the direction</text>
<text x="614" y="304" font-size="13" fill="#475569">Settled questions stop reopening; late changes use change control.</text>
<line x1="290" y1="338" x2="290" y2="354" stroke="#2B6CB0" stroke-width="2" marker-end="url(#arr)"/>
<rect x="38" y="370" width="520" height="84" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<rect x="30" y="362" width="520" height="84" rx="10" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
<text x="54" y="396" font-size="16" font-weight="bold" fill="#1A202C">3 — Build and testing</text>
<text x="54" y="420" font-size="13" fill="#475569">Sponsor reviews progress, clears blockers, protects testing time.</text>
<rect x="598" y="370" width="572" height="84" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<rect x="590" y="362" width="572" height="84" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<text x="614" y="396" font-size="13" font-weight="bold" fill="#1A202C">Clears blockers</text>
<text x="614" y="420" font-size="13" fill="#475569">Cross-functional obstacles move in days, not reporting cycles.</text>
<line x1="290" y1="454" x2="290" y2="470" stroke="#2B6CB0" stroke-width="2" marker-end="url(#arr)"/>
<rect x="38" y="486" width="520" height="84" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<rect x="30" y="478" width="520" height="84" rx="10" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
<text x="54" y="512" font-size="16" font-weight="bold" fill="#1A202C">4 — Go / no-go</text>
<text x="54" y="536" font-size="13" fill="#475569">Sponsor chairs the readiness decision and owns the call that follows.</text>
<rect x="598" y="486" width="572" height="84" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<rect x="590" y="478" width="572" height="84" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<text x="614" y="512" font-size="13" font-weight="bold" fill="#1A202C">Owns the call</text>
<text x="614" y="536" font-size="13" fill="#475569">Go, delay, or phased launch is decided on evidence, not pressure.</text>
<line x1="290" y1="570" x2="290" y2="586" stroke="#2B6CB0" stroke-width="2" marker-end="url(#arr)"/>
<rect x="38" y="602" width="520" height="84" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<rect x="30" y="594" width="520" height="84" rx="10" fill="#ffffff" stroke="#2B6CB0" stroke-width="2"/>
<text x="54" y="628" font-size="16" font-weight="bold" fill="#1A202C">5 — Hypercare</text>
<text x="54" y="652" font-size="13" fill="#475569">Sponsor stays visible, thanks the teams, keeps escalations fast.</text>
<rect x="598" y="602" width="572" height="84" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<rect x="590" y="594" width="572" height="84" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<text x="614" y="628" font-size="13" font-weight="bold" fill="#1A202C">Holds the line</text>
<text x="614" y="652" font-size="13" fill="#475569">Early problems surface in the open instead of quiet workarounds.</text>
</svg>
