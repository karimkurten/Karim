<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-label="Comparison of API and flat-file integration patterns across latency, volume, error visibility, reprocessing, and counterparty fit.">
  <defs>
    <filter id="hia2-ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="740" fill="#ffffff"/>
  <text x="40" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1A202C">API vs flat-file: choosing the interface pattern</text>
  <text x="40" y="80" font-family="Arial, sans-serif" font-size="15" fill="#64748B">Five decision factors, decided per interface — never by preference.</text>

  <!-- Column headers -->
  <text x="285" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2B6CB0">API (real-time)</text>
  <text x="915" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#64748B">Flat file (batch)</text>

  <!-- Rows -->
  <g filter="url(#hia2-ds)" font-family="Arial, sans-serif">
    <g>
      <rect x="60" y="150" width="1080" height="88" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="600" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A202C">Latency</text>
      <text x="90" y="214" font-size="15" fill="#475569">Minutes — data moves when the event happens</text>
      <text x="720" y="214" font-size="15" fill="#475569">Next-day — data moves on the schedule</text>
    </g>
    <g>
      <rect x="60" y="250" width="1080" height="88" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="600" y="280" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A202C">Volume</text>
      <text x="90" y="314" font-size="15" fill="#475569">Frequent small payloads</text>
      <text x="720" y="314" font-size="15" fill="#475569">Bulk extracts</text>
    </g>
    <g>
      <rect x="60" y="350" width="1080" height="88" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="600" y="380" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A202C">Error visibility</text>
      <text x="90" y="414" font-size="15" fill="#475569">Immediate failure signal</text>
      <text x="720" y="414" font-size="15" fill="#475569">Surfaces at reconciliation</text>
    </g>
    <g>
      <rect x="60" y="450" width="1080" height="88" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="600" y="480" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A202C">Reprocessing</text>
      <text x="90" y="514" font-size="15" fill="#475569">Retry with dead-letter queue</text>
      <text x="720" y="514" font-size="15" fill="#475569">Re-send with sequence control totals</text>
    </g>
    <g>
      <rect x="60" y="550" width="1080" height="88" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="1.5"/>
      <text x="600" y="580" text-anchor="middle" font-size="16" font-weight="bold" fill="#1A202C">Counterparty fit</text>
      <text x="90" y="614" font-size="15" fill="#475569">Modern endpoints, identity, ATS</text>
      <text x="720" y="614" font-size="15" fill="#475569">Carriers, banks, payroll results</text>
    </g>
  </g>

  <!-- Column divider accents -->
  <g>
    <rect x="60" y="142" width="450" height="5" rx="2.5" fill="#2B6CB0"/>
    <rect x="690" y="142" width="450" height="5" rx="2.5" fill="#64748B"/>
  </g>

  <text x="600" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="#64748B">The pattern follows the data — latency, volume, idempotency, and the counterparty's real capability.</text>
</svg>
