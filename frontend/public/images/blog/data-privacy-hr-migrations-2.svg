<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690" role="img" aria-label="Privacy-by-design activities mapped across five migration phases">
  <defs>
    <linearGradient id="heroGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="cardDepth2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F0F4F8" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="softShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="690" fill="#F8FAFC"/>

  <!-- Header -->
  <rect x="40" y="24" width="1320" height="88" rx="14" fill="url(#heroGrad2)" filter="url(#softShadow2)"/>
  <text x="700" y="60" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="30" fill="#ffffff">Privacy by Design Across the Migration Timeline</text>
  <text x="700" y="90" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#94A3B8">A privacy activity in every phase — not a workstream tacked on at the end</text>

  <!-- Connecting accent line -->
  <line x1="110" y1="260" x2="1290" y2="260" stroke="#2B6CB0" stroke-width="4"/>

  <!-- Phase 1: Discover -->
  <g>
    <circle cx="110" cy="260" r="18" fill="#2B6CB0" filter="url(#softShadow2)"/>
    <text x="110" y="266" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">1</text>
    <rect x="40" y="150" width="220" height="460" rx="12" fill="url(#cardDepth2)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow2)"/>
    <text x="150" y="182" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="20" fill="#1A202C">Discover</text>
    <line x1="60" y1="196" x2="240" y2="196" stroke="#E2E8F0" stroke-width="1"/>
    <g font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#475569">
      <text x="60" y="228">Inventory every personal</text>
      <text x="60" y="248">data element in scope</text>
      <text x="60" y="290">Locate sensitive-special fields</text>
      <text x="60" y="310">(SIN, bank, medical)</text>
      <text x="60" y="352">Map where each element</text>
      <text x="60" y="372">currently lives</text>
    </g>
    <text x="150" y="592" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">Owner: data team</text>
  </g>

  <!-- Phase 2: Design -->
  <g>
    <circle cx="400" cy="260" r="18" fill="#2B6CB0" filter="url(#softShadow2)"/>
    <text x="400" y="266" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">2</text>
    <rect x="330" y="150" width="220" height="460" rx="12" fill="url(#cardDepth2)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow2)"/>
    <text x="440" y="182" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="20" fill="#1A202C">Design</text>
    <line x1="350" y1="196" x2="530" y2="196" stroke="#E2E8F0" stroke-width="1"/>
    <g font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#475569">
      <text x="350" y="228">Classify: migrate / archive /</text>
      <text x="350" y="248">purge, with sign-off</text>
      <text x="350" y="290">Counsel review: PIPEDA,</text>
      <text x="350" y="310">Law 25, PIPA obligations</text>
      <text x="350" y="352">Plan retention handling and</text>
      <text x="350" y="372">test-data de-identification</text>
    </g>
    <text x="440" y="592" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">Owner: business + counsel</text>
  </g>

  <!-- Phase 3: Build & Test -->
  <g>
    <circle cx="690" cy="260" r="18" fill="#2B6CB0" filter="url(#softShadow2)"/>
    <text x="690" y="266" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">3</text>
    <rect x="620" y="150" width="220" height="460" rx="12" fill="url(#cardDepth2)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow2)"/>
    <text x="730" y="182" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="20" fill="#1A202C">Build &amp; Test</text>
    <line x1="640" y1="196" x2="820" y2="196" stroke="#E2E8F0" stroke-width="1"/>
    <g font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#475569">
      <text x="640" y="228">Control extraction files and</text>
      <text x="640" y="248">mapping spreadsheets</text>
      <text x="640" y="290">De-identify test data:</text>
      <text x="640" y="310">fake SINs, masked accounts</text>
      <text x="640" y="352">Encrypt files at rest and</text>
      <text x="640" y="372">in transit</text>
    </g>
    <text x="730" y="592" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">Owner: test lead</text>
  </g>

  <!-- Phase 4: Validate -->
  <g>
    <circle cx="980" cy="260" r="18" fill="#2B6CB0" filter="url(#softShadow2)"/>
    <text x="980" y="266" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">4</text>
    <rect x="910" y="150" width="220" height="460" rx="12" fill="url(#cardDepth2)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow2)"/>
    <text x="1020" y="182" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="20" fill="#1A202C">Validate</text>
    <line x1="930" y1="196" x2="1110" y2="196" stroke="#E2E8F0" stroke-width="1"/>
    <g font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#475569">
      <text x="930" y="228">Verify masking rules and</text>
      <text x="930" y="248">access controls work</text>
      <text x="930" y="290">Confirm purged records are</text>
      <text x="930" y="310">truly gone</text>
      <text x="930" y="352">Confirm archived records are</text>
      <text x="930" y="372">inaccessible to standard users</text>
    </g>
    <text x="1020" y="592" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">Owner: QA + privacy officer</text>
  </g>

  <!-- Phase 5: Cutover -->
  <g>
    <circle cx="1270" cy="260" r="18" fill="#2B6CB0" filter="url(#softShadow2)"/>
    <text x="1270" y="266" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">5</text>
    <rect x="1200" y="150" width="160" height="460" rx="12" fill="url(#cardDepth2)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow2)"/>
    <text x="1280" y="182" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="20" fill="#1A202C">Cutover</text>
    <line x1="1214" y1="196" x2="1346" y2="196" stroke="#E2E8F0" stroke-width="1"/>
    <g font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">
      <text x="1214" y="228">Decommission</text>
      <text x="1214" y="248">legacy copies</text>
      <text x="1214" y="290">Retire test tenants</text>
      <text x="1214" y="310">and extracts</text>
      <text x="1214" y="352">Keep the 24-month</text>
      <text x="1214" y="372">breach record log</text>
    </g>
    <text x="1280" y="592" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">Owner: PM</text>
  </g>

  <!-- Phase connector dots on the line -->
  <g fill="#ffffff" stroke="#2B6CB0" stroke-width="3">
    <circle cx="255" cy="260" r="6"/>
    <circle cx="545" cy="260" r="6"/>
    <circle cx="835" cy="260" r="6"/>
    <circle cx="1125" cy="260" r="6"/>
  </g>

  <!-- Footer note -->
  <text x="700" y="660" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94A3B8">Privacy decisions have named owners and deadlines in the project plan — counsel advises, the project manager schedules.</text>
</svg>
