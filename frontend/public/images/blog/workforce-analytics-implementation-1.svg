<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="The workforce analytics implementation journey: questions defined, definitions agreed, data foundations proven, dashboards built by audience, then adoption measured by decisions, with the lead owner named at each stage">
  <defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient></defs>
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="88" fill="url(#hdr)"/>
  <text x="48" y="40" font-family="Georgia, serif" font-size="29" fill="#ffffff">Workforce Analytics: From Questions to Decisions</text>
  <text x="48" y="70" font-family="Arial, sans-serif" font-size="20" fill="#94A3B8">Five stages — each with a purpose and lead owners</text>
  <g><rect x="40" y="108" width="208" height="252" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/><text x="56" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Questions</text><text x="56" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Defined</text><text x="56" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Decisions named for</text><text x="56" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">each audience, in</text><text x="56" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">their own words,</text><text x="56" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">before any build.</text><text x="56" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: HR, Leaders</text></g>
  <g><rect x="268" y="108" width="208" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="284" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Definitions</text><text x="284" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Agreed</text><text x="284" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Every metric defined</text><text x="284" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">once, in one register,</text><text x="284" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">owned and versioned</text><text x="284" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">as definitions change.</text><text x="284" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: Metric Owners</text></g>
  <g><rect x="496" y="108" width="208" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="512" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Data</text><text x="512" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Foundations</text><text x="512" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Core HR, time, and</text><text x="512" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">payroll data reconciled</text><text x="512" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">and tested on real,</text><text x="512" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">messy records.</text><text x="512" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: HR, Payroll</text></g>
  <g><rect x="724" y="108" width="208" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="740" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Dashboards by</text><text x="740" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Audience</text><text x="740" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Separate views for</text><text x="740" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">executives, HR, and</text><text x="740" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">managers, shaped to</text><text x="740" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">each audience's work.</text><text x="740" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: Analytics Team</text></g>
  <g><rect x="952" y="108" width="208" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="968" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Decisions</text><text x="968" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Measured</text><text x="968" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Pilot with one</text><text x="968" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">audience, then adoption</text><text x="968" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">measured by decisions</text><text x="968" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">taken, not views.</text><text x="968" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: HR, Leaders</text></g>
  <rect x="40" y="392" width="1120" height="72" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="424" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Every stage depends on trusted Core HR, time, and payroll data</text>
  <text x="64" y="450" font-family="Arial, sans-serif" font-size="16" fill="#475569">A metric calculated from disputed source data will be disputed itself.</text>
  <rect x="40" y="488" width="1120" height="72" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="520" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Definitions are owned and versioned — one meaning per metric</text>
  <text x="64" y="546" font-family="Arial, sans-serif" font-size="16" fill="#64748B">A number can always be traced to the definition that produced it.</text>
  <text x="40" y="600" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Figure 1 — Workforce analytics implementation journey</text>
</svg>
