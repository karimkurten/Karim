<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="The mobile rollout journey for frontline workers: access designed, devices ready, workflows built, pilot run, waves rolled out, and adoption proven, with lead owners at each stage">
  <defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient></defs>
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="88" fill="url(#hdr)"/>
  <text x="48" y="40" font-family="Georgia, serif" font-size="29" fill="#ffffff">Mobile Rollout: From Access Designed to Adoption Proven</text>
  <text x="48" y="70" font-family="Arial, sans-serif" font-size="20" fill="#94A3B8">Six stages — each with a purpose and lead owners</text>
  <g><rect x="40" y="108" width="168" height="252" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/><text x="56" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Access</text><text x="56" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Designed</text><text x="56" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Identity without</text><text x="56" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">work email; languages</text><text x="56" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">and access needs</text><text x="56" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">mapped per group.</text><text x="56" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: HR, IT</text></g><g><rect x="224" y="108" width="168" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="240" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Devices</text><text x="240" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Ready</text><text x="240" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Personal choice and</text><text x="240" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">shared devices placed</text><text x="240" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">where work happens,</text><text x="240" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">fallback set.</text><text x="240" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: Ops, IT</text></g><g><rect x="408" y="108" width="168" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="424" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Workflows</text><text x="424" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Built</text><text x="424" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Punch, schedule,</text><text x="424" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">requests, and</text><text x="424" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">approvals built</text><text x="424" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">offline-ready.</text><text x="424" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: HR, Ops</text></g><g><rect x="592" y="108" width="168" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="608" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Pilot</text><text x="608" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Run</text><text x="608" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">One site, one crew,</text><text x="608" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">through a full pay</text><text x="608" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">cycle, problems</text><text x="608" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">fixed and retested.</text><text x="608" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: Site Lead</text></g><g><rect x="776" y="108" width="168" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="792" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Waves Rolled</text><text x="792" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Out</text><text x="792" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Site by site, with</text><text x="792" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">support on shift and</text><text x="792" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">a defined end to</text><text x="792" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">the old route.</text><text x="792" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: Ops, HR</text></g><g><rect x="960" y="108" width="200" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="976" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Adoption</text><text x="976" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Proven</text><text x="976" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Tasks completed by</text><text x="976" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">site and shift, and</text><text x="976" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">sustained across</text><text x="976" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">pay periods.</text><text x="976" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: HR, Ops</text></g>
  <rect x="40" y="392" width="1120" height="72" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="424" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Every stage depends on identity, devices, and connectivity that match real frontline work</text>
  <text x="64" y="450" font-family="Arial, sans-serif" font-size="16" fill="#475569">Access that only works at a desk, on a managed device, will not reach the frontline.</text>
  <rect x="40" y="488" width="1120" height="72" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="520" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Adoption is proven by completed tasks, not downloads</text>
  <text x="64" y="546" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Punches, requests, and approvals completed through the new route are the measure that matters.</text>
  <text x="40" y="600" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Figure 1 — Mobile rollout journey for frontline workers</text>
</svg>
