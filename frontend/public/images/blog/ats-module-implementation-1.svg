<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="The requisition-to-onboard journey: requisition approved, job posted, applications screened, interviews held, and offer accepted to onboarding handoff, with the lead owner named at each stage">
  <defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient></defs>
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="88" fill="url(#hdr)"/>
  <text x="48" y="40" font-family="Georgia, serif" font-size="29" fill="#ffffff">Recruiting Journey: From Requisition Approved to Onboard</text>
  <text x="48" y="70" font-family="Arial, sans-serif" font-size="20" fill="#94A3B8">Five stages — each with a purpose and lead owners</text>
  <g><rect x="40" y="108" width="208" height="252" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/><text x="56" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Requisition</text><text x="56" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Approved</text><text x="56" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Role, manager, and</text><text x="56" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">justification agreed,</text><text x="56" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">with approvers and</text><text x="56" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">absence cover named.</text><text x="56" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: Manager, HR</text></g>
  <g><rect x="268" y="108" width="208" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="284" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Job</text><text x="284" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Posted</text><text x="284" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Posting published</text><text x="284" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">from a controlled</text><text x="284" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">job template to the</text><text x="284" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">career site.</text><text x="284" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: Recruiter</text></g>
  <g><rect x="496" y="108" width="208" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="512" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Applications</text><text x="512" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Screened</text><text x="512" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Screening and real</text><text x="512" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">minimum knockouts</text><text x="512" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">applied, with reasons</text><text x="512" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">recorded for exits.</text><text x="512" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: Recruiter</text></g>
  <g><rect x="724" y="108" width="208" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="740" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Interviews</text><text x="740" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Held</text><text x="740" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Panels scheduled in</text><text x="740" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">the system, assessed</text><text x="740" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">on scorecards tied</text><text x="740" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">to the template.</text><text x="740" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: Hiring Mgr</text></g>
  <g><rect x="952" y="108" width="208" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="968" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Offer and</text><text x="968" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Onboard</text><text x="968" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Offer approved and</text><text x="968" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">accepted, then the</text><text x="968" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">record hands over to</text><text x="968" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">onboarding directly.</text><text x="968" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: HR, Manager</text></g>
  <rect x="40" y="392" width="1120" height="72" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="424" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Every stage depends on accurate Core HR job and organisation data</text>
  <text x="64" y="450" font-family="Arial, sans-serif" font-size="16" fill="#475569">A requisition raised against the wrong job or manager becomes a defect in the round itself.</text>
  <rect x="40" y="488" width="1120" height="72" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="520" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">The accepted offer creates the employee record — no re-keying</text>
  <text x="64" y="546" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Role, start date, and agreed terms flow to Core HR and onboarding as one record.</text>
  <text x="40" y="600" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Figure 1 — Requisition-to-onboard journey</text>
</svg>
