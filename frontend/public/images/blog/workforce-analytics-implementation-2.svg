<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Workforce analytics control diagram: Core HR, time, and payroll data sources flowing through metric definitions and governance into dashboards by audience, with a privacy strip covering aggregation thresholds and role-based access">
  <defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient></defs>
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="88" fill="url(#hdr)"/>
  <text x="48" y="40" font-family="Georgia, serif" font-size="29" fill="#ffffff">Workforce Data: From Sources to Audience Dashboards</text>
  <text x="48" y="70" font-family="Arial, sans-serif" font-size="20" fill="#94A3B8">Definitions and governance sit between the data and every dashboard</text>
  <g><rect x="40" y="120" width="330" height="220" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/><text x="60" y="154" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Data Sources</text><text x="60" y="188" font-family="Arial, sans-serif" font-size="15" fill="#475569">Core HR: job, organisation,</text><text x="60" y="210" font-family="Arial, sans-serif" font-size="15" fill="#475569">location, and manager data.</text><text x="60" y="254" font-family="Arial, sans-serif" font-size="15" fill="#475569">Time and absence records;</text><text x="60" y="276" font-family="Arial, sans-serif" font-size="15" fill="#475569">payroll data by period.</text><text x="60" y="320" font-family="Arial, sans-serif" font-size="15" fill="#475569">Reconciled before the build.</text></g>
  <text x="378" y="238" font-family="Arial, sans-serif" font-size="24" fill="#2B6CB0">&#8594;</text>
  <g><rect x="412" y="120" width="330" height="220" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="432" y="154" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Definitions and Governance</text><text x="432" y="188" font-family="Arial, sans-serif" font-size="15" fill="#475569">One register: formula,</text><text x="432" y="210" font-family="Arial, sans-serif" font-size="15" fill="#475569">inclusions, exclusions,</text><text x="432" y="232" font-family="Arial, sans-serif" font-size="15" fill="#475569">and date handling.</text><text x="432" y="276" font-family="Arial, sans-serif" font-size="15" fill="#475569">Named owner per metric;</text><text x="432" y="298" font-family="Arial, sans-serif" font-size="15" fill="#475569">changes versioned with an</text><text x="432" y="320" font-family="Arial, sans-serif" font-size="15" fill="#475569">effective date and reason.</text></g>
  <text x="750" y="238" font-family="Arial, sans-serif" font-size="24" fill="#2B6CB0">&#8594;</text>
  <g><rect x="784" y="120" width="376" height="220" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="804" y="154" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Dashboards by Audience</text><text x="804" y="188" font-family="Arial, sans-serif" font-size="15" fill="#475569">Executive: organisation trends</text><text x="804" y="210" font-family="Arial, sans-serif" font-size="15" fill="#475569">and where patterns concentrate.</text><text x="804" y="254" font-family="Arial, sans-serif" font-size="15" fill="#475569">HR: working cuts, drill paths,</text><text x="804" y="276" font-family="Arial, sans-serif" font-size="15" fill="#475569">and data-quality reporting.</text><text x="804" y="320" font-family="Arial, sans-serif" font-size="15" fill="#475569">Manager: own team, few measures.</text></g>
  <rect x="40" y="372" width="1120" height="88" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="404" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Privacy and access control, by design</text>
  <text x="64" y="430" font-family="Arial, sans-serif" font-size="16" fill="#475569">Aggregation thresholds — below a minimum group size, a report shows nothing.</text>
  <text x="64" y="452" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Role-based access — each audience sees only the population its decisions cover.</text>
  <rect x="40" y="484" width="1120" height="72" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="516" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Adoption is measured by decisions, not views</text>
  <text x="64" y="542" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Decisions informed, actions agreed and followed through — reported at the cadence.</text>
  <text x="40" y="600" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Figure 2 — Workforce analytics control diagram</text>
</svg>
