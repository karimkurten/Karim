<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="hdr2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2B6CB0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="72" fill="url(#hdr2)"/>
  <text x="40" y="45" font-size="26" font-weight="bold" fill="#ffffff">The five-step training needs analysis</text>
  <g font-size="15" fill="#475569">
    <rect x="30" y="110" width="205" height="150" rx="10" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="48" y="142" font-size="17" font-weight="bold" fill="#1A202C">1. Start from</text>
    <text x="48" y="166" font-size="17" font-weight="bold" fill="#1A202C">signed design</text>
    <text x="48" y="196">Task inventory per</text>
    <text x="48" y="218">process: who does</text>
    <text x="48" y="240">what, how often</text>
    <rect x="265" y="110" width="205" height="150" rx="10" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="283" y="142" font-size="17" font-weight="bold" fill="#1A202C">2. Segment by</text>
    <text x="283" y="166" font-size="17" font-weight="bold" fill="#1A202C">real work</text>
    <text x="283" y="196">Audiences by tasks</text>
    <text x="283" y="218">performed, not by</text>
    <text x="283" y="240">org chart alone</text>
    <rect x="500" y="110" width="205" height="150" rx="10" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="518" y="142" font-size="17" font-weight="bold" fill="#1A202C">3. Assess the</text>
    <text x="518" y="166" font-size="17" font-weight="bold" fill="#1A202C">starting point</text>
    <text x="518" y="196">Current skill, system</text>
    <text x="518" y="218">familiarity, access,</text>
    <text x="518" y="240">language, constraints</text>
    <rect x="735" y="110" width="205" height="150" rx="10" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="753" y="142" font-size="17" font-weight="bold" fill="#1A202C">4. Define the</text>
    <text x="753" y="166" font-size="17" font-weight="bold" fill="#1A202C">gap as behaviour</text>
    <text x="753" y="196">Observable tasks each</text>
    <text x="753" y="218">audience must perform</text>
    <text x="753" y="240">unaided at go-live</text>
    <rect x="970" y="110" width="205" height="150" rx="10" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="988" y="142" font-size="17" font-weight="bold" fill="#1A202C">5. Match method</text>
    <text x="988" y="166" font-size="17" font-weight="bold" fill="#1A202C">and timing</text>
    <text x="988" y="196">Format per gap, timed</text>
    <text x="988" y="218">to first real use and</text>
    <text x="988" y="240">the pay calendar</text>
  </g>
  <line x1="235" y1="185" x2="263" y2="185" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="470" y1="185" x2="498" y2="185" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="705" y1="185" x2="733" y2="185" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="940" y1="185" x2="968" y2="185" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="30" y="310" width="1145" height="180" rx="10" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
  <text x="48" y="344" font-size="17" font-weight="bold" fill="#1A202C">Timing rule: train close to first real use</text>
  <text x="48" y="376" font-size="15" fill="#475569">Concept briefings can run early. Hands-on practice belongs in the final weeks before go-live, with sandbox</text>
  <text x="48" y="400" font-size="15" fill="#475569">access kept open through hypercare. Payroll and manager training should land just before the first live</text>
  <text x="48" y="424" font-size="15" fill="#475569">cycle those audiences must actually run — not at a convenient date in the middle of the build.</text>
  <text x="48" y="464" font-size="15" fill="#64748B">Output: a costed training plan — audiences, gaps, methods, owners, dates — that UAT and cutover planning can rely on.</text>
</svg>
