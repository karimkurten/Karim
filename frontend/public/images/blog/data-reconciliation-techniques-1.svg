<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img" aria-label="Layered diagram of reconciliation layers">
  <defs>
    <linearGradient id="layerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0F4F8"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0F4F8"/>
    </linearGradient>
    <filter id="soft" x="-8%" y="-20%" width="116%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="900" height="580" fill="url(#bgGrad)"/>
  <text x="450" y="50" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="24" font-weight="700" fill="#1A202C">Reconciliation layers — every load</text>
  <g filter="url(#soft)">
    <rect x="310" y="100" width="280" height="76" rx="10" fill="url(#layerGrad)" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="310" y="100" width="8" height="76" rx="4" fill="#2B6CB0"/>
    <text x="458" y="147" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1A202C">Sampled detail</text>
    <rect x="250" y="186" width="400" height="76" rx="10" fill="url(#layerGrad)" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="250" y="186" width="8" height="76" rx="4" fill="#2B6CB0"/>
    <text x="454" y="233" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1A202C">Deduction totals</text>
    <rect x="190" y="272" width="520" height="76" rx="10" fill="url(#layerGrad)" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="190" y="272" width="8" height="76" rx="4" fill="#2B6CB0"/>
    <text x="454" y="319" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1A202C">Gross-to-net totals</text>
    <rect x="130" y="358" width="640" height="76" rx="10" fill="url(#layerGrad)" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="130" y="358" width="8" height="76" rx="4" fill="#2B6CB0"/>
    <text x="454" y="405" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1A202C">Headcount totals</text>
    <rect x="70" y="444" width="760" height="76" rx="10" fill="url(#layerGrad)" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="70" y="444" width="8" height="76" rx="4" fill="#2B6CB0"/>
    <text x="454" y="491" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#1A202C">Record counts</text>
  </g>
  <text x="450" y="556" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">Base layers prove the population balances; the top layer proves individual records are right.</text>
</svg>
