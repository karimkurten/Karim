<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Data classification flow deciding whether each data entity migrates, archives, gets purged, or is flagged sensitive-special">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="cardDepth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F0F4F8" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#F8FAFC"/>

  <!-- Header -->
  <rect x="40" y="24" width="1120" height="88" rx="14" fill="url(#heroGrad)" filter="url(#softShadow)"/>
  <text x="600" y="60" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="30" fill="#ffffff">Data Classification: Decide Before You Extract</text>
  <text x="600" y="90" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#94A3B8">Every data entity lands in exactly one bucket — before it moves anywhere</text>

  <!-- Intake panel -->
  <rect x="40" y="140" width="250" height="400" rx="12" fill="url(#cardDepth)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="165" y="172" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="18" fill="#1A202C">Data entities in scope</text>
  <line x1="60" y1="186" x2="270" y2="186" stroke="#E2E8F0" stroke-width="1"/>
  <g font-family="Inter, system-ui, sans-serif" font-size="14" fill="#475569">
    <rect x="60" y="200" width="210" height="38" rx="8" fill="#F0F4F8" stroke="#E2E8F0"/>
    <text x="75" y="224">Active employees</text>
    <rect x="60" y="248" width="210" height="38" rx="8" fill="#F0F4F8" stroke="#E2E8F0"/>
    <text x="75" y="272">Open pay records</text>
    <rect x="60" y="296" width="210" height="38" rx="8" fill="#F0F4F8" stroke="#E2E8F0"/>
    <text x="75" y="320">Historical payroll</text>
    <rect x="60" y="344" width="210" height="38" rx="8" fill="#F0F4F8" stroke="#E2E8F0"/>
    <text x="75" y="368">Old terminations</text>
    <rect x="60" y="392" width="210" height="38" rx="8" fill="#F0F4F8" stroke="#E2E8F0"/>
    <text x="75" y="416">Duplicate records</text>
    <rect x="60" y="440" width="210" height="38" rx="8" fill="#F0F4F8" stroke="#E2E8F0"/>
    <text x="75" y="464">Legacy custom fields</text>
  </g>
  <text x="165" y="512" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748B">Owner: business data owners</text>

  <!-- Arrow from intake to diamond 1 -->
  <line x1="290" y1="340" x2="360" y2="340" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2B6CB0"/>
    </marker>
  </defs>

  <!-- Diamond 1 -->
  <polygon points="470,210 600,340 470,470 340,340" fill="#ffffff" stroke="#2B6CB0" stroke-width="3" filter="url(#softShadow)"/>
  <text x="470" y="330" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Does the new</text>
  <text x="470" y="354" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">system need it?</text>

  <!-- Yes -> Migrate -->
  <text x="560" y="250" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Yes</text>
  <line x1="545" y1="265" x2="640" y2="180" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <rect x="640" y="140" width="220" height="120" rx="12" fill="url(#cardDepth)" stroke="#2B6CB0" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="750" y="178" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="20" fill="#1A202C">Migrate</text>
  <text x="750" y="206" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Active employees, open pay,</text>
  <text x="750" y="226" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">benefits, current-year tax</text>

  <!-- No -> Diamond 2 (elbow connector) -->
  <text x="505" y="500" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#64748B">No</text>
  <polyline points="470,470 470,560 828,560" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrowGray)"/>
  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Diamond 2 -->
  <polygon points="940,440 1050,560 940,680 830,560" fill="#ffffff" stroke="#2B6CB0" stroke-width="3" filter="url(#softShadow)"/>
  <text x="940" y="550" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1A202C">Retention or</text>
  <text x="940" y="572" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#1A202C">legal hold?</text>

  <!-- Yes -> Archive -->
  <text x="905" y="478" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Yes</text>
  <line x1="915" y1="495" x2="915" y2="430" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <rect x="810" y="320" width="220" height="100" rx="12" fill="url(#cardDepth)" stroke="#2B6CB0" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="920" y="356" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="20" fill="#1A202C">Archive</text>
  <text x="920" y="382" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Secure archive, restricted access —</text>
  <text x="920" y="400" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">not in the new HR system</text>

  <!-- No -> Purge -->
  <text x="1030" y="470" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">No</text>
  <line x1="1005" y1="470" x2="1070" y2="420" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <rect x="960" y="140" width="200" height="100" rx="12" fill="url(#cardDepth)" stroke="#2B6CB0" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="1060" y="176" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="20" fill="#1A202C">Purge</text>
  <text x="1060" y="202" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">Destroy per retention policy</text>
  <text x="1060" y="220" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">before anything travels</text>

  <!-- Sensitive-special banner -->
  <rect x="40" y="580" width="1120" height="150" rx="12" fill="#1e3a5f" filter="url(#softShadow)"/>
  <text x="70" y="622" font-family="'DM Serif Display', Georgia, serif" font-size="22" fill="#ffffff">Sensitive-special flag — applies wherever the data lands</text>
  <text x="70" y="656" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#cbd5e1">SINs, bank details, medical and accommodation information, immigration status.</text>
  <text x="70" y="684" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#cbd5e1">Masked in test environments, restricted in mapping spreadsheets, de-identified wherever testers don't need the real value.</text>
  <rect x="940" y="612" width="180" height="52" rx="10" fill="#2B6CB0"/>
  <text x="1030" y="645" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Extra controls</text>
</svg>
