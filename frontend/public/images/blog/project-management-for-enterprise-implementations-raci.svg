<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="RACI chart for implementation governance: who is responsible, accountable, consulted, and informed across six key decisions">
  <rect width="1000" height="640" fill="#F4F6F8"/>
  <text x="500" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#16294A">Implementation RACI: Who Decides What</text>
  <text x="500" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#5A6C7D">One A per row. Two Accountables means nobody is accountable.</text>

  <!-- Header row -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="40" y="110" width="320" height="52" fill="#16294A" rx="8"/>
    <text x="200" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Decision</text>
    <rect x="370" y="110" width="150" height="52" fill="#2B6CB0" rx="8"/>
    <text x="445" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Executive</text>
    <text x="445" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Sponsor</text>
    <rect x="530" y="110" width="150" height="52" fill="#2B6CB0" rx="8"/>
    <text x="605" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Client</text>
    <text x="605" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">PM</text>
    <rect x="690" y="110" width="150" height="52" fill="#2B6CB0" rx="8"/>
    <text x="765" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Partner</text>
    <text x="765" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">PM</text>
    <rect x="850" y="110" width="110" height="52" fill="#2B6CB0" rx="8"/>
    <text x="905" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Workstream</text>
    <text x="905" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Leads</text>

    <!-- Rows -->
    <g font-size="15">
      <rect x="40" y="172" width="320" height="60" fill="#FFFFFF" rx="8"/>
      <text x="200" y="198" text-anchor="middle" fill="#16294A" font-weight="600">Scope change approval</text>
      <text x="200" y="218" text-anchor="middle" fill="#5A6C7D" font-size="13">over threshold</text>
      <rect x="370" y="172" width="150" height="60" fill="#FFFFFF" rx="8"/><text x="445" y="209" text-anchor="middle" font-size="20" font-weight="700" fill="#16294A">A</text>
      <rect x="530" y="172" width="150" height="60" fill="#FFFFFF" rx="8"/><text x="605" y="209" text-anchor="middle" font-size="20" font-weight="700" fill="#5A6C7D">C</text>
      <rect x="690" y="172" width="150" height="60" fill="#FFFFFF" rx="8"/><text x="765" y="209" text-anchor="middle" font-size="20" font-weight="700" fill="#2B6CB0">R</text>
      <rect x="850" y="172" width="110" height="60" fill="#FFFFFF" rx="8"/><text x="905" y="209" text-anchor="middle" font-size="20" font-weight="700" fill="#5A6C7D">I</text>

      <rect x="40" y="242" width="320" height="60" fill="#EAF1F8" rx="8"/>
      <text x="200" y="268" text-anchor="middle" fill="#16294A" font-weight="600">Go-live date decision</text>
      <text x="200" y="288" text-anchor="middle" fill="#5A6C7D" font-size="13">or delay call</text>
      <rect x="370" y="242" width="150" height="60" fill="#EAF1F8" rx="8"/><text x="445" y="279" text-anchor="middle" font-size="20" font-weight="700" fill="#16294A">A</text>
      <rect x="530" y="242" width="150" height="60" fill="#EAF1F8" rx="8"/><text x="605" y="279" text-anchor="middle" font-size="20" font-weight="700" fill="#2B6CB0">R</text>
      <rect x="690" y="242" width="150" height="60" fill="#EAF1F8" rx="8"/><text x="765" y="279" text-anchor="middle" font-size="20" font-weight="700" fill="#2B6CB0">R</text>
      <rect x="850" y="242" width="110" height="60" fill="#EAF1F8" rx="8"/><text x="905" y="279" text-anchor="middle" font-size="20" font-weight="700" fill="#5A6C7D">C</text>

      <rect x="40" y="312" width="320" height="60" fill="#FFFFFF" rx="8"/>
      <text x="200" y="338" text-anchor="middle" fill="#16294A" font-weight="600">UAT sign-off</text>
      <text x="200" y="358" text-anchor="middle" fill="#5A6C7D" font-size="13">fit-for-purpose verdict</text>
      <rect x="370" y="312" width="150" height="60" fill="#FFFFFF" rx="8"/><text x="445" y="349" text-anchor="middle" font-size="20" font-weight="700" fill="#5A6C7D">I</text>
      <rect x="530" y="312" width="150" height="60" fill="#FFFFFF" rx="8"/><text x="605" y="349" text-anchor="middle" font-size="20" font-weight="700" fill="#16294A">A</text>
      <rect x="690" y="312" width="150" height="60" fill="#FFFFFF" rx="8"/><text x="765" y="349" text-anchor="middle" font-size="20" font-weight="700" fill="#5A6C7D">C</text>
      <rect x="850" y="312" width="110" height="60" fill="#FFFFFF" rx="8"/><text x="905" y="349" text-anchor="middle" font-size="20" font-weight="700" fill="#2B6CB0">R</text>

      <rect x="40" y="382" width="320" height="60" fill="#EAF1F8" rx="8"/>
      <text x="200" y="408" text-anchor="middle" fill="#16294A" font-weight="600">Data migration sign-off</text>
      <text x="200" y="428" text-anchor="middle" fill="#5A6C7D" font-size="13">reconciliation passed</text>
      <rect x="370" y="382" width="150" height="60" fill="#EAF1F8" rx="8"/><text x="445" y="419" text-anchor="middle" font-size="20" font-weight="700" fill="#5A6C7D">I</text>
      <rect x="530" y="382" width="150" height="60" fill="#EAF1F8" rx="8"/><text x="605" y="419" text-anchor="middle" font-size="20" font-weight="700" fill="#16294A">A</text>
      <rect x="690" y="382" width="150" height="60" fill="#EAF1F8" rx="8"/><text x="765" y="419" text-anchor="middle" font-size="20" font-weight="700" fill="#5A6C7D">C</text>
      <rect x="850" y="382" width="110" height="60" fill="#EAF1F8" rx="8"/><text x="905" y="419" text-anchor="middle" font-size="20" font-weight="700" fill="#2B6CB0">R</text>

      <rect x="40" y="452" width="320" height="60" fill="#FFFFFF" rx="8"/>
      <text x="200" y="478" text-anchor="middle" fill="#16294A" font-weight="600">Cutover plan approval</text>
      <text x="200" y="498" text-anchor="middle" fill="#5A6C7D" font-size="13">go-live weekend runbook</text>
      <rect x="370" y="452" width="150" height="60" fill="#FFFFFF" rx="8"/><text x="445" y="489" text-anchor="middle" font-size="20" font-weight="700" fill="#5A6C7D">I</text>
      <rect x="530" y="452" width="150" height="60" fill="#FFFFFF" rx="8"/><text x="605" y="489" text-anchor="middle" font-size="20" font-weight="700" fill="#2B6CB0">R</text>
      <rect x="690" y="452" width="150" height="60" fill="#FFFFFF" rx="8"/><text x="765" y="489" text-anchor="middle" font-size="20" font-weight="700" fill="#16294A">A</text>
      <rect x="850" y="452" width="110" height="60" fill="#FFFFFF" rx="8"/><text x="905" y="489" text-anchor="middle" font-size="20" font-weight="700" fill="#5A6C7D">C</text>

      <rect x="40" y="522" width="320" height="60" fill="#EAF1F8" rx="8"/>
      <text x="200" y="548" text-anchor="middle" fill="#16294A" font-weight="600">Hypercare exit</text>
      <text x="200" y="568" text-anchor="middle" fill="#5A6C7D" font-size="13">transition to support</text>
      <rect x="370" y="522" width="150" height="60" fill="#EAF1F8" rx="8"/><text x="445" y="559" text-anchor="middle" font-size="20" font-weight="700" fill="#16294A">A</text>
      <rect x="530" y="522" width="150" height="60" fill="#EAF1F8" rx="8"/><text x="605" y="559" text-anchor="middle" font-size="20" font-weight="700" fill="#2B6CB0">R</text>
      <rect x="690" y="522" width="150" height="60" fill="#EAF1F8" rx="8"/><text x="765" y="559" text-anchor="middle" font-size="20" font-weight="700" fill="#5A6C7D">C</text>
      <rect x="850" y="522" width="110" height="60" fill="#EAF1F8" rx="8"/><text x="905" y="559" text-anchor="middle" font-size="20" font-weight="700" fill="#5A6C7D">I</text>
    </g>

    <text x="500" y="622" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#5A6C7D"><tspan font-weight="700" fill="#16294A">R</tspan> = does the work &#183; <tspan font-weight="700" fill="#16294A">A</tspan> = owns the decision &#183; <tspan font-weight="700" fill="#16294A">C</tspan> = consulted before &#183; <tspan font-weight="700" fill="#16294A">I</tspan> = informed after</text>
  </g>
</svg>
