<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="72" fill="url(#hdr)"/>
  <text x="40" y="45" font-size="26" font-weight="bold" fill="#ffffff">Stakeholder mapping: influence and interest</text>
  <text x="40" y="105" font-size="15" fill="#64748B">Place each stakeholder by influence over the project and interest in its outcome — then check impact separately.</text>
  <text x="600" y="128" font-size="14" font-weight="bold" fill="#1A202C" text-anchor="middle">Interest in the outcome increases to the right</text>
  <rect x="40" y="140" width="560" height="190" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="172" font-size="17" font-weight="bold" fill="#1A202C">Keep satisfied</text>
  <text x="64" y="200" font-size="15" fill="#475569">High influence, lower interest</text>
  <text x="64" y="230" font-size="15" fill="#475569">Finance executives</text>
  <text x="64" y="256" font-size="15" fill="#475569">Security and control owners</text>
  <text x="64" y="282" font-size="15" fill="#475569">Strategy: concise, decision-focused</text>
  <text x="64" y="308" font-size="15" fill="#475569">contact — their intervention matters</text>
  <rect x="620" y="140" width="540" height="190" rx="10" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
  <text x="644" y="172" font-size="17" font-weight="bold" fill="#1A202C">Manage closely</text>
  <text x="644" y="200" font-size="15" fill="#475569">High influence, high interest</text>
  <text x="644" y="230" font-size="15" fill="#475569">Executive sponsor</text>
  <text x="644" y="256" font-size="15" fill="#475569">Steering committee</text>
  <text x="644" y="282" font-size="15" fill="#475569">Payroll and HR leadership</text>
  <text x="644" y="308" font-size="15" fill="#475569">Strategy: involve in decisions</text>
  <rect x="40" y="350" width="560" height="190" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="382" font-size="17" font-weight="bold" fill="#1A202C">Monitor lightly</text>
  <text x="64" y="410" font-size="15" fill="#475569">Lower influence, lower interest</text>
  <text x="64" y="440" font-size="15" fill="#475569">Peripheral report consumers</text>
  <text x="64" y="466" font-size="15" fill="#475569">Distant partner teams</text>
  <text x="64" y="492" font-size="15" fill="#475569">Strategy: light monitoring,</text>
  <text x="64" y="518" font-size="15" fill="#475569">no project noise</text>
  <rect x="620" y="350" width="540" height="190" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  <text x="644" y="382" font-size="17" font-weight="bold" fill="#1A202C">Keep informed and heard</text>
  <text x="644" y="410" font-size="15" fill="#475569">Lower influence, high interest</text>
  <text x="644" y="440" font-size="15" fill="#475569">Managers and supervisors</text>
  <text x="644" y="466" font-size="15" fill="#475569">Payroll specialists</text>
  <text x="644" y="492" font-size="15" fill="#475569">Frontline employee groups</text>
  <text x="644" y="518" font-size="15" fill="#475569">Strategy: listen — they carry adoption</text>
  <rect x="40" y="560" width="1120" height="52" rx="8" fill="#ffffff" stroke="#2B6CB0" stroke-width="2"/>
  <text x="64" y="592" font-size="15" font-weight="bold" fill="#1A202C">Impact check: a quiet group can still face the deepest change — high impact always earns deliberate engagement.</text>
</svg>
