<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" font-family="Georgia, 'DM Serif Display', serif"><defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B6CB0"/></marker></defs><rect width="1200" height="960" fill="#ffffff"/><rect x="0" y="0" width="1200" height="104" fill="url(#hdr)"/><text x="60" y="48" font-size="30" fill="#ffffff">Sourcing Test Data: Synthetic, Masked, or Hybrid?</text><text x="60" y="80" font-size="17" fill="#94A3B8" font-family="Arial, sans-serif">Three questions decide the route — the controls apply to every route</text><g filter="url(#sh)"><rect x="180" y="132" width="840" height="92" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="180" y="132" width="14" height="92" fill="#2B6CB0"/><text x="218" y="168" font-size="21" fill="#1A202C">Question 1 — Does the test need real history and volume?</text><text x="218" y="196" font-size="15" fill="#475569" font-family="Arial, sans-serif">Realistic accumulated history points toward a masked production copy.</text><path d="M600 226 L600 248" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><g filter="url(#sh)"><rect x="180" y="250" width="840" height="92" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="180" y="250" width="14" height="92" fill="#2B6CB0"/><text x="218" y="286" font-size="21" fill="#1A202C">Question 2 — Must the data be shared or screenshotted?</text><text x="218" y="314" font-size="15" fill="#475569" font-family="Arial, sans-serif">Material for defect reports, training, or walkthroughs points toward synthetic records.</text><path d="M600 344 L600 366" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><g filter="url(#sh)"><rect x="180" y="368" width="840" height="92" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="180" y="368" width="14" height="92" fill="#2B6CB0"/><text x="218" y="404" font-size="21" fill="#1A202C">Question 3 — Is the case a designed edge condition?</text><text x="218" y="432" font-size="15" fill="#475569" font-family="Arial, sans-serif">Threshold, retroactive, and multi-jurisdiction cases are built synthetically on purpose.</text><path d="M600 462 L600 492" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><g filter="url(#sh)"><rect x="60" y="496" width="340" height="160" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="60" y="496" width="14" height="160" fill="#0f172a"/><text x="90" y="538" font-size="19" fill="#1A202C">Masked Production Copy</text><text x="90" y="570" font-size="15" fill="#475569" font-family="Arial, sans-serif">Realistic history and volume;</text><text x="90" y="594" font-size="15" fill="#475569" font-family="Arial, sans-serif">identifiers irreversibly altered</text><text x="90" y="618" font-size="15" fill="#475569" font-family="Arial, sans-serif">and the masking validated.</text><g filter="url(#sh)"><rect x="440" y="496" width="340" height="160" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="440" y="496" width="14" height="160" fill="#2B6CB0"/><text x="470" y="538" font-size="19" fill="#1A202C">Synthetic Records</text><text x="470" y="570" font-size="15" fill="#475569" font-family="Arial, sans-serif">Invented and precisely shaped</text><text x="470" y="594" font-size="15" fill="#475569" font-family="Arial, sans-serif">for edge cases — safe to share</text><text x="470" y="618" font-size="15" fill="#475569" font-family="Arial, sans-serif">in reports and walkthroughs.</text><g filter="url(#sh)"><rect x="820" y="496" width="340" height="160" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="820" y="496" width="14" height="160" fill="#2B6CB0"/><text x="850" y="538" font-size="19" fill="#1A202C">Hybrid</text><text x="850" y="570" font-size="15" fill="#475569" font-family="Arial, sans-serif">A masked base population plus</text><text x="850" y="594" font-size="15" fill="#475569" font-family="Arial, sans-serif">synthetic edge cases layered</text><text x="850" y="618" font-size="15" fill="#475569" font-family="Arial, sans-serif">on top — the common pattern.</text><g filter="url(#sh)"><rect x="120" y="700" width="960" height="120" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/></g><text x="600" y="744" font-size="22" fill="#1A202C" text-anchor="middle">Every route carries the same controls</text><text x="600" y="776" font-size="16" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">Role-based access &#183; a named data version &#183; a change log for frozen data</text><text x="600" y="802" font-size="15" fill="#2B6CB0" font-family="Arial, sans-serif" text-anchor="middle">And a destruction date set on the day the data is created.</text><text x="600" y="872" font-size="16" fill="#64748B" font-family="Arial, sans-serif" text-anchor="middle">Never an unmasked production copy — convenience is not a control.</text></svg>
