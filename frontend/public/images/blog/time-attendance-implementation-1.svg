<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="The time and attendance implementation journey: pay rules written, capture methods chosen, rule groups assigned, exceptions designed, results reconciled, and live time handling trusted, with lead owners at each stage">
  <defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient></defs>
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="88" fill="url(#hdr)"/>
  <text x="48" y="40" font-family="Georgia, serif" font-size="29" fill="#ffffff">Time and Attendance: From Rules Written to Pay Trusted</text>
  <text x="48" y="70" font-family="Arial, sans-serif" font-size="20" fill="#94A3B8">Six stages — each with a purpose and lead owners</text>
  <g><rect x="40" y="108" width="168" height="252" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/><text x="56" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Pay Rules</text><text x="56" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Written</text><text x="56" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Overtime, premiums,</text><text x="56" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">rounding, and</text><text x="56" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">holidays — in plain</text><text x="56" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">language, worked.</text><text x="56" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: HR, Payroll</text></g><g><rect x="224" y="108" width="168" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="240" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Capture</text><text x="240" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Chosen</text><text x="240" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Terminal, mobile,</text><text x="240" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">desktop — matched</text><text x="240" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">to each work</text><text x="240" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">setting, fallback set.</text><text x="240" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: Ops, IT</text></g><g><rect x="408" y="108" width="168" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="424" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Groups</text><text x="424" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Assigned</text><text x="424" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Rule groups for</text><text x="424" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">people who truly</text><text x="424" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">share rules; transfers</text><text x="424" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">handled mid-period.</text><text x="424" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: HR, Payroll</text></g><g><rect x="592" y="108" width="168" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="608" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Exceptions</text><text x="608" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Designed</text><text x="608" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Grouped by</text><text x="608" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">consequence, with</text><text x="608" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">a payroll deadline</text><text x="608" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">rule supervisors use.</text><text x="608" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: Ops</text></g><g><rect x="776" y="108" width="168" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="792" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Results</text><text x="792" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Reconciled</text><text x="792" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Difficult shifts and</text><text x="792" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">parallel results</text><text x="792" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">checked against</text><text x="792" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">hand-worked figures.</text><text x="792" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: Payroll</text></g><g><rect x="960" y="108" width="200" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="976" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Live and</text><text x="976" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Trusted</text><text x="976" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Time people record</text><text x="976" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">honestly, totals</text><text x="976" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">they can see and</text><text x="976" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">dispute fairly.</text><text x="976" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: Ops, HR</text></g>
  <rect x="40" y="392" width="1120" height="72" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="424" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Every stage depends on accurate status, work location, and reporting lines</text>
  <text x="64" y="450" font-family="Arial, sans-serif" font-size="16" fill="#475569">Status, location, and manager decide which rule group applies, and who approves the time.</text>
  <rect x="40" y="488" width="1120" height="72" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="520" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">The difficult shifts decide whether it works</text>
  <text x="64" y="546" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Overnight, split, and holiday shifts need testing before go-live, not after the first pay run.</text>
  <text x="40" y="600" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Figure 1 — Time and attendance implementation journey</text>
</svg>