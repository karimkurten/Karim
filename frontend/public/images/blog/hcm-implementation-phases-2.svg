<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Georgia, 'DM Serif Display', serif"><defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B6CB0"/></marker></defs><rect width="1200" height="700" fill="#ffffff"/><rect x="0" y="0" width="1200" height="104" fill="url(#hdr)"/><text x="60" y="48" font-size="30" fill="#ffffff">How a Phase Gate Works</text><text x="60" y="80" font-size="17" fill="#94A3B8" font-family="Arial, sans-serif">Entry criteria open a phase; exit criteria close it; the gate review records one of three decisions</text><g filter="url(#sh)"><rect x="40" y="140" width="340" height="270" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="40" y="140" width="340" height="14" fill="#2B6CB0"/><text x="60" y="190" font-size="21" fill="#1A202C">Entry criteria</text><text x="60" y="218" font-size="14" fill="#64748B" font-family="Arial, sans-serif">Checked before the phase starts</text><text x="60" y="256" font-size="14.5" fill="#475569" font-family="Arial, sans-serif">• Previous gate decision recorded</text><text x="60" y="284" font-size="14.5" fill="#475569" font-family="Arial, sans-serif">• Scope and phase owners confirmed</text><text x="60" y="312" font-size="14.5" fill="#475569" font-family="Arial, sans-serif">• Inputs, access, and data available</text><text x="60" y="340" font-size="14.5" fill="#475569" font-family="Arial, sans-serif">• People scheduled, time protected</text><text x="60" y="368" font-size="14.5" fill="#475569" font-family="Arial, sans-serif">• Known risks carried into the plan</text><path d="M384 275 L424 275" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><g filter="url(#sh)"><rect x="430" y="140" width="340" height="270" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="430" y="140" width="340" height="14" fill="#0f172a"/><text x="450" y="190" font-size="21" fill="#1A202C">Exit criteria</text><text x="450" y="218" font-size="14" fill="#64748B" font-family="Arial, sans-serif">Checked when the phase claims to be done</text><text x="450" y="256" font-size="14.5" fill="#475569" font-family="Arial, sans-serif">• Deliverables complete and reviewed</text><text x="450" y="284" font-size="14.5" fill="#475569" font-family="Arial, sans-serif">• Evidence filed, not just asserted</text><text x="450" y="312" font-size="14.5" fill="#475569" font-family="Arial, sans-serif">• Open items logged, owned, dated</text><text x="450" y="340" font-size="14.5" fill="#475569" font-family="Arial, sans-serif">• Decisions and risks updated</text><text x="450" y="368" font-size="14.5" fill="#475569" font-family="Arial, sans-serif">• Next phase entry criteria in reach</text><path d="M774 275 L814 275" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><g filter="url(#sh)"><rect x="820" y="140" width="340" height="270" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="820" y="140" width="340" height="14" fill="#2B6CB0"/><text x="840" y="190" font-size="21" fill="#1A202C">Gate review</text><text x="840" y="218" font-size="14" fill="#64748B" font-family="Arial, sans-serif">A short, formal decision meeting</text><text x="840" y="256" font-size="14.5" fill="#475569" font-family="Arial, sans-serif">• Sponsor and phase leads attend</text><text x="840" y="284" font-size="14.5" fill="#475569" font-family="Arial, sans-serif">• Evidence tested against criteria</text><text x="840" y="312" font-size="14.5" fill="#475569" font-family="Arial, sans-serif">• Gaps named, not smoothed over</text><text x="840" y="340" font-size="14.5" fill="#475569" font-family="Arial, sans-serif">• One decision recorded in the log</text><path d="M990 414 L990 464" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><path d="M820 540 L786 540" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><path d="M430 540 L396 540" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><g filter="url(#sh)"><rect x="820" y="470" width="340" height="140" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="820" y="470" width="340" height="14" fill="#2B6CB0"/><text x="840" y="524" font-size="20" fill="#1A202C">Proceed</text><text x="840" y="554" font-size="14.5" fill="#475569" font-family="Arial, sans-serif">Criteria met. The next phase starts</text><text x="840" y="576" font-size="14.5" fill="#475569" font-family="Arial, sans-serif">with a clean baseline.</text><g filter="url(#sh)"><rect x="430" y="470" width="340" height="140" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="430" y="470" width="340" height="14" fill="#0f172a"/><text x="450" y="524" font-size="20" fill="#1A202C">Proceed with conditions</text><text x="450" y="554" font-size="14.5" fill="#475569" font-family="Arial, sans-serif">Start, with named actions, owners,</text><text x="450" y="576" font-size="14.5" fill="#475569" font-family="Arial, sans-serif">and dates tracked to closure.</text><g filter="url(#sh)"><rect x="40" y="470" width="340" height="140" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="40" y="470" width="340" height="14" fill="#2B6CB0"/><text x="60" y="524" font-size="20" fill="#1A202C">Hold</text><text x="60" y="554" font-size="14.5" fill="#475569" font-family="Arial, sans-serif">Do not proceed. Close the gaps and</text><text x="60" y="576" font-size="14.5" fill="#475569" font-family="Arial, sans-serif">re-review before work builds on them.</text><text x="600" y="660" font-size="16" fill="#64748B" font-family="Arial, sans-serif" text-anchor="middle">A gate is a decision about evidence, not a celebration of a date reached.</text></svg>
