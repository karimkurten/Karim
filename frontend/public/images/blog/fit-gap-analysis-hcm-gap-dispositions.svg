<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="hero2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="640" rx="14" fill="#F0F4F8"/>
  <rect x="0" y="0" width="960" height="640" rx="14" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  <text x="36" y="46" font-size="24" font-weight="700" fill="#1A202C">The Four Gap Dispositions</text>
  <text x="36" y="70" font-size="14" fill="#64748B">Test them in order — cheapest first, customization last and justified</text>

  <!-- Card 1 -->
  <g filter="url(#shadow2)">
    <rect x="36" y="96" width="438" height="238" rx="12" fill="url(#hero2)"/>
    <rect x="36" y="96" width="438" height="56" rx="12" fill="#0f172a" opacity="0.5"/>
    <rect x="36" y="140" width="438" height="12" fill="#0f172a" opacity="0.5"/>
    <text x="255" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#93C5FD">1 · CHEAPEST — TEST FIRST</text>
    <text x="255" y="190" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Configure within standard</text>
    <text x="255" y="222" text-anchor="middle" font-size="13.5" fill="#c9d3e6">Fields, rules, workflow definitions — the system</text>
    <text x="255" y="244" text-anchor="middle" font-size="13.5" fill="#c9d3e6">already supports the need through normal setup.</text>
    <text x="255" y="266" text-anchor="middle" font-size="13.5" fill="#c9d3e6">No code, no bolt-on, no technical debt.</text>
    <text x="255" y="306" text-anchor="middle" font-size="12.5" font-style="italic" fill="#93C5FD">Many "gaps" dissolve when a system expert looks fresh.</text>
  </g>

  <!-- Card 2 -->
  <g filter="url(#shadow2)">
    <rect x="486" y="96" width="438" height="238" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="486" y="96" width="438" height="56" rx="12" fill="#F0F4F8"/>
    <rect x="486" y="140" width="438" height="12" fill="#F0F4F8"/>
    <text x="705" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#2B6CB0">2 · LOW COST — NEEDS AUTHORITY</text>
    <text x="705" y="190" text-anchor="middle" font-size="19" font-weight="700" fill="#1A202C">Adapt the process</text>
    <text x="705" y="222" text-anchor="middle" font-size="13.5" fill="#475569">The organization changes how it works to match</text>
    <text x="705" y="244" text-anchor="middle" font-size="13.5" fill="#475569">the standard capability. The requirement is real,</text>
    <text x="705" y="266" text-anchor="middle" font-size="13.5" fill="#475569">but today's method is preference, not necessity.</text>
    <text x="705" y="306" text-anchor="middle" font-size="12.5" font-style="italic" fill="#64748B">Someone must own the process change.</text>
  </g>

  <!-- Card 3 -->
  <g filter="url(#shadow2)">
    <rect x="36" y="346" width="438" height="238" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="36" y="346" width="438" height="56" rx="12" fill="#F0F4F8"/>
    <rect x="36" y="390" width="438" height="12" fill="#F0F4F8"/>
    <text x="255" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#2B6CB0">3 · LOW COST — QUESTION THE NEED</text>
    <text x="255" y="440" text-anchor="middle" font-size="19" font-weight="700" fill="#1A202C">Change the policy</text>
    <text x="255" y="472" text-anchor="middle" font-size="13.5" fill="#475569">Sometimes the requirement itself is the problem:</text>
    <text x="255" y="494" text-anchor="middle" font-size="13.5" fill="#475569">an outdated policy, a rule nobody remembers the</text>
    <text x="255" y="516" text-anchor="middle" font-size="13.5" fill="#475569">reason for, a control built for the legacy system.</text>
    <text x="255" y="556" text-anchor="middle" font-size="12.5" font-style="italic" fill="#64748B">The cheapest gap is the one that never existed.</text>
  </g>

  <!-- Card 4 -->
  <g filter="url(#shadow2)">
    <rect x="486" y="346" width="438" height="238" rx="12" fill="#0f172a"/>
    <rect x="486" y="346" width="438" height="56" rx="12" fill="#1e3a5f" opacity="0.7"/>
    <rect x="486" y="390" width="438" height="12" fill="#1e3a5f" opacity="0.7"/>
    <text x="705" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4 · HIGHEST LIFETIME COST</text>
    <text x="705" y="440" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Customize</text>
    <text x="705" y="472" text-anchor="middle" font-size="13.5" fill="#c9d3e6">Build what the system does not offer. Justified for</text>
    <text x="705" y="494" text-anchor="middle" font-size="13.5" fill="#c9d3e6">statutory and compliance needs — and paid for at</text>
    <text x="705" y="516" text-anchor="middle" font-size="13.5" fill="#c9d3e6">go-live, at every upgrade, and in every regression.</text>
    <text x="705" y="556" text-anchor="middle" font-size="12.5" font-style="italic" fill="#93C5FD">A justified customization beats one that happened by default.</text>
  </g>

  <rect x="36" y="600" width="888" height="1.5" fill="#E2E8F0"/>
  <text x="36" y="622" font-size="12.5" fill="#64748B">Customization must survive all four questions: compliance-required? genuinely business-critical? true workaround cost? upgrade impact?</text>
</svg>
