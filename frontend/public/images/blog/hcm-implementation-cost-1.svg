<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Arial, Helvetica, sans-serif">
<defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient></defs>
<rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="72" fill="url(#hdr)"/>
<text x="40" y="45" font-size="26" font-weight="bold" fill="#ffffff">What drives HCM implementation cost: six cost families</text>
<text x="40" y="105" font-size="15" fill="#64748B">Budget by driver, not by guess: each family grows or shrinks with specific, knowable factors.</text>
<rect x="30" y="130" width="365" height="175" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="54" y="168" font-size="16" font-weight="bold" fill="#1A202C">Subscription &amp; licensing</text><text x="54" y="198" font-size="13" fill="#475569">Priced from the vendor agreement:</text><text x="54" y="219" font-size="13" fill="#475569">population, modules selected,</text><text x="54" y="240" font-size="13" fill="#475569">contract term and environments</text><text x="54" y="287" font-size="12" fill="#64748B">Driver: who is in scope, and what is bought</text>
<rect x="415" y="130" width="365" height="175" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="439" y="168" font-size="16" font-weight="bold" fill="#1A202C">Implementation services</text><text x="439" y="198" font-size="13" fill="#475569">Discovery, design, configuration,</text><text x="439" y="219" font-size="13" fill="#475569">project management, testing and</text><text x="439" y="240" font-size="13" fill="#475569">go-live support effort</text><text x="439" y="287" font-size="12" fill="#64748B">Driver: scope clarity and decision speed</text>
<rect x="800" y="130" width="370" height="175" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="824" y="168" font-size="16" font-weight="bold" fill="#1A202C">Integrations</text><text x="824" y="198" font-size="13" fill="#475569">Each connected system adds design,</text><text x="824" y="219" font-size="13" fill="#475569">build, testing, error handling</text><text x="824" y="240" font-size="13" fill="#475569">and ongoing ownership</text><text x="824" y="287" font-size="12" fill="#64748B">Driver: integration count and complexity</text>
<rect x="30" y="325" width="365" height="175" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="54" y="363" font-size="16" font-weight="bold" fill="#1A202C">Data migration</text><text x="54" y="393" font-size="13" fill="#475569">Profiling, cleansing, mapping,</text><text x="54" y="414" font-size="13" fill="#475569">conversion cycles, reconciliation</text><text x="54" y="435" font-size="13" fill="#475569">and history decisions</text><text x="54" y="482" font-size="12" fill="#64748B">Driver: data quality and history depth</text>
<rect x="415" y="325" width="365" height="175" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="439" y="363" font-size="16" font-weight="bold" fill="#1A202C">Testing &amp; parallel runs</text><text x="439" y="393" font-size="13" fill="#475569">System testing, UAT support,</text><text x="439" y="414" font-size="13" fill="#475569">defect cycles and parallel payroll</text><text x="439" y="435" font-size="13" fill="#475569">or parallel operation effort</text><text x="439" y="482" font-size="12" fill="#64748B">Driver: test scope and defect volume</text>
<rect x="800" y="325" width="370" height="175" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="824" y="363" font-size="16" font-weight="bold" fill="#1A202C">Change, training &amp; internal time</text><text x="824" y="393" font-size="13" fill="#475569">Communications, training design</text><text x="824" y="414" font-size="13" fill="#475569">and delivery, backfill for experts</text><text x="824" y="435" font-size="13" fill="#475569">pulled from operational work</text><text x="824" y="482" font-size="12" fill="#64748B">Driver: populations affected, capacity protected</text>
<rect x="30" y="530" width="1140" height="180" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
<text x="54" y="568" font-size="16" font-weight="bold" fill="#1A202C">Plus: hypercare and contingency</text>
<text x="54" y="598" font-size="13" fill="#475569">Post-go-live support intensity, optimisation after stabilisation, and an explicit contingency held against named</text>
<text x="54" y="619" font-size="13" fill="#475569">risks — not a hidden padding line. If a cost family has no owner and no driver, it is not yet a budget line; it is a hope.</text>
<text x="54" y="660" font-size="12" fill="#64748B">Every family: name the driver, name the owner, state the assumption behind the estimate.</text>
<text x="54" y="685" font-size="12" fill="#2B6CB0">No figures are shown: honest budgets are built from your scope, your data and your agreements.</text>
</svg>