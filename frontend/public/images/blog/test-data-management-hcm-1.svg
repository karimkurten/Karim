<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="Georgia, 'DM Serif Display', serif"><defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B6CB0"/></marker></defs><rect width="1200" height="820" fill="#ffffff"/><rect x="0" y="0" width="1200" height="104" fill="url(#hdr)"/><text x="60" y="48" font-size="30" fill="#ffffff">The Test Data Lifecycle: Design It, Freeze It, Retire It</text><text x="60" y="80" font-size="17" fill="#94A3B8" font-family="Arial, sans-serif">Test data is a managed asset — with an owner, a version, and a destruction date</text><g filter="url(#sh)"><rect x="40" y="140" width="200" height="170" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="40" y="140" width="200" height="14" fill="#2B6CB0"/><text x="60" y="192" font-size="20" fill="#1A202C">1 — Design</text><text x="60" y="218" font-size="20" fill="#1A202C">Coverage</text><text x="60" y="250" font-size="15" fill="#475569" font-family="Arial, sans-serif">Start from the rules:</text><text x="60" y="274" font-size="15" fill="#475569" font-family="Arial, sans-serif">which record shapes</text><text x="60" y="298" font-size="15" fill="#475569" font-family="Arial, sans-serif">must testing exercise?</text><path d="M244 225 L262 225" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><g filter="url(#sh)"><rect x="268" y="140" width="200" height="170" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="268" y="140" width="200" height="14" fill="#2B6CB0"/><text x="288" y="192" font-size="20" fill="#1A202C">2 — Source</text><text x="288" y="218" font-size="20" fill="#1A202C">Safely</text><text x="288" y="250" font-size="15" fill="#475569" font-family="Arial, sans-serif">Synthetic records or</text><text x="288" y="274" font-size="15" fill="#475569" font-family="Arial, sans-serif">masked copies —</text><text x="288" y="298" font-size="15" fill="#475569" font-family="Arial, sans-serif">never raw production.</text><path d="M472 225 L490 225" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><g filter="url(#sh)"><rect x="496" y="140" width="200" height="170" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="496" y="140" width="200" height="14" fill="#2B6CB0"/><text x="516" y="192" font-size="20" fill="#1A202C">3 — Prepare and</text><text x="516" y="218" font-size="20" fill="#1A202C">Validate</text><text x="516" y="250" font-size="15" fill="#475569" font-family="Arial, sans-serif">Dates align, history is</text><text x="516" y="274" font-size="15" fill="#475569" font-family="Arial, sans-serif">coherent, masking is</text><text x="516" y="298" font-size="15" fill="#475569" font-family="Arial, sans-serif">checked complete.</text><path d="M700 225 L718 225" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><g filter="url(#sh)"><rect x="724" y="140" width="200" height="170" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="724" y="140" width="200" height="14" fill="#0f172a"/><text x="744" y="192" font-size="20" fill="#1A202C">4 — Freeze the</text><text x="744" y="218" font-size="20" fill="#1A202C">Baseline</text><text x="744" y="250" font-size="15" fill="#475569" font-family="Arial, sans-serif">A named version that</text><text x="744" y="274" font-size="15" fill="#475569" font-family="Arial, sans-serif">scripts and evidence</text><text x="744" y="298" font-size="15" fill="#475569" font-family="Arial, sans-serif">both reference.</text><path d="M928 225 L946 225" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><g filter="url(#sh)"><rect x="952" y="140" width="208" height="170" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="952" y="140" width="208" height="14" fill="#0f172a"/><text x="972" y="192" font-size="20" fill="#1A202C">5 — Use Across</text><text x="972" y="218" font-size="20" fill="#1A202C">Phases</text><text x="972" y="250" font-size="15" fill="#475569" font-family="Arial, sans-serif">System, integration,</text><text x="972" y="274" font-size="15" fill="#475569" font-family="Arial, sans-serif">UAT, parallel, and</text><text x="972" y="298" font-size="15" fill="#475569" font-family="Arial, sans-serif">regression runs.</text><text x="60" y="366" font-size="19" fill="#1A202C">Two safe sources feed stage 2:</text><g filter="url(#sh)"><rect x="40" y="386" width="540" height="140" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="40" y="386" width="14" height="140" fill="#2B6CB0"/><text x="74" y="424" font-size="22" fill="#1A202C">Synthetic Records</text><text x="74" y="456" font-size="16" fill="#475569" font-family="Arial, sans-serif">Invented records shaped precisely for designed</text><text x="74" y="480" font-size="16" fill="#475569" font-family="Arial, sans-serif">edge cases — safe to share, screenshot, and keep.</text><g filter="url(#sh)"><rect x="620" y="386" width="540" height="140" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="620" y="386" width="14" height="140" fill="#0f172a"/><text x="654" y="424" font-size="22" fill="#1A202C">Masked Production Copies</text><text x="654" y="456" font-size="16" fill="#475569" font-family="Arial, sans-serif">Real structure and history, with names, identifiers,</text><text x="654" y="480" font-size="16" fill="#475569" font-family="Arial, sans-serif">and bank details irreversibly altered and validated.</text><path d="M600 530 L600 566" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><g filter="url(#sh)"><rect x="240" y="570" width="720" height="130" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/></g><text x="600" y="614" font-size="22" fill="#1A202C" text-anchor="middle">Retire and Destroy on Schedule</text><text x="600" y="644" font-size="16" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">Wipe or re-mask environments at phase and programme close.</text><text x="600" y="670" font-size="15" fill="#2B6CB0" font-family="Arial, sans-serif" text-anchor="middle">Extracts and defect attachments are included in the wipe.</text><text x="600" y="748" font-size="16" fill="#64748B" font-family="Arial, sans-serif" text-anchor="middle">Changes to frozen data are logged — never made quietly mid-cycle.</text></svg>
