<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Mobile task control diagram: a punch, request, or approval checked for identity, queued offline and synced, rules applied, and manager approval completed before Core HR and payroll, with privacy and access controls">
  <defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient></defs>
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="88" fill="url(#hdr)"/>
  <text x="48" y="40" font-family="Georgia, serif" font-size="29" fill="#ffffff">One Mobile Task, Checked Before It Reaches Pay</text>
  <text x="48" y="70" font-family="Arial, sans-serif" font-size="20" fill="#94A3B8">Identity to offline sync to approval — with privacy and access throughout</text>
  <g><rect x="40" y="112" width="340" height="200" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/><text x="64" y="146" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Mobile Task Started</text><text x="64" y="180" font-family="Arial, sans-serif" font-size="15" fill="#475569">Worker starts a punch, a</text><text x="64" y="202" font-family="Arial, sans-serif" font-size="15" fill="#475569">request, or a schedule check</text><text x="64" y="224" font-family="Arial, sans-serif" font-size="15" fill="#475569">on a personal or shared</text><text x="64" y="246" font-family="Arial, sans-serif" font-size="15" fill="#475569">device, on shift.</text><text x="64" y="292" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Owner: Employee</text></g>
  <g><rect x="430" y="112" width="340" height="200" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="454" y="146" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Identity Checked</text><text x="454" y="180" font-family="Arial, sans-serif" font-size="15" fill="#475569">Sign-in by badge, number,</text><text x="454" y="202" font-family="Arial, sans-serif" font-size="15" fill="#475569">or verified phone — no work</text><text x="454" y="224" font-family="Arial, sans-serif" font-size="15" fill="#475569">email required. Recovery</text><text x="454" y="246" font-family="Arial, sans-serif" font-size="15" fill="#475569">works on shift.</text><text x="454" y="292" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Owner: System, HR</text></g>
  <g><rect x="820" y="112" width="340" height="200" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="844" y="146" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Offline Queue and Sync</text><text x="844" y="180" font-family="Arial, sans-serif" font-size="15" fill="#475569">Capture stored safely with</text><text x="844" y="202" font-family="Arial, sans-serif" font-size="15" fill="#475569">visible confirmation, synced</text><text x="844" y="224" font-family="Arial, sans-serif" font-size="15" fill="#475569">when signal returns.</text><text x="844" y="246" font-family="Arial, sans-serif" font-size="15" fill="#475569">Conflicts routed to review.</text><text x="844" y="292" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Owner: System, Ops</text></g>
  <g><rect x="40" y="344" width="340" height="140" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="64" y="378" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Rules Applied</text><text x="64" y="412" font-family="Arial, sans-serif" font-size="15" fill="#475569">Schedule, absence, and pay</text><text x="64" y="434" font-family="Arial, sans-serif" font-size="15" fill="#475569">rules applied in order.</text><text x="64" y="464" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Effect: Accuracy</text></g>
  <g><rect x="430" y="344" width="340" height="140" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="454" y="378" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Manager Approval</text><text x="454" y="412" font-family="Arial, sans-serif" font-size="15" fill="#475569">Approvals, swaps, and</text><text x="454" y="434" font-family="Arial, sans-serif" font-size="15" fill="#475569">exceptions decided on shift.</text><text x="454" y="464" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Effect: Decision</text></g>
  <g><rect x="820" y="344" width="340" height="140" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="844" y="378" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Core HR and Payroll</text><text x="844" y="412" font-family="Arial, sans-serif" font-size="15" fill="#475569">Approved result flows to the</text><text x="844" y="434" font-family="Arial, sans-serif" font-size="15" fill="#475569">record and to payroll.</text><text x="844" y="464" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Effect: Pay</text></g>
  <rect x="40" y="508" width="1120" height="72" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="540" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Privacy and access strip</text>
  <text x="64" y="566" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Personal-device choice respected, location only when justified and stated, shared-device sign-out enforced.</text>
  <text x="40" y="612" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Figure 2 — Mobile task control diagram</text>
</svg>
