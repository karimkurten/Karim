<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#F0F4F8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="600" rx="14" fill="#F0F4F8"/>
  <rect x="0" y="0" width="960" height="600" rx="14" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  <text x="36" y="46" font-size="24" font-weight="700" fill="#1A202C">The Fit-Gap Decision Path</text>
  <text x="36" y="70" font-size="14" fill="#64748B">Every requirement takes one path — the discipline is deciding honestly, and in order</text>

  <!-- Requirement pill -->
  <g filter="url(#shadow)">
    <rect x="36" y="104" width="220" height="56" rx="28" fill="url(#hero)"/>
    <text x="146" y="139" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Requirement</text>
  </g>

  <!-- Arrow down -->
  <line x1="146" y1="160" x2="146" y2="200" stroke="#2B6CB0" stroke-width="3"/>
  <polygon points="146,212 138,198 154,198" fill="#2B6CB0"/>

  <!-- Decision diamond -->
  <g filter="url(#shadow)">
    <polygon points="146,216 330,286 146,356 36,286" fill="#ffffff" stroke="#2B6CB0" stroke-width="3"/>
    <text x="146" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#1A202C">Met by standard</text>
    <text x="146" y="300" text-anchor="middle" font-size="15" font-weight="700" fill="#1A202C">capability?</text>
  </g>

  <!-- YES branch (right) -->
  <text x="330" y="250" font-size="14" font-weight="700" fill="#2B6CB0">YES</text>
  <line x1="330" y1="286" x2="400" y2="286" stroke="#2B6CB0" stroke-width="3"/>
  <polygon points="412,286 398,278 398,294" fill="#2B6CB0"/>
  <g filter="url(#shadow)">
    <rect x="412" y="216" width="512" height="140" rx="12" fill="url(#hero)"/>
    <text x="668" y="252" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">FIT — Adopt the standard process</text>
    <text x="668" y="280" text-anchor="middle" font-size="13.5" fill="#c9d3e6">Configuration only. Change the process to match the system, not the reverse.</text>
    <text x="668" y="308" text-anchor="middle" font-size="13.5" fill="#c9d3e6">Record who agreed. Signed fits do not get re-litigated.</text>
  </g>

  <!-- NO branch (down) -->
  <text x="160" y="400" font-size="14" font-weight="700" fill="#2B6CB0">NO</text>
  <line x1="146" y1="356" x2="146" y2="420" stroke="#2B6CB0" stroke-width="3"/>
  <polygon points="146,432 138,418 154,418" fill="#2B6CB0"/>
  <g filter="url(#shadow)">
    <rect x="36" y="432" width="220" height="56" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
    <text x="146" y="456" text-anchor="middle" font-size="15" font-weight="700" fill="#1A202C">GAP</text>
    <text x="146" y="476" text-anchor="middle" font-size="12.5" fill="#64748B">needs a decision</text>
  </g>

  <!-- Disposition cards -->
  <g font-size="13" fill="#475569">
    <g filter="url(#shadow)">
      <rect x="300" y="420" width="150" height="120" rx="10" fill="#ffffff" stroke="#2B6CB0" stroke-width="2.5"/>
      <text x="375" y="448" text-anchor="middle" font-size="13" font-weight="700" fill="#2B6CB0">1 · Configure</text>
      <text x="375" y="470" text-anchor="middle" font-size="11.5">Fields, rules,</text>
      <text x="375" y="486" text-anchor="middle" font-size="11.5">workflows —</text>
      <text x="375" y="502" text-anchor="middle" font-size="11.5">no code needed</text>
      <text x="375" y="524" text-anchor="middle" font-size="11" font-weight="700" fill="#2B6CB0">cheapest</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="466" y="420" width="150" height="120" rx="10" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
      <text x="541" y="448" text-anchor="middle" font-size="13" font-weight="700" fill="#1A202C">2 · Adapt</text>
      <text x="541" y="470" text-anchor="middle" font-size="11.5">Change how work</text>
      <text x="541" y="486" text-anchor="middle" font-size="11.5">gets done to match</text>
      <text x="541" y="502" text-anchor="middle" font-size="11.5">the standard</text>
      <text x="541" y="524" text-anchor="middle" font-size="11" font-weight="700" fill="#2B6CB0">needs authority</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="632" y="420" width="150" height="120" rx="10" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
      <text x="707" y="448" text-anchor="middle" font-size="13" font-weight="700" fill="#1A202C">3 · Change policy</text>
      <text x="707" y="470" text-anchor="middle" font-size="11.5">The requirement</text>
      <text x="707" y="486" text-anchor="middle" font-size="11.5">itself may be</text>
      <text x="707" y="502" text-anchor="middle" font-size="11.5">outdated</text>
      <text x="707" y="524" text-anchor="middle" font-size="11" font-weight="700" fill="#2B6CB0">cheapest fix</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="798" y="420" width="126" height="120" rx="10" fill="#0f172a"/>
      <text x="861" y="448" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4 · Customize</text>
      <text x="861" y="470" text-anchor="middle" font-size="11.5" fill="#c9d3e6">Build what the</text>
      <text x="861" y="486" text-anchor="middle" font-size="11.5" fill="#c9d3e6">system lacks —</text>
      <text x="861" y="502" text-anchor="middle" font-size="11.5" fill="#c9d3e6">justify it first</text>
      <text x="861" y="524" text-anchor="middle" font-size="11" font-weight="700" fill="#93C5FD">highest lifetime cost</text>
    </g>
  </g>

  <!-- Footer rule -->
  <rect x="36" y="556" width="888" height="1.5" fill="#E2E8F0"/>
  <text x="36" y="580" font-size="12.5" fill="#64748B">Before customizing, answer all four: compliance-required? genuinely business-critical? true lifetime workaround cost? upgrade impact?</text>
</svg>
