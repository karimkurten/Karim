<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="Georgia, 'DM Serif Display', serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="880" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="104" fill="url(#hdr)"/>
  <text x="60" y="48" font-size="30" fill="#ffffff">The Five UAT Sign-Off Criteria</text>
  <text x="60" y="80" font-size="17" fill="#94A3B8" font-family="Arial, sans-serif">Agreed before testing begins — each criterion must pass, or be formally excepted, before anyone signs</text>

  <rect x="60" y="140" width="52" height="640" rx="10" fill="#F0F4F8" stroke="#E2E8F0"/>
  <text x="86" y="200" font-size="16" fill="#2B6CB0" font-family="Arial, sans-serif" text-anchor="middle" transform="rotate(-90 86 460)">ALL FIVE — NO CRITERION IS OPTIONAL</text>
  <path d="M86 716 L74 692 L98 692 Z" fill="#2B6CB0"/>

  <g filter="url(#sh)">
    <rect x="140" y="132" width="1000" height="112" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  </g>
  <rect x="140" y="132" width="14" height="112" fill="#0f172a"/>
  <text x="178" y="170" font-size="24" fill="#1A202C">1. Coverage</text>
  <text x="178" y="198" font-size="17" fill="#475569" font-family="Arial, sans-serif">Every in-scope script executed, or formally accounted for.</text>
  <text x="178" y="224" font-size="16" fill="#2B6CB0" font-family="Arial, sans-serif">Pass test: pass, fail, or a documented reason — no script in an unknown state.</text>
  <text x="820" y="198" font-size="16" fill="#64748B" font-family="Arial, sans-serif">Blocked script: cause, owner,</text>
  <text x="820" y="222" font-size="16" fill="#64748B" font-family="Arial, sans-serif">retest date or alternative route.</text>

  <g filter="url(#sh)">
    <rect x="140" y="268" width="1000" height="112" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  </g>
  <rect x="140" y="268" width="14" height="112" fill="#1e3a5f"/>
  <text x="178" y="306" font-size="24" fill="#1A202C">2. Defect Position</text>
  <text x="178" y="334" font-size="17" fill="#475569" font-family="Arial, sans-serif">The open defect list meets the gates agreed with triage.</text>
  <text x="178" y="360" font-size="16" fill="#2B6CB0" font-family="Arial, sans-serif">Pass test: no critical defects open at sign-off.</text>
  <text x="820" y="334" font-size="16" fill="#64748B" font-family="Arial, sans-serif">Majors: fixed, or accepted with</text>
  <text x="820" y="358" font-size="16" fill="#64748B" font-family="Arial, sans-serif">workaround, owner, and date.</text>

  <g filter="url(#sh)">
    <rect x="140" y="404" width="1000" height="112" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  </g>
  <rect x="140" y="404" width="14" height="112" fill="#2B6CB0"/>
  <text x="178" y="442" font-size="24" fill="#1A202C">3. Evidence</text>
  <text x="178" y="470" font-size="17" fill="#475569" font-family="Arial, sans-serif">Results recorded in the test tool or log — never held in memory.</text>
  <text x="178" y="496" font-size="16" fill="#2B6CB0" font-family="Arial, sans-serif">Pass test: script to result, failure to defect, defect to decision.</text>
  <text x="820" y="470" font-size="16" fill="#64748B" font-family="Arial, sans-serif">Who ran it, with what data,</text>
  <text x="820" y="494" font-size="16" fill="#64748B" font-family="Arial, sans-serif">and what happened — recorded.</text>

  <g filter="url(#sh)">
    <rect x="140" y="540" width="1000" height="112" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  </g>
  <rect x="140" y="540" width="14" height="112" fill="#2563EB"/>
  <text x="178" y="578" font-size="24" fill="#1A202C">4. Scenario Completeness</text>
  <text x="178" y="606" font-size="17" fill="#475569" font-family="Arial, sans-serif">Critical end-to-end journeys ran as connected flows, not fragments.</text>
  <text x="178" y="632" font-size="16" fill="#2B6CB0" font-family="Arial, sans-serif">Pass test: each named journey completed with reconciled results.</text>
  <text x="820" y="606" font-size="16" fill="#64748B" font-family="Arial, sans-serif">Hire to pay; time capture to</text>
  <text x="820" y="630" font-size="16" fill="#64748B" font-family="Arial, sans-serif">payroll; enrolment to deduction.</text>

  <g filter="url(#sh)">
    <rect x="140" y="676" width="1000" height="112" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  </g>
  <rect x="140" y="676" width="14" height="112" fill="#94A3B8"/>
  <text x="178" y="714" font-size="24" fill="#1A202C">5. Operational Readiness</text>
  <text x="178" y="742" font-size="17" fill="#475569" font-family="Arial, sans-serif">The business can operate what testing has proved.</text>
  <text x="178" y="768" font-size="16" fill="#2B6CB0" font-family="Arial, sans-serif">Pass test: training scheduled, support routes named, workarounds shown.</text>
  <text x="820" y="742" font-size="16" fill="#64748B" font-family="Arial, sans-serif">A workaround nobody has</text>
  <text x="820" y="766" font-size="16" fill="#64748B" font-family="Arial, sans-serif">practised is a hope, not a control.</text>

  <text x="60" y="852" font-size="15" fill="#64748B" font-family="Arial, sans-serif">Sign-off certifies fitness with documented exceptions — it never certifies perfection.</text>
</svg>
