<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#F0F4F8"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="880" rx="16" fill="#F0F4F8"/>

  <rect x="0" y="0" width="1200" height="96" rx="16" fill="url(#hero)"/>
  <rect x="0" y="80" width="1200" height="16" fill="url(#hero)"/>
  <text x="48" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#ffffff" font-weight="bold">Five Estimation Techniques That Actually Work</text>
  <text x="48" y="76" font-size="15" fill="#94A3B8">Compare the techniques — then use at least two of them together (triangulation)</text>

  <text x="340" y="124" font-size="13" font-weight="bold" fill="#64748B" letter-spacing="1">BEST USED WHEN</text>
  <text x="655" y="124" font-size="13" font-weight="bold" fill="#64748B" letter-spacing="1">STRENGTH</text>
  <text x="920" y="124" font-size="13" font-weight="bold" fill="#64748B" letter-spacing="1">WATCH OUT</text>

  <!-- Technique 1 -->
  <g filter="url(#soft)">
    <rect x="24" y="138" width="1152" height="122" rx="12" fill="url(#card)" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="72" cy="199" r="26" fill="#2B6CB0"/>
    <text x="72" y="208" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="116" y="186" font-size="19" font-weight="bold" fill="#1A202C">Analogous Estimating</text>
    <text x="116" y="210" font-size="13.5" fill="#64748B">Reference-class estimates</text>
    <text x="116" y="232" font-size="13.5" fill="#64748B">Fast, honest first pass</text>
    <text x="340" y="172" font-size="14" fill="#475569"><tspan x="340" dy="0">You have completed projects of</tspan><tspan x="340" dy="19">similar size, scope, and client</tspan><tspan x="340" dy="19">profile to compare against.</tspan></text>
    <text x="655" y="172" font-size="14" fill="#475569"><tspan x="655" dy="0">Grounded in real delivery</tspan><tspan x="655" dy="19">history; naturally resists</tspan><tspan x="655" dy="19">optimism bias.</tspan></text>
    <text x="920" y="172" font-size="14" fill="#475569"><tspan x="920" dy="0">"Similar" does all the work —</tspan><tspan x="920" dy="19">a bad comparison poisons</tspan><tspan x="920" dy="19">the whole estimate.</tspan></text>
  </g>

  <!-- Technique 2 -->
  <g filter="url(#soft)">
    <rect x="24" y="272" width="1152" height="122" rx="12" fill="url(#card)" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="72" cy="333" r="26" fill="#2B6CB0"/>
    <text x="72" y="342" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="116" y="320" font-size="19" font-weight="bold" fill="#1A202C">Parametric Rules</text>
    <text x="116" y="344" font-size="13.5" fill="#64748B">Units of effort — per module,</text>
    <text x="116" y="366" font-size="13.5" fill="#64748B">per entity, per integration</text>
    <text x="340" y="306" font-size="14" fill="#475569"><tspan x="340" dy="0">A repeatable unit of work</tspan><tspan x="340" dy="19">exists — effort per module,</tspan><tspan x="340" dy="19">per legal entity, per interface.</tspan></text>
    <text x="655" y="306" font-size="14" fill="#475569"><tspan x="655" dy="0">Quick sanity checks; instantly</tspan><tspan x="655" dy="19">exposes estimates that are</tspan><tspan x="655" dy="19">wildly off trend.</tspan></text>
    <text x="920" y="306" font-size="14" fill="#475569"><tspan x="920" dy="0">Rates decay across contexts —</tspan><tspan x="920" dy="19">last year's ratio may not</tspan><tspan x="920" dy="19">survive this project.</tspan></text>
  </g>

  <!-- Technique 3 -->
  <g filter="url(#soft)">
    <rect x="24" y="406" width="1152" height="122" rx="12" fill="url(#card)" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="72" cy="467" r="26" fill="#2B6CB0"/>
    <text x="72" y="476" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="116" y="454" font-size="19" font-weight="bold" fill="#1A202C">Bottom-Up WBS Build</text>
    <text x="116" y="478" font-size="13.5" fill="#64748B">Work-package by</text>
    <text x="116" y="500" font-size="13.5" fill="#64748B">work-package</text>
    <text x="340" y="440" font-size="14" fill="#475569"><tspan x="340" dy="0">The WBS is decomposed enough</tspan><tspan x="340" dy="19">that every work package has a</tspan><tspan x="340" dy="19">named owner and exit criteria.</tspan></text>
    <text x="655" y="440" font-size="14" fill="#475569"><tspan x="655" dy="0">Most defensible at sign-off —</tspan><tspan x="655" dy="19">every number ties to named,</tspan><tspan x="655" dy="19">owned work.</tspan></text>
    <text x="920" y="440" font-size="14" fill="#475569"><tspan x="920" dy="0">A sum of optimistic parts is</tspan><tspan x="920" dy="19">still optimistic — and it is only</tspan><tspan x="920" dy="19">as complete as the WBS.</tspan></text>
  </g>

  <!-- Technique 4 -->
  <g filter="url(#soft)">
    <rect x="24" y="540" width="1152" height="122" rx="12" fill="url(#card)" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="72" cy="601" r="26" fill="#2B6CB0"/>
    <text x="72" y="610" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="116" y="588" font-size="19" font-weight="bold" fill="#1A202C">Three-Point (PERT)</text>
    <text x="116" y="612" font-size="13.5" fill="#64748B">Optimistic / most-likely /</text>
    <text x="116" y="634" font-size="13.5" fill="#64748B">pessimistic ranges</text>
    <text x="340" y="574" font-size="14" fill="#475569"><tspan x="340" dy="0">Uncertainty is high and</tspan><tspan x="340" dy="19">single-point guesses invite</tspan><tspan x="340" dy="19">false precision.</tspan></text>
    <text x="655" y="574" font-size="14" fill="#475569"><tspan x="655" dy="0">Replaces "six weeks" with an</tspan><tspan x="655" dy="19">honest, defensible band the</tspan><tspan x="655" dy="19">team can stand behind.</tspan></text>
    <text x="920" y="574" font-size="14" fill="#475569"><tspan x="920" dy="0">Teams game the inputs —</tspan><tspan x="920" dy="19">wishful optimistics, padded</tspan><tspan x="920" dy="19">pessimistics.</tspan></text>
  </g>

  <!-- Technique 5 -->
  <g filter="url(#soft)">
    <rect x="24" y="674" width="1152" height="122" rx="12" fill="url(#card)" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="72" cy="735" r="26" fill="#2B6CB0"/>
    <text x="72" y="744" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <text x="116" y="722" font-size="19" font-weight="bold" fill="#1A202C">Expert Judgment</text>
    <text x="116" y="746" font-size="13.5" fill="#64748B">Calibrated teams, Delphi-</text>
    <text x="116" y="768" font-size="13.5" fill="#64748B">style, wideband</text>
    <text x="340" y="708" font-size="14" fill="#475569"><tspan x="340" dy="0">No reference data exists and</tspan><tspan x="340" dy="19">judgment must be formalized</tspan><tspan x="340" dy="19">rather than guessed.</tspan></text>
    <text x="655" y="708" font-size="14" fill="#475569"><tspan x="655" dy="0">Surfaces tacit knowledge</tspan><tspan x="655" dy="19">that no dataset contains.</tspan></text>
    <text x="920" y="708" font-size="14" fill="#475569"><tspan x="920" dy="0">Anchoring and hierarchy —</tspan><tspan x="920" dy="19">the first voice, or the loudest</tspan><tspan x="920" dy="19">title, wins.</tspan></text>
  </g>

  <rect x="24" y="812" width="1152" height="44" rx="10" fill="#ffffff" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="600" y="840" font-size="15" fill="#1A202C" text-anchor="middle" font-weight="bold">No single technique stands alone — triangulate with at least two, and treat a big disagreement as the real finding.</text>
</svg>
