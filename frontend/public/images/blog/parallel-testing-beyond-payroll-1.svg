<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="Georgia, 'DM Serif Display', serif"><defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B6CB0"/></marker></defs><rect width="1200" height="880" fill="#ffffff"/><rect x="0" y="0" width="1200" height="104" fill="url(#hdr)"/><text x="60" y="48" font-size="30" fill="#ffffff">Parallel Scope: Prove the Whole Record, Not Just the Payslip</text><text x="60" y="80" font-size="17" fill="#94A3B8" font-family="Arial, sans-serif">One shared employee record — four comparisons, each reconciled at a period boundary</text><g filter="url(#sh)"><rect x="330" y="132" width="540" height="96" rx="12" fill="#1e3a5f"/></g><text x="600" y="172" font-size="24" fill="#ffffff" text-anchor="middle">One Employee Record</text><text x="600" y="200" font-size="16" fill="#E2E8F0" font-family="Arial, sans-serif" text-anchor="middle">Same inputs, same period, same population — in both systems</text><path d="M600 230 L600 262" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><g filter="url(#sh)"><rect x="90" y="276" width="480" height="150" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="90" y="276" width="14" height="150" fill="#0f172a"/><text x="124" y="314" font-size="23" fill="#1A202C">Payroll</text><text x="124" y="344" font-size="16" fill="#475569" font-family="Arial, sans-serif">Gross-to-net pay and statutory deductions,</text><text x="124" y="368" font-size="16" fill="#475569" font-family="Arial, sans-serif">compared per employee for the parallel period.</text><g filter="url(#sh)"><rect x="630" y="276" width="480" height="150" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="630" y="276" width="14" height="150" fill="#2B6CB0"/><text x="664" y="314" font-size="23" fill="#1A202C">Benefits</text><text x="664" y="344" font-size="16" fill="#475569" font-family="Arial, sans-serif">Eligibility, elections, coverage tiers, and</text><text x="664" y="368" font-size="16" fill="#475569" font-family="Arial, sans-serif">employee and employer costs per plan.</text><g filter="url(#sh)"><rect x="90" y="456" width="480" height="150" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="90" y="456" width="14" height="150" fill="#2B6CB0"/><text x="124" y="494" font-size="23" fill="#1A202C">Time</text><text x="124" y="524" font-size="16" fill="#475569" font-family="Arial, sans-serif">Hours by earning type — regular, overtime,</text><text x="124" y="548" font-size="16" fill="#475569" font-family="Arial, sans-serif">premiums — plus approval outcomes.</text><g filter="url(#sh)"><rect x="630" y="456" width="480" height="150" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="630" y="456" width="14" height="150" fill="#0f172a"/><text x="664" y="494" font-size="23" fill="#1A202C">Absence and Balances</text><text x="664" y="524" font-size="16" fill="#475569" font-family="Arial, sans-serif">Leave taken, accruals earned, caps applied,</text><text x="664" y="548" font-size="16" fill="#475569" font-family="Arial, sans-serif">and closing balances at the boundary.</text><g filter="url(#sh)"><rect x="240" y="640" width="720" height="120" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/></g><text x="600" y="684" font-size="22" fill="#1A202C" text-anchor="middle">Every output reconciled at a period boundary</text><text x="600" y="714" font-size="16" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">A difference is classified and explained — never closed with a plausible story.</text><text x="600" y="740" font-size="15" fill="#2B6CB0" font-family="Arial, sans-serif" text-anchor="middle">Cross-border: run and report each jurisdiction separately.</text></svg>