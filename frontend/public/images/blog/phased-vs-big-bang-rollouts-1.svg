<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1080" viewBox="0 0 760 1080" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="760" height="1080" fill="#ffffff"/>
  <rect x="0" y="0" width="760" height="86" fill="url(#hdr)"/>
  <text x="380" y="38" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700">Rollout Strategy Decision Flowchart</text>
  <text x="380" y="64" text-anchor="middle" fill="#94A3B8" font-size="13">Five gates in order — the first failed gate decides. Do not negotiate with a failed gate.</text>

  <!-- start -->
  <rect x="180" y="110" width="400" height="54" rx="27" fill="#2B6CB0"/>
  <text x="380" y="143" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="600">Choose your rollout strategy</text>

  <g font-size="15" font-weight="600">
    <!-- G1 -->
    <line x1="380" y1="164" x2="380" y2="196" stroke="#94A3B8" stroke-width="2"/>
    <rect x="130" y="196" width="500" height="66" rx="8" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="380" y="224" text-anchor="middle" fill="#1A202C">Gate 1: Can the data convert as one set?</text>
    <text x="380" y="247" text-anchor="middle" fill="#64748B" font-size="12" font-weight="400">Coherent conversion vs. clean partitions by entity or country</text>
    <text x="330" y="286" fill="#2B6CB0" font-size="13">Yes ↓</text>
    <line x1="630" y1="229" x2="700" y2="229" stroke="#94A3B8" stroke-width="2"/>
    <text x="700" y="233" text-anchor="start" fill="#64748B" font-size="13">No → Phased</text>

    <!-- G2 -->
    <rect x="130" y="292" width="500" height="66" rx="8" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="380" y="320" text-anchor="middle" fill="#1A202C">Gate 2: Can payroll risk concentrate?</text>
    <text x="380" y="343" text-anchor="middle" fill="#64748B" font-size="12" font-weight="400">One combined cutover for every pay cycle in scope</text>
    <text x="330" y="382" fill="#2B6CB0" font-size="13">Yes ↓</text>
    <line x1="630" y1="325" x2="700" y2="325" stroke="#94A3B8" stroke-width="2"/>
    <text x="700" y="329" text-anchor="start" fill="#64748B" font-size="13">No → Phased</text>

    <!-- G3 -->
    <rect x="130" y="388" width="500" height="66" rx="8" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="380" y="416" text-anchor="middle" fill="#1A202C">Gate 3: Can the org absorb the change spike?</text>
    <text x="380" y="439" text-anchor="middle" fill="#64748B" font-size="12" font-weight="400">Training throughput, support staffing, operational calendar</text>
    <text x="330" y="478" fill="#2B6CB0" font-size="13">Yes ↓</text>
    <line x1="630" y1="421" x2="700" y2="421" stroke="#94A3B8" stroke-width="2"/>
    <text x="700" y="425" text-anchor="start" fill="#64748B" font-size="13">No → Phased</text>

    <!-- G4 -->
    <rect x="130" y="484" width="500" height="66" rx="8" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="380" y="512" text-anchor="middle" fill="#1A202C">Gate 4: Will sponsorship survive the timeline?</text>
    <text x="380" y="535" text-anchor="middle" fill="#64748B" font-size="12" font-weight="400">Sustained executive attention across every wave</text>
    <text x="330" y="574" fill="#2B6CB0" font-size="13">Yes ↓</text>
    <line x1="630" y1="517" x2="700" y2="517" stroke="#94A3B8" stroke-width="2"/>
    <text x="700" y="521" text-anchor="start" fill="#64748B" font-size="13">No → Big-bang, carefully</text>

    <!-- G5 -->
    <rect x="130" y="580" width="500" height="66" rx="8" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="380" y="608" text-anchor="middle" fill="#1A202C">Gate 5: Does the math justify the premium?</text>
    <text x="380" y="631" text-anchor="middle" fill="#64748B" font-size="12" font-weight="400">Phased costs more — it must buy de-risking big-bang cannot</text>
    <text x="330" y="670" fill="#2B6CB0" font-size="13">Yes ↓</text>
    <line x1="630" y1="613" x2="700" y2="613" stroke="#94A3B8" stroke-width="2"/>
    <text x="700" y="617" text-anchor="start" fill="#64748B" font-size="13">No → Big-bang</text>

    <!-- connector down to outcomes -->
    <line x1="380" y1="646" x2="380" y2="700" stroke="#94A3B8" stroke-width="2"/>
    <line x1="380" y1="700" x2="240" y2="700" stroke="#94A3B8" stroke-width="2"/>
    <line x1="380" y1="700" x2="520" y2="700" stroke="#94A3B8" stroke-width="2"/>
    <line x1="240" y1="700" x2="240" y2="730" stroke="#94A3B8" stroke-width="2"/>
    <line x1="520" y1="700" x2="520" y2="730" stroke="#94A3B8" stroke-width="2"/>

    <!-- outcomes -->
    <rect x="80" y="730" width="320" height="80" rx="10" fill="#0f172a"/>
    <text x="240" y="762" text-anchor="middle" fill="#ffffff" font-size="19">BIG-BANG</text>
    <text x="240" y="788" text-anchor="middle" fill="#94A3B8" font-size="12" font-weight="400">Concentrated risk, one hypercare</text>
    <rect x="360" y="730" width="320" height="80" rx="10" fill="#1e3a5f"/>
    <text x="520" y="762" text-anchor="middle" fill="#ffffff" font-size="19">PHASED</text>
    <text x="520" y="788" text-anchor="middle" fill="#94A3B8" font-size="12" font-weight="400">Distributed risk, waves compound</text>
  </g>

  <rect x="40" y="860" width="680" height="170" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="70" y="895" fill="#1A202C" font-size="15" font-weight="700">How to read this</text>
  <text x="70" y="922" fill="#475569" font-size="13">Gates 1–3 failing point to phased: the scope or the organization cannot take a single event.</text>
  <text x="70" y="946" fill="#475569" font-size="13">Gate 4 failing points to big-bang: a phased timeline without sustained sponsorship bleeds.</text>
  <text x="70" y="970" fill="#475569" font-size="13">Gate 5 failing points to big-bang: the phased premium must buy real de-risking, not comfort.</text>
  <text x="70" y="1004" fill="#64748B" font-size="12">Document the rationale — the question will be asked again when the schedule slips.</text>
</svg>
