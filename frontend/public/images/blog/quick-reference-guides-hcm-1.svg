<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="72" fill="url(#hdr)"/>
  <text x="40" y="45" font-size="26" font-weight="bold" fill="#ffffff">Anatomy of a usable quick reference guide</text>
  <text x="40" y="105" font-size="15" fill="#64748B">One task, titled in the user's words, built to be scanned at a glance — never studied.</text>
  <rect x="40" y="130" width="700" height="440" rx="10" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="40" y="130" width="700" height="58" rx="10" fill="url(#hdr)"/>
  <text x="64" y="167" font-size="19" font-weight="bold" fill="#ffffff">Title: the task in the user's words</text>
  <g font-size="15" fill="#475569">
    <text x="64" y="228" font-size="17" font-weight="bold" fill="#1A202C">Steps in performance order</text>
    <text x="64" y="260">1. Open the record you need to correct</text>
    <text x="64" y="286">2. Enter the corrected values</text>
    <text x="64" y="312">3. Check the decision panel below</text>
    <text x="64" y="338">4. Submit and confirm the result</text>
  </g>
  <rect x="64" y="362" width="310" height="92" rx="8" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
  <text x="82" y="390" font-size="16" font-weight="bold" fill="#1A202C">Decision panel</text>
  <text x="82" y="416" font-size="14" fill="#475569">If the period is closed,</text>
  <text x="82" y="438" font-size="14" fill="#475569">use the retroactive guide instead</text>
  <rect x="398" y="362" width="318" height="92" rx="8" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  <text x="416" y="390" font-size="16" font-weight="bold" fill="#1A202C">Common-error panel</text>
  <text x="416" y="416" font-size="14" fill="#475569">Warning placed before the step</text>
  <text x="416" y="438" font-size="14" fill="#475569">it protects — never after it</text>
  <rect x="64" y="478" width="652" height="68" rx="8" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
  <text x="82" y="506" font-size="15" font-weight="bold" fill="#1A202C">Footer: version, owner, review date</text>
  <text x="82" y="530" font-size="14" fill="#475569">Plus the route to the full manual and to human help</text>
  <g font-size="15" fill="#475569">
    <rect x="780" y="130" width="380" height="130" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="800" y="162" font-size="17" font-weight="bold" fill="#1A202C">What stays off the card</text>
    <text x="800" y="192">Background and rationale</text>
    <text x="800" y="216">Policy detail and every variant</text>
    <text x="800" y="240">A second task, however small</text>
    <rect x="780" y="284" width="380" height="130" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="800" y="316" font-size="17" font-weight="bold" fill="#1A202C">Screenshots with a job</text>
    <text x="800" y="346">Only where they answer</text>
    <text x="800" y="370">where do I click — cropped</text>
    <text x="800" y="394">tightly, refreshed on change</text>
    <rect x="780" y="438" width="380" height="132" rx="10" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="800" y="470" font-size="17" font-weight="bold" fill="#1A202C">The glance test</text>
    <text x="800" y="500">Readable at arm's length,</text>
    <text x="800" y="524">on paper and on a phone,</text>
    <text x="800" y="548">in the middle of the task</text>
  </g>
  <text x="40" y="612" font-size="14" fill="#94A3B8">Every element earns its place: title, steps, one decision, the likely error, and the way out.</text>
</svg>
