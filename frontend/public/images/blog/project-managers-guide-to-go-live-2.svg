<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Escalation and communication cadence during the cutover weekend: issue raised, PM triage, decision at the right level, then a scheduled update">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2B6CB0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="92" fill="url(#hdr)"/>
  <text x="48" y="46" font-family="Georgia, serif" font-size="30" fill="#ffffff">Cutover Weekend: Escalation and Cadence</text>
  <text x="48" y="74" font-family="Arial, sans-serif" font-size="16" fill="#94A3B8">Every issue is triaged once, decided at the right level — and every decision returns as an update</text>

  <!-- stage row -->
  <g>
    <rect x="140" y="130" width="420" height="150" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="164" y="168" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">1 · Issue Raised</text>
    <text x="164" y="198" font-family="Arial, sans-serif" font-size="14" fill="#475569">Logged once, in the single</text>
    <text x="164" y="222" font-family="Arial, sans-serif" font-size="14" fill="#475569">issue log everyone can see</text>
    <text x="164" y="252" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Raised by: anyone on shift</text>
  </g>
  <path d="M 564 205 L 576 205" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>
  <g>
    <rect x="580" y="130" width="420" height="150" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="604" y="168" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">2 · PM Triage</text>
    <text x="604" y="198" font-family="Arial, sans-serif" font-size="14" fill="#475569">One test: does it block the next</text>
    <text x="604" y="222" font-family="Arial, sans-serif" font-size="14" fill="#475569">step, or risk a live process?</text>
    <text x="604" y="252" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Owner: project manager</text>
  </g>

  <!-- distribution connector -->
  <path d="M 790 284 L 790 302 L 220 302 L 220 322" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M 600 302 L 600 322" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M 790 302 L 980 302 L 980 322" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>

  <!-- decision levels row -->
  <g>
    <rect x="40" y="326" width="360" height="170" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="64" y="364" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">Workstream Lead</text>
    <text x="64" y="394" font-family="Arial, sans-serif" font-size="14" fill="#475569">Resolves within the runbook:</text>
    <text x="64" y="418" font-family="Arial, sans-serif" font-size="14" fill="#475569">workarounds, re-sequencing</text>
    <text x="64" y="448" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Decides: task-level fixes</text>
    <text x="64" y="472" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Most issues end here</text>
  </g>
  <g>
    <rect x="420" y="326" width="360" height="170" rx="12" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="2"/>
    <text x="444" y="364" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#ffffff">Project Manager</text>
    <text x="444" y="394" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">Re-plans from any slip, owns</text>
    <text x="444" y="418" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">blockers end to end</text>
    <text x="444" y="448" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Decides: sequence and priority</text>
    <text x="444" y="472" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Sets the next update time</text>
  </g>
  <g>
    <rect x="800" y="326" width="360" height="170" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
    <text x="824" y="364" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">Sponsor and Owners</text>
    <text x="824" y="394" font-family="Arial, sans-serif" font-size="14" fill="#475569">Called only for decisions the</text>
    <text x="824" y="418" font-family="Arial, sans-serif" font-size="14" fill="#475569">weekend cannot absorb</text>
    <text x="824" y="448" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Decides: pause, rollback, scope</text>
    <text x="824" y="472" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Reached by the agreed path</text>
  </g>

  <!-- converge to update -->
  <path d="M 600 500 L 600 528" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>

  <rect x="40" y="532" width="1120" height="118" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="572" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">3 · The Scheduled Update</text>
  <text x="64" y="602" font-family="Arial, sans-serif" font-size="15" fill="#475569">Every decision returns here: an update at the stated time, to sponsors and business leaders,</text>
  <text x="64" y="626" font-family="Arial, sans-serif" font-size="15" fill="#475569">sent on schedule whether the news is good, difficult, or that nothing has changed.</text>
</svg>
