<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Georgia, 'DM Serif Display', serif"><defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B6CB0"/></marker></defs><rect width="1200" height="720" fill="#ffffff"/><rect x="0" y="0" width="1200" height="104" fill="url(#hdr)"/><text x="60" y="48" font-size="30" fill="#ffffff">The Phases of an HCM Implementation: Phase Map</text><text x="60" y="80" font-size="17" fill="#94A3B8" font-family="Arial, sans-serif">Eight phases in sequence — purpose and key deliverable for each, with a gate between phases</text><g filter="url(#sh)"><rect x="40" y="140" width="250" height="230" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="40" y="140" width="250" height="14" fill="#2B6CB0"/><text x="56" y="186" font-size="19" fill="#1A202C">1 — Initiation and</text><text x="56" y="210" font-size="19" fill="#1A202C">Mobilization</text><text x="56" y="240" font-size="13.5" fill="#475569" font-family="Arial, sans-serif">Purpose: set scope,</text><text x="56" y="259" font-size="13.5" fill="#475569" font-family="Arial, sans-serif">governance, and the team.</text><text x="56" y="292" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">Deliverable: charter,</text><text x="56" y="311" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">plan, and RAID log.</text><path d="M292 255 L318 255" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><rect x="293" y="243" width="24" height="24" transform="rotate(45 305 255)" fill="#ffffff" stroke="#2B6CB0" stroke-width="2.5"/><g filter="url(#sh)"><rect x="326" y="140" width="250" height="230" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="326" y="140" width="250" height="14" fill="#0f172a"/><text x="342" y="186" font-size="19" fill="#1A202C">2 — Discovery</text><text x="342" y="240" font-size="13.5" fill="#475569" font-family="Arial, sans-serif">Purpose: document how</text><text x="342" y="259" font-size="13.5" fill="#475569" font-family="Arial, sans-serif">work works today.</text><text x="342" y="292" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">Deliverable: current-state</text><text x="342" y="311" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">record and findings.</text><path d="M578 255 L604 255" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><rect x="579" y="243" width="24" height="24" transform="rotate(45 591 255)" fill="#ffffff" stroke="#2B6CB0" stroke-width="2.5"/><g filter="url(#sh)"><rect x="612" y="140" width="250" height="230" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="612" y="140" width="250" height="14" fill="#2B6CB0"/><text x="628" y="186" font-size="19" fill="#1A202C">3 — Design</text><text x="628" y="240" font-size="13.5" fill="#475569" font-family="Arial, sans-serif">Purpose: agree the future</text><text x="628" y="259" font-size="13.5" fill="#475569" font-family="Arial, sans-serif">state, process by process.</text><text x="628" y="292" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">Deliverable: signed design</text><text x="628" y="311" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">documents.</text><path d="M864 255 L890 255" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><rect x="865" y="243" width="24" height="24" transform="rotate(45 877 255)" fill="#ffffff" stroke="#2B6CB0" stroke-width="2.5"/><g filter="url(#sh)"><rect x="898" y="140" width="250" height="230" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="898" y="140" width="250" height="14" fill="#0f172a"/><text x="914" y="186" font-size="19" fill="#1A202C">4 — Build and</text><text x="914" y="210" font-size="19" fill="#1A202C">Configuration</text><text x="914" y="240" font-size="13.5" fill="#475569" font-family="Arial, sans-serif">Purpose: configure the</text><text x="914" y="259" font-size="13.5" fill="#475569" font-family="Arial, sans-serif">signed design in cycles.</text><text x="914" y="292" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">Deliverable: configured</text><text x="914" y="311" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">build, playback-approved.</text><path d="M1023 374 L1023 424" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><rect x="1011" y="387" width="24" height="24" transform="rotate(45 1023 399)" fill="#ffffff" stroke="#2B6CB0" stroke-width="2.5"/><g filter="url(#sh)"><rect x="40" y="428" width="250" height="230" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="40" y="428" width="250" height="14" fill="#2B6CB0"/><text x="56" y="474" font-size="19" fill="#1A202C">5 — Data Migration</text><text x="56" y="498" font-size="19" fill="#1A202C">and Integration</text><text x="56" y="528" font-size="13.5" fill="#475569" font-family="Arial, sans-serif">Purpose: move the people</text><text x="56" y="547" font-size="13.5" fill="#475569" font-family="Arial, sans-serif">record and connect systems.</text><text x="56" y="580" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">Deliverable: reconciled</text><text x="56" y="599" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">trial loads, live interfaces.</text><path d="M292 543 L318 543" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><rect x="293" y="531" width="24" height="24" transform="rotate(45 305 543)" fill="#ffffff" stroke="#2B6CB0" stroke-width="2.5"/><g filter="url(#sh)"><rect x="326" y="428" width="250" height="230" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="326" y="428" width="250" height="14" fill="#0f172a"/><text x="342" y="474" font-size="19" fill="#1A202C">6 — Testing and UAT</text><text x="342" y="528" font-size="13.5" fill="#475569" font-family="Arial, sans-serif">Purpose: prove the system</text><text x="342" y="547" font-size="13.5" fill="#475569" font-family="Arial, sans-serif">handles real work.</text><text x="342" y="580" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">Deliverable: test evidence</text><text x="342" y="599" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">and UAT sign-off.</text><path d="M578 543 L604 543" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><rect x="579" y="531" width="24" height="24" transform="rotate(45 591 543)" fill="#ffffff" stroke="#2B6CB0" stroke-width="2.5"/><g filter="url(#sh)"><rect x="612" y="428" width="250" height="230" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="612" y="428" width="250" height="14" fill="#2B6CB0"/><text x="628" y="474" font-size="19" fill="#1A202C">7 — Training and</text><text x="628" y="498" font-size="19" fill="#1A202C">Cutover</text><text x="628" y="528" font-size="13.5" fill="#475569" font-family="Arial, sans-serif">Purpose: prepare people,</text><text x="628" y="547" font-size="13.5" fill="#475569" font-family="Arial, sans-serif">then switch systems.</text><text x="628" y="580" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">Deliverable: trained users</text><text x="628" y="599" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">and go / no-go decision.</text><path d="M864 543 L890 543" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><rect x="865" y="531" width="24" height="24" transform="rotate(45 877 543)" fill="#ffffff" stroke="#2B6CB0" stroke-width="2.5"/><g filter="url(#sh)"><rect x="898" y="428" width="250" height="230" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="898" y="428" width="250" height="14" fill="#0f172a"/><text x="914" y="474" font-size="19" fill="#1A202C">8 — Hypercare and</text><text x="914" y="498" font-size="19" fill="#1A202C">Closure</text><text x="914" y="528" font-size="13.5" fill="#475569" font-family="Arial, sans-serif">Purpose: stabilise live</text><text x="914" y="547" font-size="13.5" fill="#475569" font-family="Arial, sans-serif">operation, then hand over.</text><text x="914" y="580" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">Deliverable: handover pack</text><text x="914" y="599" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">and closure sign-off.</text><rect x="52" y="688" width="16" height="16" transform="rotate(45 60 696)" fill="#ffffff" stroke="#2B6CB0" stroke-width="2.5"/><text x="82" y="701" font-size="15" fill="#64748B" font-family="Arial, sans-serif">= phase gate: entry and exit criteria are reviewed, and a decision is recorded, before the next phase builds on this one.</text></svg>
