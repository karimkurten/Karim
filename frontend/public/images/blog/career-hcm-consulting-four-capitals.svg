<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="The Four Capitals of an implementation career as pillars supporting a bridge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#2b6cb0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" rx="16"/>
  <text x="60" y="70" font-family="Verdana, Arial, sans-serif" font-size="32" font-weight="bold" fill="#f0f4f8">The Bridge Model — Four Capitals of an Implementation Career</text>
  <text x="60" y="104" font-family="Verdana, Arial, sans-serif" font-size="18" fill="#93c5fd">The career holds exactly as long as its weakest pillar.</text>
<rect x="60" y="150" width="1080" height="64" rx="10" fill="#2b6cb0"/><text x="195" y="190" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Analyst</text><text x="465" y="190" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Functional Consultant</text><text x="735" y="190" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Implementation PM</text><text x="1005" y="190" font-family="Verdana, Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Delivery Lead</text><rect x="60" y="214" width="1080" height="10" fill="#93c5fd" opacity="0.7"/><rect x="90" y="224" width="200" height="300" rx="8" fill="url(#bar)" opacity="0.6"/><text x="190" y="290" font-family="Verdana, Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">DOMAIN</text><text x="190" y="336" font-family="Verdana, Arial, sans-serif" font-size="14.5" fill="#e2e8f0" text-anchor="middle">You understand the</text><text x="190" y="358" font-family="Verdana, Arial, sans-serif" font-size="14.5" fill="#e2e8f0" text-anchor="middle">work being automated</text><line x1="115" y1="392" x2="265" y2="392" stroke="#93c5fd" stroke-width="1.5" opacity="0.6"/><text x="190" y="428" font-family="Verdana, Arial, sans-serif" font-size="13.5" fill="#bfdbfe" text-anchor="middle">Test: spot what breaks</text><text x="190" y="450" font-family="Verdana, Arial, sans-serif" font-size="13.5" fill="#bfdbfe" text-anchor="middle">at year-end — and why</text><rect x="365" y="224" width="200" height="300" rx="8" fill="url(#bar)" opacity="0.72"/><text x="465" y="290" font-family="Verdana, Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">DELIVERY</text><text x="465" y="336" font-family="Verdana, Arial, sans-serif" font-size="14.5" fill="#e2e8f0" text-anchor="middle">You can run change</text><text x="465" y="358" font-family="Verdana, Arial, sans-serif" font-size="14.5" fill="#e2e8f0" text-anchor="middle">as a project</text><line x1="390" y1="392" x2="540" y2="392" stroke="#93c5fd" stroke-width="1.5" opacity="0.6"/><text x="465" y="428" font-family="Verdana, Arial, sans-serif" font-size="13.5" fill="#bfdbfe" text-anchor="middle">Test: plans get precise</text><text x="465" y="450" font-family="Verdana, Arial, sans-serif" font-size="13.5" fill="#bfdbfe" text-anchor="middle">when trouble arrives</text><rect x="640" y="224" width="200" height="300" rx="8" fill="url(#bar)" opacity="0.84"/><text x="740" y="290" font-family="Verdana, Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">PLATFORM</text><text x="740" y="336" font-family="Verdana, Arial, sans-serif" font-size="14.5" fill="#e2e8f0" text-anchor="middle">You understand how</text><text x="740" y="358" font-family="Verdana, Arial, sans-serif" font-size="14.5" fill="#e2e8f0" text-anchor="middle">the technology behaves</text><line x1="665" y1="392" x2="815" y2="392" stroke="#93c5fd" stroke-width="1.5" opacity="0.6"/><text x="740" y="428" font-family="Verdana, Arial, sans-serif" font-size="13.5" fill="#bfdbfe" text-anchor="middle">Test: explain the why,</text><text x="740" y="450" font-family="Verdana, Arial, sans-serif" font-size="13.5" fill="#bfdbfe" text-anchor="middle">not just the clicks</text><rect x="915" y="224" width="200" height="300" rx="8" fill="url(#bar)" opacity="0.96"/><text x="1015" y="290" font-family="Verdana, Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">TRUST</text><text x="1015" y="336" font-family="Verdana, Arial, sans-serif" font-size="14.5" fill="#e2e8f0" text-anchor="middle">Stakeholders tell you</text><text x="1015" y="358" font-family="Verdana, Arial, sans-serif" font-size="14.5" fill="#e2e8f0" text-anchor="middle">the truth early</text><line x1="940" y1="392" x2="1090" y2="392" stroke="#93c5fd" stroke-width="1.5" opacity="0.6"/><text x="1015" y="428" font-family="Verdana, Arial, sans-serif" font-size="13.5" fill="#bfdbfe" text-anchor="middle">Test: problems reach you</text><text x="1015" y="450" font-family="Verdana, Arial, sans-serif" font-size="13.5" fill="#bfdbfe" text-anchor="middle">while still cheap to fix</text><rect x="60" y="524" width="1080" height="12" rx="6" fill="#0f172a" stroke="#2b6cb0"/><text x="60" y="586" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#93c5fd">Audit each capital twice a year, from evidence — artifacts, outcomes, feedback — and build the lowest one next.</text><text x="60" y="616" font-family="Verdana, Arial, sans-serif" font-size="15" fill="#93c5fd">Trust is the multiplier: it does not add to the other three, it multiplies them.</text></svg>