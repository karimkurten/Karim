<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Georgia, 'DM Serif Display', serif"><defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B6CB0"/></marker></defs><rect width="1200" height="640" fill="#ffffff"/><rect x="0" y="0" width="1200" height="104" fill="url(#hdr)"/><text x="60" y="48" font-size="30" fill="#ffffff">A Week in the Life: Mid-Programme</text><text x="60" y="80" font-size="17" fill="#94A3B8" font-family="Arial, sans-serif">What the project team, the client team, and employees experience in the same week</text><text x="284" y="152" font-size="18" fill="#1A202C" text-anchor="middle">Monday</text><text x="482" y="152" font-size="18" fill="#1A202C" text-anchor="middle">Tuesday</text><text x="680" y="152" font-size="18" fill="#1A202C" text-anchor="middle">Wednesday</text><text x="878" y="152" font-size="18" fill="#1A202C" text-anchor="middle">Thursday</text><text x="1076" y="152" font-size="18" fill="#1A202C" text-anchor="middle">Friday</text><g filter="url(#sh)"><rect x="40" y="176" width="136" height="128" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="40" y="176" width="14" height="128" fill="#2B6CB0"/><text x="66" y="234" font-size="18" fill="#1A202C">Project Team</text><rect x="190" y="176" width="188" height="128" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="202" y="206" font-size="13" fill="#475569" font-family="Arial, sans-serif">Playback prep: configure</text><text x="202" y="224" font-size="13" fill="#475569" font-family="Arial, sans-serif">the absence workflow</text><rect x="388" y="176" width="188" height="128" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="400" y="206" font-size="13" fill="#475569" font-family="Arial, sans-serif">Integration build with</text><text x="400" y="224" font-size="13" fill="#475569" font-family="Arial, sans-serif">the time system</text><rect x="586" y="176" width="188" height="128" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="598" y="206" font-size="13" fill="#475569" font-family="Arial, sans-serif">Defect fixes and</text><text x="598" y="224" font-size="13" fill="#475569" font-family="Arial, sans-serif">regression re-runs</text><rect x="784" y="176" width="188" height="128" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="796" y="206" font-size="13" fill="#475569" font-family="Arial, sans-serif">Cutover plan drafting</text><text x="796" y="224" font-size="13" fill="#475569" font-family="Arial, sans-serif">with owners</text><rect x="982" y="176" width="188" height="128" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="994" y="206" font-size="13" fill="#475569" font-family="Arial, sans-serif">Weekly status, risks,</text><text x="994" y="224" font-size="13" fill="#475569" font-family="Arial, sans-serif">and decisions</text><g filter="url(#sh)"><rect x="40" y="320" width="136" height="128" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="40" y="320" width="14" height="128" fill="#0f172a"/><text x="66" y="378" font-size="18" fill="#1A202C">Client Team</text><rect x="190" y="320" width="188" height="128" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="202" y="350" font-size="13" fill="#475569" font-family="Arial, sans-serif">Design questions</text><text x="202" y="368" font-size="13" fill="#475569" font-family="Arial, sans-serif">answered with payroll</text><rect x="388" y="320" width="188" height="128" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="400" y="350" font-size="13" fill="#475569" font-family="Arial, sans-serif">Data cleansing:</text><text x="400" y="368" font-size="13" fill="#475569" font-family="Arial, sans-serif">adjudicate flagged</text><text x="400" y="386" font-size="13" fill="#475569" font-family="Arial, sans-serif">records</text><rect x="586" y="320" width="188" height="128" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="598" y="350" font-size="13" fill="#475569" font-family="Arial, sans-serif">UAT day: hire, transfer,</text><text x="598" y="368" font-size="13" fill="#475569" font-family="Arial, sans-serif">retro scenarios</text><rect x="784" y="320" width="188" height="128" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="796" y="350" font-size="13" fill="#475569" font-family="Arial, sans-serif">Manager briefing on</text><text x="796" y="368" font-size="13" fill="#475569" font-family="Arial, sans-serif">approvals</text><rect x="982" y="320" width="188" height="128" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="994" y="350" font-size="13" fill="#475569" font-family="Arial, sans-serif">Sign-off review for the</text><text x="994" y="368" font-size="13" fill="#475569" font-family="Arial, sans-serif">test cycle</text><g filter="url(#sh)"><rect x="40" y="464" width="136" height="128" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="40" y="464" width="14" height="128" fill="#1e3a5f"/><text x="66" y="522" font-size="18" fill="#1A202C">Employees</text><rect x="190" y="464" width="188" height="128" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="202" y="494" font-size="13" fill="#475569" font-family="Arial, sans-serif">No change yet — business</text><text x="202" y="512" font-size="13" fill="#475569" font-family="Arial, sans-serif">as usual</text><rect x="388" y="464" width="188" height="128" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="400" y="494" font-size="13" fill="#475569" font-family="Arial, sans-serif">Change note: what is</text><text x="400" y="512" font-size="13" fill="#475569" font-family="Arial, sans-serif">coming and when</text><rect x="586" y="464" width="188" height="128" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="598" y="494" font-size="13" fill="#475569" font-family="Arial, sans-serif">Super-users named in</text><text x="598" y="512" font-size="13" fill="#475569" font-family="Arial, sans-serif">each team</text><rect x="784" y="464" width="188" height="128" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="796" y="494" font-size="13" fill="#475569" font-family="Arial, sans-serif">Training preview and</text><text x="796" y="512" font-size="13" fill="#475569" font-family="Arial, sans-serif">practice access</text><rect x="982" y="464" width="188" height="128" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="994" y="494" font-size="13" fill="#475569" font-family="Arial, sans-serif">Questions channel opens</text><text x="994" y="512" font-size="13" fill="#475569" font-family="Arial, sans-serif">for day one</text><text x="600" y="612" font-size="16" fill="#64748B" font-family="Arial, sans-serif" text-anchor="middle">The client team carries the programme alongside the day job — its peaks are predictable, so plan backfill for them.</text></svg>