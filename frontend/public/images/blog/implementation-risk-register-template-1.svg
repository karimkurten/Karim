<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="1240" height="560" rx="16" fill="#F4F6F8"/>
  <text x="30" y="48" font-size="26" font-weight="700" fill="#16294A">Risk Register Template — Column Guide</text>
  <text x="30" y="76" font-size="15" fill="#5A6C7D">One row per risk. Fill every column honestly — the register only works if it is reviewed.</text>

  <!-- Table header -->
  <rect x="30" y="96" width="1180" height="58" rx="10" fill="#1E3A5F"/>
  <g font-size="15" font-weight="700" fill="#FFFFFF">
    <circle cx="58" cy="125" r="13" fill="#E8A33D"/><text x="58" y="130" text-anchor="middle" font-size="14" fill="#16294A">1</text>
    <text x="78" y="130">Risk statement</text>
    <circle cx="458" cy="125" r="13" fill="#E8A33D"/><text x="458" y="130" text-anchor="middle" font-size="14" fill="#16294A">2</text>
    <text x="478" y="130">Probability</text>
    <circle cx="578" cy="125" r="13" fill="#E8A33D"/><text x="578" y="130" text-anchor="middle" font-size="14" fill="#16294A">3</text>
    <text x="598" y="130">Impact</text>
    <circle cx="698" cy="125" r="13" fill="#E8A33D"/><text x="698" y="130" text-anchor="middle" font-size="14" fill="#16294A">4</text>
    <text x="718" y="130">Owner</text>
    <circle cx="868" cy="125" r="13" fill="#E8A33D"/><text x="868" y="130" text-anchor="middle" font-size="14" fill="#16294A">5</text>
    <text x="888" y="130">Mitigation</text>
    <circle cx="1103" cy="125" r="13" fill="#E8A33D"/><text x="1103" y="130" text-anchor="middle" font-size="14" fill="#16294A">6</text>
    <text x="1123" y="130">Status</text>
  </g>

  <!-- Row 1 -->
  <rect x="30" y="168" width="1180" height="104" rx="10" fill="#FFFFFF"/>
  <rect x="42" y="180" width="66" height="28" rx="14" fill="#E8A33D"/>
  <text x="75" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#16294A">R-001</text>
  <text x="122" y="199" font-size="14" fill="#16294A">If scope expands after design sign-off,</text>
  <text x="122" y="221" font-size="14" fill="#16294A">then go-live slips 4–6 weeks.</text>
  <rect x="440" y="186" width="100" height="32" rx="16" fill="#D64541"/>
  <text x="490" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">High</text>
  <rect x="560" y="186" width="100" height="32" rx="16" fill="#D64541"/>
  <text x="610" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">High</text>
  <text x="692" y="207" font-size="14" fill="#16294A">Project Manager</text>
  <text x="856" y="199" font-size="13" fill="#16294A">Avoid — freeze scope at sign-off</text>
  <text x="856" y="219" font-size="13" fill="#16294A">changes via change control.</text>
  <rect x="1092" y="186" width="100" height="32" rx="16" fill="#E8EDF2"/>
  <text x="1142" y="207" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Open</text>

  <!-- Row 2 -->
  <rect x="30" y="284" width="1180" height="104" rx="10" fill="#FFFFFF"/>
  <rect x="42" y="296" width="66" height="28" rx="14" fill="#E8A33D"/>
  <text x="75" y="315" text-anchor="middle" font-size="14" font-weight="700" fill="#16294A">R-005</text>
  <text x="122" y="315" font-size="14" fill="#16294A">If managers miss approval training,</text>
  <text x="122" y="337" font-size="14" fill="#16294A">then requests bottleneck after go-live.</text>
  <rect x="440" y="302" width="100" height="32" rx="16" fill="#E8A33D"/>
  <text x="490" y="323" text-anchor="middle" font-size="14" font-weight="700" fill="#16294A">Medium</text>
  <rect x="560" y="302" width="100" height="32" rx="16" fill="#E8A33D"/>
  <text x="610" y="323" text-anchor="middle" font-size="14" font-weight="700" fill="#16294A">Medium</text>
  <text x="692" y="323" font-size="14" fill="#16294A">Change Lead</text>
  <text x="856" y="315" font-size="13" fill="#16294A">Mitigate — training tracked</text>
  <text x="856" y="335" font-size="13" fill="#16294A">as a go-live gate.</text>
  <rect x="1092" y="302" width="100" height="32" rx="16" fill="#E8EDF2"/>
  <text x="1142" y="323" text-anchor="middle" font-size="14" font-weight="600" fill="#1E3A5F">Open</text>

  <!-- Annotation legend -->
  <g font-size="14" fill="#34495E">
    <text x="40" y="430"><tspan font-weight="700" fill="#C47A1A">1 </tspan>Risk statement — written as "If X, then Y": condition plus consequence.</text>
    <text x="40" y="458"><tspan font-weight="700" fill="#C47A1A">2 </tspan>Probability — High / Medium / Low.</text>
    <text x="40" y="486"><tspan font-weight="700" fill="#C47A1A">3 </tspan>Impact — High / Medium / Low.</text>
    <text x="40" y="514"><tspan font-weight="700" fill="#C47A1A">4 </tspan>Owner — a named person, never "the team".</text>
    <text x="660" y="430"><tspan font-weight="700" fill="#C47A1A">5 </tspan>Mitigation — Avoid / Mitigate / Transfer / Accept + specific actions.</text>
    <text x="660" y="458"><tspan font-weight="700" fill="#C47A1A">6 </tspan>Status — Open / Mitigated / Occurred / Closed.</text>
  </g>
</svg>
