<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="The compensation cycle journey: structures set, cycle planned, recommendations made, approvals and calibration, then payroll and letters, with the lead owner named at each stage">
  <defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient></defs>
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="88" fill="url(#hdr)"/>
  <text x="48" y="40" font-family="Georgia, serif" font-size="29" fill="#ffffff">Compensation Cycle: From Structures to Payroll and Letters</text>
  <text x="48" y="70" font-family="Arial, sans-serif" font-size="20" fill="#94A3B8">Five stages — each with a purpose and lead owners</text>
  <g><rect x="40" y="108" width="208" height="252" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/><text x="56" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Structures</text><text x="56" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Set</text><text x="56" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Grades, bands, and</text><text x="56" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">ranges agreed, with</text><text x="56" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">the job catalogue</text><text x="56" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">reconciled in Core HR.</text><text x="56" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: Total Rewards</text></g>
  <g><rect x="268" y="108" width="208" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="284" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Cycle</text><text x="284" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Planned</text><text x="284" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Cycle type, timeline,</text><text x="284" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">and eligibility set;</text><text x="284" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">budget pool allocated</text><text x="284" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">before opening.</text><text x="284" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: HR, Rewards</text></g>
  <g><rect x="496" y="108" width="208" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="512" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Recommendations</text><text x="512" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Made</text><text x="512" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Managers propose</text><text x="512" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">changes against</text><text x="512" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">ranges, performance,</text><text x="512" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">and remaining budget.</text><text x="512" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: Manager</text></g>
  <g><rect x="724" y="108" width="208" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="740" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Approvals and</text><text x="740" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Calibration</text><text x="740" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Leaders calibrate</text><text x="740" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">across teams; then</text><text x="740" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">approvals in sequence</text><text x="740" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">with reasons recorded.</text><text x="740" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: Leaders, HR</text></g>
  <g><rect x="952" y="108" width="208" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="968" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Payroll and</text><text x="968" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Letters</text><text x="968" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Approved changes</text><text x="968" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">reconciled into</text><text x="968" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">payroll; letters from</text><text x="968" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">the approved record.</text><text x="968" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: Payroll, HR</text></g>
  <rect x="40" y="392" width="1120" height="72" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="424" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Every stage depends on accurate Core HR job and grade data</text>
  <text x="64" y="450" font-family="Arial, sans-serif" font-size="16" fill="#475569">A recommendation made against the wrong job or grade is a pay defect, not a rounding issue.</text>
  <rect x="40" y="488" width="1120" height="72" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="520" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">The approved record is the only source — no parallel spreadsheets</text>
  <text x="64" y="546" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Payroll amounts, employee letters, and reports all trace to the same approved decisions.</text>
  <text x="40" y="600" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Figure 1 — Compensation cycle journey</text>
</svg>
