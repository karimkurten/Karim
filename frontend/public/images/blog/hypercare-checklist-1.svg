<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="Hypercare checklist rhythm: four layers covering daily checks, weekly review, per-cycle checks, and exit-readiness checks, each with short check items">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="780" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="92" fill="url(#hdr)"/>
  <text x="48" y="46" font-family="Georgia, serif" font-size="30" fill="#ffffff">Hypercare Checklist: Four Rhythms</text>
  <text x="48" y="74" font-family="Arial, sans-serif" font-size="16" fill="#94A3B8">What to check depends on when — each layer has its own owner and question</text>

  <g>
    <rect x="40" y="124" width="1120" height="108" rx="12" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="2"/>
    <text x="64" y="160" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Daily · Is today under control?</text>
    <text x="64" y="188" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">Triage by severity, confirm cover and routes,</text>
    <text x="64" y="212" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">advance every workaround, write the day down</text>
    <text x="830" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Owner:</text>
    <text x="830" y="188" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Hypercare lead</text>
    <text x="830" y="212" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Never skipped</text>
  </g>
  <g>
    <rect x="40" y="246" width="1120" height="108" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="64" y="282" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Weekly · Is the pattern improving?</text>
    <text x="64" y="310" font-family="Arial, sans-serif" font-size="14" fill="#475569">Recurring categories, adoption and shadow work,</text>
    <text x="64" y="334" font-family="Arial, sans-serif" font-size="14" fill="#475569">support observed live, log tested against experience</text>
    <text x="830" y="282" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A202C">Owner:</text>
    <text x="830" y="310" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Hypercare lead with</text>
    <text x="830" y="334" font-family="Arial, sans-serif" font-size="14" fill="#64748B">process owners</text>
  </g>
  <g>
    <rect x="40" y="368" width="1120" height="108" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="64" y="404" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Per-Cycle · Did real business run clean?</text>
    <text x="64" y="432" font-family="Arial, sans-serif" font-size="14" fill="#475569">Before: inputs ready. During: business leads.</text>
    <text x="64" y="456" font-family="Arial, sans-serif" font-size="14" fill="#475569">After: short review, lessons carried forward</text>
    <text x="830" y="404" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A202C">Owner:</text>
    <text x="830" y="432" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Business process owners,</text>
    <text x="830" y="456" font-family="Arial, sans-serif" font-size="14" fill="#64748B">per country</text>
  </g>
  <g>
    <rect x="40" y="490" width="1120" height="108" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
    <text x="64" y="526" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Exit-Readiness · Is the record complete?</text>
    <text x="64" y="554" font-family="Arial, sans-serif" font-size="14" fill="#475569">Backlog owned item by item, cycle file signed,</text>
    <text x="64" y="578" font-family="Arial, sans-serif" font-size="14" fill="#475569">support file proven, step-down plan agreed</text>
    <text x="830" y="526" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A202C">Owner:</text>
    <text x="830" y="554" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Exit gate: business,</text>
    <text x="830" y="578" font-family="Arial, sans-serif" font-size="14" fill="#64748B">support, sponsor</text>
  </g>
  <g>
    <rect x="40" y="612" width="1120" height="108" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="64" y="648" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">The Rule Under Every Layer</text>
    <text x="64" y="676" font-family="Arial, sans-serif" font-size="14" fill="#475569">Every check leaves a record. A clean result is</text>
    <text x="64" y="700" font-family="Arial, sans-serif" font-size="14" fill="#475569">evidence; a failed check gets an owner and a date</text>
    <text x="830" y="648" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A202C">Evidence:</text>
    <text x="830" y="676" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Hypercare log, built</text>
    <text x="830" y="700" font-family="Arial, sans-serif" font-size="14" fill="#64748B">day by day</text>
  </g>
  <text x="48" y="752" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Run the rhythm without exception — the exit gate will read the record it creates.</text>
</svg>
