<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Georgia, 'DM Serif Display', serif"><defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B6CB0"/></marker></defs><rect width="1200" height="700" fill="#ffffff"/><rect x="0" y="0" width="1200" height="104" fill="url(#hdr)"/><text x="60" y="48" font-size="30" fill="#ffffff">What Happens During an HCM Implementation: The Journey</text><text x="60" y="80" font-size="17" fill="#94A3B8" font-family="Arial, sans-serif">Eight phases — what happens in each, and who is most involved</text><g filter="url(#sh)"><rect x="40" y="140" width="258" height="218" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="40" y="140" width="258" height="14" fill="#2B6CB0"/><text x="58" y="188" font-size="20" fill="#1A202C">1 — Discovery</text><text x="58" y="218" font-size="14" fill="#475569" font-family="Arial, sans-serif">Map how work works today:</text><text x="58" y="238" font-size="14" fill="#475569" font-family="Arial, sans-serif">processes, policies,</text><text x="58" y="258" font-size="14" fill="#475569" font-family="Arial, sans-serif">exceptions.</text><text x="58" y="286" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">Who: Client experts + consultants</text><path d="M302 249 L322 249" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><g filter="url(#sh)"><rect x="326" y="140" width="258" height="218" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="326" y="140" width="258" height="14" fill="#0f172a"/><text x="344" y="188" font-size="20" fill="#1A202C">2 — Design</text><text x="344" y="218" font-size="14" fill="#475569" font-family="Arial, sans-serif">Decide the future state and</text><text x="344" y="238" font-size="14" fill="#475569" font-family="Arial, sans-serif">sign it off, process by</text><text x="344" y="258" font-size="14" fill="#475569" font-family="Arial, sans-serif">process.</text><text x="344" y="286" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">Who: Sponsor, client PM, consultants</text><path d="M588 249 L608 249" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><g filter="url(#sh)"><rect x="612" y="140" width="258" height="218" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="612" y="140" width="258" height="14" fill="#2B6CB0"/><text x="630" y="188" font-size="20" fill="#1A202C">3 — Build</text><text x="630" y="218" font-size="14" fill="#475569" font-family="Arial, sans-serif">Configure rules, workflows,</text><text x="630" y="238" font-size="14" fill="#475569" font-family="Arial, sans-serif">and integrations in cycles.</text><text x="630" y="266" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">Who: Consultants + client reviewers</text><path d="M874 249 L894 249" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><g filter="url(#sh)"><rect x="898" y="140" width="258" height="218" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="898" y="140" width="258" height="14" fill="#0f172a"/><text x="916" y="188" font-size="20" fill="#1A202C">4 — Data Migration</text><text x="916" y="218" font-size="14" fill="#475569" font-family="Arial, sans-serif">Extract, cleanse, map, load,</text><text x="916" y="238" font-size="14" fill="#475569" font-family="Arial, sans-serif">and reconcile the people</text><text x="916" y="258" font-size="14" fill="#475569" font-family="Arial, sans-serif">record.</text><text x="916" y="286" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">Who: Data specialist + client experts</text><path d="M1027 362 L1027 418" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><g filter="url(#sh)"><rect x="40" y="422" width="258" height="218" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="40" y="422" width="258" height="14" fill="#2B6CB0"/><text x="58" y="470" font-size="20" fill="#1A202C">5 — Testing and UAT</text><text x="58" y="500" font-size="14" fill="#475569" font-family="Arial, sans-serif">Prove the build, then let</text><text x="58" y="520" font-size="14" fill="#475569" font-family="Arial, sans-serif">business users test real</text><text x="58" y="540" font-size="14" fill="#475569" font-family="Arial, sans-serif">scenarios.</text><text x="58" y="568" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">Who: Testers, payroll, HR users</text><path d="M302 531 L322 531" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><g filter="url(#sh)"><rect x="326" y="422" width="258" height="218" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="326" y="422" width="258" height="14" fill="#0f172a"/><text x="344" y="470" font-size="20" fill="#1A202C">6 — Training and</text><text x="344" y="496" font-size="20" fill="#1A202C">Change</text><text x="344" y="526" font-size="14" fill="#475569" font-family="Arial, sans-serif">Prepare managers and employees</text><text x="344" y="546" font-size="14" fill="#475569" font-family="Arial, sans-serif">for what changes, and when.</text><text x="344" y="574" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">Who: Change lead + managers</text><path d="M588 531 L608 531" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><g filter="url(#sh)"><rect x="612" y="422" width="258" height="218" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="612" y="422" width="258" height="14" fill="#2B6CB0"/><text x="630" y="470" font-size="20" fill="#1A202C">7 — Cutover and</text><text x="630" y="496" font-size="20" fill="#1A202C">Go-Live</text><text x="630" y="526" font-size="14" fill="#475569" font-family="Arial, sans-serif">Freeze, final loads, go /</text><text x="630" y="546" font-size="14" fill="#475569" font-family="Arial, sans-serif">no-go, and the switch at a pay</text><text x="630" y="566" font-size="14" fill="#475569" font-family="Arial, sans-serif">boundary.</text><text x="630" y="594" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">Who: Both teams, sponsor decides</text><path d="M874 531 L894 531" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><g filter="url(#sh)"><rect x="898" y="422" width="258" height="218" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="898" y="422" width="258" height="14" fill="#0f172a"/><text x="916" y="470" font-size="20" fill="#1A202C">8 — Hypercare</text><text x="916" y="500" font-size="14" fill="#475569" font-family="Arial, sans-serif">Intensive support through the</text><text x="916" y="520" font-size="14" fill="#475569" font-family="Arial, sans-serif">first pay cycles, then</text><text x="916" y="540" font-size="14" fill="#475569" font-family="Arial, sans-serif">handover.</text><text x="916" y="568" font-size="13" fill="#2B6CB0" font-family="Arial, sans-serif">Who: Support team + consultants</text><text x="600" y="668" font-size="16" fill="#64748B" font-family="Arial, sans-serif" text-anchor="middle">Each phase ends at a gate: sign-off on evidence before the next phase builds on it.</text></svg>