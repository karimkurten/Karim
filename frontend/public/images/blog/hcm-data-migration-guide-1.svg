<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Flow diagram of the five-step HCM data migration sequence: extract, cleanse, transform, load, reconcile">
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L10,6 L0,12 z" fill="#E8A33D"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="420" fill="#F4F6F8"/>
  <text x="600" y="56" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#1E3A5F">The five-step migration sequence</text>

  <!-- Step 1 -->
  <g>
    <rect x="30" y="110" width="180" height="210" rx="16" fill="#FFFFFF" stroke="#DCE3EA" stroke-width="2"/>
    <circle cx="120" cy="152" r="22" fill="#1E3A5F"/>
    <text x="120" y="160" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#E8A33D">1</text>
    <text x="120" y="208" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#1E3A5F">Extract</text>
    <rect x="85" y="220" width="70" height="4" rx="2" fill="#E8A33D"/>
    <text x="120" y="248" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#5A6B7D">Pull legacy data</text>
    <text x="120" y="272" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#5A6B7D">into a staging area</text>
  </g>

  <!-- Step 2 -->
  <g>
    <rect x="270" y="110" width="180" height="210" rx="16" fill="#FFFFFF" stroke="#DCE3EA" stroke-width="2"/>
    <circle cx="360" cy="152" r="22" fill="#1E3A5F"/>
    <text x="360" y="160" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#E8A33D">2</text>
    <text x="360" y="208" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#1E3A5F">Cleanse</text>
    <rect x="325" y="220" width="70" height="4" rx="2" fill="#E8A33D"/>
    <text x="360" y="248" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#5A6B7D">Fix defects before</text>
    <text x="360" y="272" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#5A6B7D">they reach the new system</text>
  </g>

  <!-- Step 3 -->
  <g>
    <rect x="510" y="110" width="180" height="210" rx="16" fill="#FFFFFF" stroke="#DCE3EA" stroke-width="2"/>
    <circle cx="600" cy="152" r="22" fill="#1E3A5F"/>
    <text x="600" y="160" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#E8A33D">3</text>
    <text x="600" y="208" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#1E3A5F">Transform</text>
    <rect x="565" y="220" width="70" height="4" rx="2" fill="#E8A33D"/>
    <text x="600" y="248" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#5A6B7D">Map legacy fields</text>
    <text x="600" y="272" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#5A6B7D">to the new data model</text>
  </g>

  <!-- Step 4 -->
  <g>
    <rect x="750" y="110" width="180" height="210" rx="16" fill="#FFFFFF" stroke="#DCE3EA" stroke-width="2"/>
    <circle cx="840" cy="152" r="22" fill="#1E3A5F"/>
    <text x="840" y="160" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#E8A33D">4</text>
    <text x="840" y="208" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#1E3A5F">Load</text>
    <rect x="805" y="220" width="70" height="4" rx="2" fill="#E8A33D"/>
    <text x="840" y="248" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#5A6B7D">Import into</text>
    <text x="840" y="272" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#5A6B7D">the target system</text>
  </g>

  <!-- Step 5 -->
  <g>
    <rect x="990" y="110" width="180" height="210" rx="16" fill="#FFFFFF" stroke="#DCE3EA" stroke-width="2"/>
    <circle cx="1080" cy="152" r="22" fill="#1E3A5F"/>
    <text x="1080" y="160" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#E8A33D">5</text>
    <text x="1080" y="208" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#1E3A5F">Reconcile</text>
    <rect x="1045" y="220" width="70" height="4" rx="2" fill="#E8A33D"/>
    <text x="1080" y="248" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#5A6B7D">Verify every load</text>
    <text x="1080" y="272" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#5A6B7D">is correct</text>
  </g>

  <!-- Arrows -->
  <line x1="222" y1="215" x2="258" y2="215" stroke="#E8A33D" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="462" y1="215" x2="498" y2="215" stroke="#E8A33D" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="702" y1="215" x2="738" y2="215" stroke="#E8A33D" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="942" y1="215" x2="978" y2="215" stroke="#E8A33D" stroke-width="3" marker-end="url(#arr)"/>

  <text x="600" y="380" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-style="italic" fill="#5A6B7D">In that order, every time — skipping a step moves the pain downstream.</text>
</svg>
