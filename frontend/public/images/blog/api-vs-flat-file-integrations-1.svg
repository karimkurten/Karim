<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1040" viewBox="0 0 900 1040" role="img" aria-label="Decision-flow diagram for choosing the integration pattern per endpoint: latency, counterparty capability, volume, and idempotency leading to API, flat-file, or hybrid outcomes">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <filter id="soft" x="-8%" y="-20%" width="116%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2B6CB0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="1040" fill="#FFFFFF"/>
  <text x="450" y="36" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="24" font-weight="700" fill="#1A202C">Choosing the integration pattern — per endpoint</text>

  <!-- start node -->
  <g filter="url(#soft)">
    <rect x="250" y="59" width="400" height="58" rx="14" fill="url(#heroGrad)"/>
    <text x="450" y="95" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">New interface: how should data move?</text>
  </g>

  <!-- connectors -->
  <g stroke="#2B6CB0" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M 450,117 V 150"/>
    <path d="M 630,215 H 695 V 370"/>
    <path d="M 270,215 H 205 V 370"/>
    <path d="M 695,490 V 795 H 560 V 850"/>
    <path d="M 850,430 H 878 V 920 H 860"/>
    <path d="M 205,490 V 615"/>
    <path d="M 50,430 H 20 V 920 H 30"/>
    <path d="M 180,716 V 788 H 450 V 850"/>
    <path d="M 230,716 V 810 H 155 V 850"/>
  </g>

  <!-- decision diamonds -->
  <g filter="url(#soft)">
    <polygon points="450,150 630,215 450,280 270,215" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <polygon points="695,370 850,430 695,490 540,430" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <polygon points="205,370 360,430 205,490 50,430" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <polygon points="205,615 360,670 205,725 50,670" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" fill="#1A202C">
    <text x="450" y="208" font-size="15" font-weight="600">Does the business need the data</text>
    <text x="450" y="232" font-size="15" font-weight="600">within minutes or hours?</text>
    <text x="695" y="423" font-size="14" font-weight="600">Can the counterparty</text>
    <text x="695" y="447" font-size="14" font-weight="600">consume an API?</text>
    <text x="205" y="415" font-size="14" font-weight="600">Is the data high-volume</text>
    <text x="205" y="439" font-size="14" font-weight="600">and periodic</text>
    <text x="205" y="463" font-size="14" font-weight="600">(bulk, reconcilable)?</text>
    <text x="205" y="663" font-size="14" font-weight="600">Does a failure need</text>
    <text x="205" y="687" font-size="14" font-weight="600">same-day action?</text>
  </g>

  <!-- branch chips -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">
    <rect x="639" y="204" width="46" height="22" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/><text x="662" y="219" text-anchor="middle">Yes</text>
    <rect x="214" y="204" width="46" height="22" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/><text x="237" y="219" text-anchor="middle">No</text>
    <rect x="649" y="500" width="46" height="22" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/><text x="672" y="515" text-anchor="middle">Yes</text>
    <rect x="832" y="437" width="46" height="22" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/><text x="855" y="452" text-anchor="middle">No</text>
    <rect x="214" y="540" width="46" height="22" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/><text x="237" y="555" text-anchor="middle">No</text>
    <rect x="29" y="560" width="46" height="22" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/><text x="52" y="575" text-anchor="middle">Yes</text>
    <rect x="111" y="737" width="46" height="22" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/><text x="134" y="752" text-anchor="middle">Yes</text>
    <rect x="239" y="749" width="46" height="22" rx="11" fill="#FFFFFF" stroke="#E2E8F0"/><text x="262" y="764" text-anchor="middle">No</text>
  </g>
  <text x="305" y="779" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-style="italic" fill="#475569">push for API capability — or compensate with faster file cadence</text>

  <!-- outcome panels -->
  <g filter="url(#soft)">
    <rect x="325" y="850" width="250" height="140" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="30" y="850" width="250" height="140" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="610" y="850" width="250" height="140" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  </g>
  <g text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    <text x="450" y="884" font-size="16" font-weight="700" fill="#2B6CB0">API (real-time)</text>
    <text x="450" y="912" font-size="13" fill="#475569">Specify idempotency,</text>
    <text x="450" y="934" font-size="13" fill="#475569">ordering, retry policy</text>
    <text x="155" y="884" font-size="16" font-weight="700" fill="#64748B">Flat file (batch)</text>
    <text x="155" y="912" font-size="13" fill="#475569">Specify schedule,</text>
    <text x="155" y="934" font-size="13" fill="#475569">owner, control totals</text>
    <text x="735" y="884" font-size="16" font-weight="700" fill="#2B6CB0">Hybrid (deliberate)</text>
    <text x="735" y="906" font-size="13" fill="#475569">API event + nightly reconciliation,</text>
    <text x="735" y="928" font-size="13" fill="#475569">or file + faster exception channel;</text>
    <text x="735" y="950" font-size="13" fill="#475569">document which channel wins</text>
  </g>

  <text x="450" y="1015" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-style="italic" fill="#475569">Latency first, counterparty capability as the veto, volume as the crossover, idempotency as the safety condition.</text>
</svg>
