<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="Go-live cutover timeline: mock go-live, data freeze, final migration, cutover weekend, go-live, hypercare">
  <defs>
    <style>text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}</style>
  </defs>
  <rect x="0" y="0" width="960" height="470" rx="16" fill="#F4F6F8"/>
  <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#16294A">Go-Live Cutover Timeline</text>
  <text x="480" y="70" text-anchor="middle" font-size="15" fill="#5A6B7C">From dress rehearsal to hypercare — every gate in sequence</text>

  <!-- Phase labels -->
  <text x="158" y="118" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2.5" fill="#5A6B7C">READINESS</text>
  <text x="470" y="118" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2.5" fill="#5A6B7C">CUTOVER</text>
  <text x="704" y="118" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2.5" fill="#5A6B7C">LAUNCH</text>
  <text x="860" y="118" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2.5" fill="#5A6B7C">HYPERCARE</text>

  <!-- Timeline line -->
  <line x1="80" y1="200" x2="860" y2="200" stroke="#1E3A5F" stroke-width="3" stroke-linecap="round"/>

  <!-- Nodes -->
  <circle cx="80" cy="200" r="24" fill="#1E3A5F"/>
  <text x="80" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">1</text>
  <circle cx="236" cy="200" r="24" fill="#1E3A5F"/>
  <text x="236" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
  <circle cx="392" cy="200" r="24" fill="#1E3A5F"/>
  <text x="392" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
  <circle cx="548" cy="200" r="24" fill="#1E3A5F"/>
  <text x="548" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">4</text>
  <circle cx="704" cy="200" r="24" fill="#E8A33D"/>
  <text x="704" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">5</text>
  <circle cx="860" cy="200" r="24" fill="#1E3A5F"/>
  <text x="860" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">6</text>

  <!-- Ticks -->
  <line x1="80" y1="224" x2="80" y2="240" stroke="#1E3A5F" stroke-width="2"/>
  <line x1="236" y1="224" x2="236" y2="240" stroke="#1E3A5F" stroke-width="2"/>
  <line x1="392" y1="224" x2="392" y2="240" stroke="#1E3A5F" stroke-width="2"/>
  <line x1="548" y1="224" x2="548" y2="240" stroke="#1E3A5F" stroke-width="2"/>
  <line x1="704" y1="224" x2="704" y2="240" stroke="#E8A33D" stroke-width="2"/>
  <line x1="860" y1="224" x2="860" y2="240" stroke="#1E3A5F" stroke-width="2"/>

  <!-- Cards -->
  <rect x="5" y="240" width="150" height="96" rx="10" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="1.5"/>
  <text x="80" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#16294A">Mock go-live</text>
  <text x="80" y="294" text-anchor="middle" font-size="12" fill="#5A6B7C">Dress rehearsal</text>
  <text x="80" y="312" text-anchor="middle" font-size="12" fill="#5A6B7C">completed</text>

  <rect x="161" y="240" width="150" height="96" rx="10" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="1.5"/>
  <text x="236" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#16294A">Data freeze</text>
  <text x="236" y="294" text-anchor="middle" font-size="12" fill="#5A6B7C">No edits to</text>
  <text x="236" y="312" text-anchor="middle" font-size="12" fill="#5A6B7C">legacy system</text>

  <rect x="317" y="240" width="150" height="96" rx="10" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="1.5"/>
  <text x="392" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#16294A">Final migration</text>
  <text x="392" y="294" text-anchor="middle" font-size="12" fill="#5A6B7C">Reconciled to</text>
  <text x="392" y="312" text-anchor="middle" font-size="12" fill="#5A6B7C">zero tolerance</text>

  <rect x="473" y="240" width="150" height="96" rx="10" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="1.5"/>
  <text x="548" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#16294A">Cutover weekend</text>
  <text x="548" y="294" text-anchor="middle" font-size="12" fill="#5A6B7C">Runbook executed;</text>
  <text x="548" y="312" text-anchor="middle" font-size="12" fill="#5A6B7C">rollback rehearsed</text>

  <rect x="629" y="240" width="150" height="96" rx="10" fill="#FFFFFF" stroke="#E8A33D" stroke-width="2"/>
  <text x="704" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#16294A">Go-live</text>
  <text x="704" y="294" text-anchor="middle" font-size="12" fill="#5A6B7C">System live</text>
  <text x="704" y="312" text-anchor="middle" font-size="12" fill="#5A6B7C">for all users</text>

  <rect x="785" y="240" width="150" height="96" rx="10" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="1.5"/>
  <text x="860" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#16294A">Hypercare</text>
  <text x="860" y="294" text-anchor="middle" font-size="12" fill="#5A6B7C">Roster, SLAs,</text>
  <text x="860" y="312" text-anchor="middle" font-size="12" fill="#5A6B7C">escalations live</text>

  <text x="480" y="392" text-anchor="middle" font-size="14" font-style="italic" fill="#5A6B7C">Every gate must be green before moving to the next — go-live is a gate, not a date.</text>
</svg>
