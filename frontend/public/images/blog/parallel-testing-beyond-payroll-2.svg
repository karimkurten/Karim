<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" font-family="Georgia, 'DM Serif Display', serif"><defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/></filter><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2B6CB0"/></marker></defs><rect width="1200" height="980" fill="#ffffff"/><rect x="0" y="0" width="1200" height="104" fill="url(#hdr)"/><text x="60" y="48" font-size="30" fill="#ffffff">Parallel Comparison Flow: Positions Before Money</text><text x="60" y="80" font-size="17" fill="#94A3B8" font-family="Arial, sans-serif">Freeze the inputs, capture the expected result, then classify every variance</text><g filter="url(#sh)"><rect x="180" y="132" width="840" height="92" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="180" y="132" width="14" height="92" fill="#2B6CB0"/><text x="218" y="168" font-size="21" fill="#1A202C">1 — Freeze Shared Inputs</text><text x="218" y="196" font-size="15" fill="#475569" font-family="Arial, sans-serif">Period, population, elections, time, leave, and effective dates — identical in both systems.</text><path d="M600 226 L600 248" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><g filter="url(#sh)"><rect x="180" y="250" width="840" height="92" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="180" y="250" width="14" height="92" fill="#2B6CB0"/><text x="218" y="286" font-size="21" fill="#1A202C">2 — Capture the Legacy Expected Result</text><text x="218" y="314" font-size="15" fill="#475569" font-family="Arial, sans-serif">Export the completed legacy position before processing in the new system.</text><path d="M600 344 L600 366" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><g filter="url(#sh)"><rect x="180" y="368" width="840" height="92" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="180" y="368" width="14" height="92" fill="#2B6CB0"/><text x="218" y="404" font-size="21" fill="#1A202C">3 — Process the Same Period in the New System</text><text x="218" y="432" font-size="15" fill="#475569" font-family="Arial, sans-serif">No mid-run configuration changes: a fix halfway through splits the proof in two.</text><path d="M600 462 L600 484" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><g filter="url(#sh)"><rect x="180" y="486" width="840" height="92" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="180" y="486" width="14" height="92" fill="#2B6CB0"/><text x="218" y="522" font-size="21" fill="#1A202C">4 — Compare Positions Before Money</text><text x="218" y="550" font-size="15" fill="#475569" font-family="Arial, sans-serif">Enrollments, hours, leave, and balances first — costs only once positions agree.</text><path d="M600 580 L600 602" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/><g filter="url(#sh)"><rect x="180" y="604" width="840" height="92" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="180" y="604" width="14" height="92" fill="#2B6CB0"/><text x="218" y="640" font-size="21" fill="#1A202C">5 — Classify Every Variance</text><text x="218" y="668" font-size="15" fill="#475569" font-family="Arial, sans-serif">Each difference gets a written class, an explanation, and an owner.</text><g filter="url(#sh)"><rect x="60" y="740" width="340" height="150" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="60" y="740" width="14" height="150" fill="#0f172a"/><text x="90" y="782" font-size="19" fill="#1A202C">Intended Design Change</text><text x="90" y="814" font-size="15" fill="#475569" font-family="Arial, sans-serif">Recorded with the approver named —</text><text x="90" y="838" font-size="15" fill="#475569" font-family="Arial, sans-serif">not reopened later as a suspected defect.</text><g filter="url(#sh)"><rect x="440" y="740" width="340" height="150" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="440" y="740" width="14" height="150" fill="#2B6CB0"/><text x="470" y="782" font-size="19" fill="#1A202C">Data Difference</text><text x="470" y="814" font-size="15" fill="#475569" font-family="Arial, sans-serif">Correct outcome established from</text><text x="470" y="838" font-size="15" fill="#475569" font-family="Arial, sans-serif">source records; legacy gap reported.</text><g filter="url(#sh)"><rect x="820" y="740" width="340" height="150" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g><rect x="820" y="740" width="14" height="150" fill="#2B6CB0"/><text x="850" y="782" font-size="19" fill="#1A202C">Defect</text><text x="850" y="814" font-size="15" fill="#475569" font-family="Arial, sans-serif">Fix, then re-run the affected scope</text><text x="850" y="838" font-size="15" fill="#475569" font-family="Arial, sans-serif">plus linked regression before sign-off.</text><text x="600" y="934" font-size="16" fill="#64748B" font-family="Arial, sans-serif" text-anchor="middle">Unexplained variances are open defects — whatever their size.</text></svg>