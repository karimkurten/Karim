<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Probability and impact heat map with velocity as the third dimension">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg2)"/>
  <text x="600" y="62" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="32">Score the Risk: Probability × Impact — Then Ask How Fast</text>
  <text x="600" y="94" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="16">Cell colour sets the response deadline. Velocity decides whether you still have one.</text>
  <g font-family="Arial, sans-serif" font-size="15">
    <text x="330" y="140" fill="#93c5fd">IMPACT →</text>
    <text x="300" y="150" fill="#ffffff">1</text><text x="420" y="150" fill="#ffffff">2</text><text x="540" y="150" fill="#ffffff">3</text><text x="660" y="150" fill="#ffffff">4</text><text x="780" y="150" fill="#ffffff">5</text>
    <!-- rows: probability 5 at top -->
    <g>
      <rect x="270" y="160" width="110" height="70" fill="#2b6cb0"/><rect x="390" y="160" width="110" height="70" fill="#2b6cb0"/><rect x="510" y="160" width="110" height="70" fill="#1d4ed8"/><rect x="630" y="160" width="110" height="70" fill="#1e40af"/><rect x="750" y="160" width="110" height="70" fill="#172554" stroke="#f8fafc" stroke-width="2"/>
      <rect x="270" y="240" width="110" height="70" fill="#334155"/><rect x="390" y="240" width="110" height="70" fill="#2b6cb0"/><rect x="510" y="240" width="110" height="70" fill="#2b6cb0"/><rect x="630" y="240" width="110" height="70" fill="#1d4ed8"/><rect x="750" y="240" width="110" height="70" fill="#1e40af"/>
      <rect x="270" y="320" width="110" height="70" fill="#334155"/><rect x="390" y="320" width="110" height="70" fill="#334155"/><rect x="510" y="320" width="110" height="70" fill="#2b6cb0"/><rect x="630" y="320" width="110" height="70" fill="#2b6cb0"/><rect x="750" y="320" width="110" height="70" fill="#1d4ed8"/>
      <rect x="270" y="400" width="110" height="70" fill="#1e293b"/><rect x="390" y="400" width="110" height="70" fill="#334155"/><rect x="510" y="400" width="110" height="70" fill="#334155"/><rect x="630" y="400" width="110" height="70" fill="#2b6cb0"/><rect x="750" y="400" width="110" height="70" fill="#2b6cb0"/>
      <rect x="270" y="480" width="110" height="70" fill="#1e293b"/><rect x="390" y="480" width="110" height="70" fill="#1e293b"/><rect x="510" y="480" width="110" height="70" fill="#334155"/><rect x="630" y="480" width="110" height="70" fill="#334155"/><rect x="750" y="480" width="110" height="70" fill="#2b6cb0"/>
    </g>
    <g fill="#ffffff"><text x="215" y="202">P 5</text><text x="215" y="282">P 4</text><text x="215" y="362">P 3</text><text x="215" y="442">P 2</text><text x="215" y="522">P 1</text></g>
    <g fill="#e0f2fe" font-size="14">
      <text x="905" y="200">Reading the map</text>
      <text x="905" y="232">Top-right: act this week,</text>
      <text x="905" y="254">steering-level visibility.</text>
      <text x="905" y="292">Middle band: owned response</text>
      <text x="905" y="314">plan, monthly review.</text>
      <text x="905" y="352">Bottom-left: watch list,</text>
      <text x="905" y="374">quarterly re-score.</text>
      <text x="905" y="422" fill="#93c5fd">Velocity rule</text>
      <text x="905" y="454">A risk that can materialize</text>
      <text x="905" y="476">faster than your response</text>
      <text x="905" y="498">can mobilize is scored one</text>
      <text x="905" y="520">band higher — regardless</text>
      <text x="905" y="542">of its cell.</text>
    </g>
  </g>
  <text x="600" y="610" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="13">Anchored scales are defined in Part 4 of the guide. No amber is used: severity is shown by blue depth, per site palette.</text>
</svg>
