<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="Convergence flow diagram: three legacy ID sources pass through keep-or-generate decisions into a central ID mapping table, then into the target HCM system.">
  <defs>
    <filter id="ds1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="panel1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#F0F4F8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>
  <text x="40" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1A202C">From legacy IDs to one target identity</text>
  <text x="40" y="80" font-family="Arial, sans-serif" font-size="15" fill="#64748B">Every source gets one decision — keep or generate — recorded in the mapping table.</text>

  <!-- Source boxes -->
  <g filter="url(#ds1)">
    <rect x="30" y="140" width="230" height="104" rx="10" fill="url(#panel1)" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="30" y="140" width="230" height="104" rx="10" fill="none" stroke="#2B6CB0" stroke-width="3" opacity="0.0"/>
    <rect x="30" y="140" width="6" height="104" fill="#2B6CB0"/>
    <text x="52" y="178" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Legacy HRIS</text>
    <text x="52" y="206" font-family="Arial, sans-serif" font-size="15" fill="#64748B">ID 00412</text>
    <text x="52" y="228" font-family="Arial, sans-serif" font-size="12" fill="#64748B">Series: 00001–49999</text>
  </g>
  <g filter="url(#ds1)">
    <rect x="30" y="290" width="230" height="104" rx="10" fill="url(#panel1)" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="30" y="290" width="6" height="104" fill="#2B6CB0"/>
    <text x="52" y="328" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Payroll system</text>
    <text x="52" y="356" font-family="Arial, sans-serif" font-size="15" fill="#64748B">ID 00412</text>
    <text x="52" y="378" font-family="Arial, sans-serif" font-size="12" fill="#64748B">Series: 00001–49999</text>
  </g>
  <g filter="url(#ds1)">
    <rect x="30" y="440" width="230" height="104" rx="10" fill="url(#panel1)" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="30" y="440" width="6" height="104" fill="#2B6CB0"/>
    <text x="52" y="478" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Acquired company HRIS</text>
    <text x="52" y="506" font-family="Arial, sans-serif" font-size="15" fill="#64748B">ID EMP-9917</text>
    <text x="52" y="528" font-family="Arial, sans-serif" font-size="12" fill="#64748B">Series: EMP-0001–9999</text>
  </g>

  <!-- Arrows source -> diamonds -->
  <g stroke="#2B6CB0" stroke-width="2" fill="none">
    <line x1="260" y1="192" x2="318" y2="192"/><polygon points="318,192 306,186 306,198" fill="#2B6CB0" stroke="none"/>
    <line x1="260" y1="342" x2="318" y2="342"/><polygon points="318,342 306,336 306,348" fill="#2B6CB0" stroke="none"/>
    <line x1="260" y1="492" x2="318" y2="492"/><polygon points="318,492 306,486 306,498" fill="#2B6CB0" stroke="none"/>
  </g>

  <!-- Decision diamonds -->
  <g filter="url(#ds1)">
    <polygon points="390,132 452,192 390,252 328,192" fill="#2B6CB0"/>
    <text x="390" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Keep or</text>
    <text x="390" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">generate?</text>
  </g>
  <g filter="url(#ds1)">
    <polygon points="390,282 452,342 390,402 328,342" fill="#2B6CB0"/>
    <text x="390" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Keep or</text>
    <text x="390" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">generate?</text>
  </g>
  <g filter="url(#ds1)">
    <polygon points="390,432 452,492 390,552 328,492" fill="#2B6CB0"/>
    <text x="390" y="488" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Keep or</text>
    <text x="390" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">generate?</text>
  </g>

  <!-- Arrows diamonds -> mapping table -->
  <g stroke="#2B6CB0" stroke-width="2" fill="none">
    <line x1="452" y1="192" x2="520" y2="192"/><polygon points="520,192 508,186 508,198" fill="#2B6CB0" stroke="none"/>
    <line x1="452" y1="342" x2="520" y2="342"/><polygon points="520,342 508,336 508,348" fill="#2B6CB0" stroke="none"/>
    <line x1="452" y1="492" x2="520" y2="492"/><polygon points="520,492 508,486 508,498" fill="#2B6CB0" stroke="none"/>
  </g>

  <!-- Mapping table panel -->
  <g filter="url(#ds1)">
    <rect x="520" y="120" width="310" height="474" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="545" y="160" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">ID mapping table</text>
    <text x="545" y="184" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Source · Legacy ID · Target ID</text>
    <line x1="545" y1="196" x2="805" y2="196" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="545" y="228" font-family="Arial, sans-serif" font-size="14" fill="#475569">Legacy HRIS</text>
    <text x="545" y="250" font-family="Arial, sans-serif" font-size="14" fill="#64748B">00412</text>
    <text x="700" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">T-20412</text>
    <line x1="545" y1="266" x2="805" y2="266" stroke="#E2E8F0" stroke-width="1"/>
    <text x="545" y="298" font-family="Arial, sans-serif" font-size="14" fill="#475569">Payroll system</text>
    <text x="545" y="320" font-family="Arial, sans-serif" font-size="14" fill="#64748B">00412</text>
    <text x="700" y="320" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">T-20413</text>
    <line x1="545" y1="336" x2="805" y2="336" stroke="#E2E8F0" stroke-width="1"/>
    <text x="545" y="368" font-family="Arial, sans-serif" font-size="14" fill="#475569">Acquired HRIS</text>
    <text x="545" y="390" font-family="Arial, sans-serif" font-size="14" fill="#64748B">EMP-9917</text>
    <text x="700" y="390" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">T-29917</text>
    <line x1="545" y1="406" x2="805" y2="406" stroke="#E2E8F0" stroke-width="1"/>
    <text x="545" y="438" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Collision resolved:</text>
    <text x="545" y="460" font-family="Arial, sans-serif" font-size="13" fill="#64748B">prefix distinguishes the two 00412s</text>
    <text x="545" y="492" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Controlled artifact — every</text>
    <text x="545" y="514" font-family="Arial, sans-serif" font-size="13" fill="#64748B">load resolves through this table</text>
    <text x="545" y="546" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Deterministic: same input,</text>
    <text x="545" y="568" font-family="Arial, sans-serif" font-size="13" fill="#64748B">same ID, every load</text>
  </g>

  <!-- Arrow mapping -> target -->
  <g stroke="#2B6CB0" stroke-width="2" fill="none">
    <line x1="830" y1="342" x2="892" y2="342"/><polygon points="892,342 880,336 880,348" fill="#2B6CB0" stroke="none"/>
  </g>

  <!-- Target box -->
  <g filter="url(#ds1)">
    <rect x="892" y="262" width="240" height="160" rx="10" fill="url(#panel1)" stroke="#2B6CB0" stroke-width="2"/>
    <text x="1012" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Target HCM</text>
    <text x="1012" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2B6CB0">ID T-20412</text>
    <text x="1012" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748B">One person, one ID,</text>
    <text x="1012" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748B">one collision-free series</text>
  </g>

  <text x="40" y="648" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="#64748B">One decision per source, applied everywhere — the mapping table is the single translation layer.</text>
</svg>
