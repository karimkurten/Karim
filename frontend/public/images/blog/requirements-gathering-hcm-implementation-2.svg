<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Fit-gap classification diagram: fit, gap, and custom outcomes">
  <rect x="0" y="0" width="1200" height="660" rx="24" fill="#F4F6F8"/>
  <text x="600" y="58" text-anchor="middle" font-size="30" font-weight="700" fill="#16294A">Fit-Gap Classification</text>
  <text x="600" y="94" text-anchor="middle" font-size="18" fill="#5B6B7F">Every requirement maps against standard functionality to exactly one outcome</text>

  <!-- FIT card -->
  <rect x="60" y="130" width="320" height="360" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="60" y="130" width="320" height="72" rx="16" fill="#1E3A5F"/>
  <rect x="60" y="166" width="320" height="36" fill="#1E3A5F"/>
  <text x="220" y="177" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">FIT</text>
  <text x="220" y="252" text-anchor="middle" font-size="19" font-weight="700" fill="#16294A">Covered out of the box</text>
  <text x="220" y="300" text-anchor="middle" font-size="16" fill="#5B6B7F">Standard functionality meets</text>
  <text x="220" y="328" text-anchor="middle" font-size="16" fill="#5B6B7F">the requirement. No extra</text>
  <text x="220" y="356" text-anchor="middle" font-size="16" fill="#5B6B7F">configuration or development.</text>
  <circle cx="220" cy="430" r="30" fill="#EAF2FA"/>
  <text x="220" y="443" text-anchor="middle" font-size="30" font-weight="700" fill="#1E3A5F">&#10003;</text>

  <!-- GAP card -->
  <rect x="440" y="130" width="320" height="360" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="440" y="130" width="320" height="72" rx="16" fill="#E8A33D"/>
  <rect x="440" y="166" width="320" height="36" fill="#E8A33D"/>
  <text x="600" y="177" text-anchor="middle" font-size="24" font-weight="700" fill="#16294A">GAP</text>
  <text x="600" y="252" text-anchor="middle" font-size="19" font-weight="700" fill="#16294A">Needs configuration</text>
  <text x="600" y="300" text-anchor="middle" font-size="16" fill="#5B6B7F">Achievable with configuration,</text>
  <text x="600" y="328" text-anchor="middle" font-size="16" fill="#5B6B7F">reporting, or a documented</text>
  <text x="600" y="356" text-anchor="middle" font-size="16" fill="#5B6B7F">process workaround.</text>
  <circle cx="600" cy="430" r="30" fill="#FBF1DC"/>
  <text x="600" y="442" text-anchor="middle" font-size="28" font-weight="700" fill="#B97B1E">&#8776;</text>

  <!-- CUSTOM card -->
  <rect x="820" y="130" width="320" height="360" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="820" y="130" width="320" height="72" rx="16" fill="#5B6B7F"/>
  <rect x="820" y="166" width="320" height="36" fill="#5B6B7F"/>
  <text x="980" y="177" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">CUSTOM</text>
  <text x="980" y="252" text-anchor="middle" font-size="19" font-weight="700" fill="#16294A">Needs development</text>
  <text x="980" y="300" text-anchor="middle" font-size="16" fill="#5B6B7F">Requires custom code. Each one</text>
  <text x="980" y="328" text-anchor="middle" font-size="16" fill="#5B6B7F">adds testing surface and</text>
  <text x="980" y="356" text-anchor="middle" font-size="16" fill="#5B6B7F">upgrade risk.</text>
  <circle cx="980" cy="430" r="30" fill="#EFEFF1"/>
  <text x="980" y="443" text-anchor="middle" font-size="30" font-weight="700" fill="#5B6B7F">!</text>

  <!-- bottom caution -->
  <text x="600" y="566" text-anchor="middle" font-size="19" font-style="italic" fill="#16294A">Challenge every &#8220;custom&#8221; &#8212; most are preferences, not needs.</text>
  <text x="600" y="602" text-anchor="middle" font-size="16" fill="#5B6B7F">Customizations add cost in testing, maintenance, and every future upgrade.</text>
</svg>
