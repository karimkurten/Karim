<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Anatomy of a solution design document">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="800" rx="16" fill="#F0F4F8"/>

  <path d="M0,16 Q0,0 16,0 L1184,0 Q1200,0 1200,16 L1200,96 L0,96 Z" fill="url(#hero)"/>
  <text x="48" y="58" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#ffffff">Anatomy of a Solution Design Document</text>
  <text x="48" y="128" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" fill="#64748B">Eight layers. Each one answers a question the build team will otherwise ask you mid-sprint.</text>

  <g filter="url(#soft)">
    <rect x="40" y="150" width="1120" height="68" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="104" cy="184" r="22" fill="#2B6CB0"/>
    <text x="104" y="192" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">1</text>
    <text x="148" y="178" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1A202C">Design Principles</text>
    <text x="148" y="204" font-family="system-ui, sans-serif" font-size="17" fill="#475569">The ground rules every later decision is measured against</text>
  </g>

  <g filter="url(#soft)">
    <rect x="40" y="230" width="1120" height="68" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="104" cy="264" r="22" fill="#2B6CB0"/>
    <text x="104" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">2</text>
    <text x="148" y="258" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1A202C">Scope Boundaries</text>
    <text x="148" y="284" font-family="system-ui, sans-serif" font-size="17" fill="#475569">What is in scope, and explicitly out, before design begins</text>
  </g>

  <g filter="url(#soft)">
    <rect x="40" y="310" width="1120" height="68" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="104" cy="344" r="22" fill="#2B6CB0"/>
    <text x="104" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">3</text>
    <text x="148" y="338" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1A202C">Process Design</text>
    <text x="148" y="364" font-family="system-ui, sans-serif" font-size="17" fill="#475569">Future-state flows, handoffs, and decision points</text>
  </g>

  <g filter="url(#soft)">
    <rect x="40" y="390" width="1120" height="68" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="104" cy="424" r="22" fill="#2B6CB0"/>
    <text x="104" y="432" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">4</text>
    <text x="148" y="418" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1A202C">Data Model and Field Rules</text>
    <text x="148" y="444" font-family="system-ui, sans-serif" font-size="17" fill="#475569">Objects, fields, defaults, and validation logic</text>
  </g>

  <g filter="url(#soft)">
    <rect x="40" y="470" width="1120" height="68" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="104" cy="504" r="22" fill="#2B6CB0"/>
    <text x="104" y="512" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">5</text>
    <text x="148" y="498" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1A202C">Integrations</text>
    <text x="148" y="524" font-family="system-ui, sans-serif" font-size="17" fill="#475569">Where data moves between systems, and how it gets there</text>
  </g>

  <g filter="url(#soft)">
    <rect x="40" y="550" width="1120" height="68" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="104" cy="584" r="22" fill="#2B6CB0"/>
    <text x="104" y="592" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">6</text>
    <text x="148" y="578" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1A202C">Security and Roles</text>
    <text x="148" y="604" font-family="system-ui, sans-serif" font-size="17" fill="#475569">Who can see and do what, and who approves access</text>
  </g>

  <g filter="url(#soft)">
    <rect x="40" y="630" width="1120" height="68" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="104" cy="664" r="22" fill="#2B6CB0"/>
    <text x="104" y="672" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">7</text>
    <text x="148" y="658" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1A202C">Assumptions and Constraints</text>
    <text x="148" y="684" font-family="system-ui, sans-serif" font-size="17" fill="#475569">Everything the design depends on being true</text>
  </g>

  <g filter="url(#soft)">
    <rect x="40" y="710" width="1120" height="68" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="104" cy="744" r="22" fill="#2B6CB0"/>
    <text x="104" y="752" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">8</text>
    <text x="148" y="738" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#1A202C">Open Decisions</text>
    <text x="148" y="764" font-family="system-ui, sans-serif" font-size="17" fill="#475569">Unresolved items with owners and due dates, never silent gaps</text>
  </g>

  <text x="48" y="706" font-family="system-ui, sans-serif" font-size="16" font-style="italic" fill="#64748B">Missing a layer? It becomes a question in build, a defect in testing, or a scope fight at go-live.</text>
</svg>
