<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Recruiting control diagram: requisition and job data feeding pipeline stages, then interview scheduling, scorecards, and the offer workflow before the Core HR handoff to onboarding, with a privacy and retention strip">
  <defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient></defs>
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="88" fill="url(#hdr)"/>
  <text x="48" y="40" font-family="Georgia, serif" font-size="29" fill="#ffffff">Recruiting Data: From Requisition to Core HR Handoff</text>
  <text x="48" y="70" font-family="Arial, sans-serif" font-size="20" fill="#94A3B8">Each step is controlled before the hire reaches onboarding</text>
  <g><rect x="40" y="120" width="240" height="220" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/><text x="60" y="154" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Requisition and Job</text><text x="60" y="188" font-family="Arial, sans-serif" font-size="15" fill="#475569">Approved requisition</text><text x="60" y="210" font-family="Arial, sans-serif" font-size="15" fill="#475569">and controlled job</text><text x="60" y="232" font-family="Arial, sans-serif" font-size="15" fill="#475569">template open the round.</text><text x="60" y="276" font-family="Arial, sans-serif" font-size="15" fill="#475569">Job and organisation</text><text x="60" y="298" font-family="Arial, sans-serif" font-size="15" fill="#475569">come from the Core</text><text x="60" y="320" font-family="Arial, sans-serif" font-size="15" fill="#475569">HR record.</text></g>
  <text x="288" y="238" font-family="Arial, sans-serif" font-size="24" fill="#2B6CB0">&#8594;</text>
  <g><rect x="322" y="120" width="240" height="220" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="342" y="154" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Pipeline Stages</text><text x="342" y="188" font-family="Arial, sans-serif" font-size="15" fill="#475569">Applied, screening,</text><text x="342" y="210" font-family="Arial, sans-serif" font-size="15" fill="#475569">interview, offer, hired.</text><text x="342" y="232" font-family="Arial, sans-serif" font-size="15" fill="#475569">Shared by every team.</text><text x="342" y="276" font-family="Arial, sans-serif" font-size="15" fill="#475569">Disposition reasons</text><text x="342" y="298" font-family="Arial, sans-serif" font-size="15" fill="#475569">recorded whenever a</text><text x="342" y="320" font-family="Arial, sans-serif" font-size="15" fill="#475569">candidate leaves.</text></g>
  <text x="570" y="238" font-family="Arial, sans-serif" font-size="24" fill="#2B6CB0">&#8594;</text>
  <g><rect x="604" y="120" width="240" height="220" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="624" y="154" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Interview and Offer</text><text x="624" y="188" font-family="Arial, sans-serif" font-size="15" fill="#475569">Scheduling in system;</text><text x="624" y="210" font-family="Arial, sans-serif" font-size="15" fill="#475569">scorecards tied to the</text><text x="624" y="232" font-family="Arial, sans-serif" font-size="15" fill="#475569">job template.</text><text x="624" y="276" font-family="Arial, sans-serif" font-size="15" fill="#475569">Offer terms approved</text><text x="624" y="298" font-family="Arial, sans-serif" font-size="15" fill="#475569">before the candidate</text><text x="624" y="320" font-family="Arial, sans-serif" font-size="15" fill="#475569">accepts in system.</text></g>
  <text x="852" y="238" font-family="Arial, sans-serif" font-size="24" fill="#2B6CB0">&#8594;</text>
  <g><rect x="886" y="120" width="274" height="220" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="906" y="154" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Core HR Handoff</text><text x="906" y="188" font-family="Arial, sans-serif" font-size="15" fill="#475569">Accepted candidate</text><text x="906" y="210" font-family="Arial, sans-serif" font-size="15" fill="#475569">becomes the employee</text><text x="906" y="232" font-family="Arial, sans-serif" font-size="15" fill="#475569">record for onboarding.</text><text x="906" y="276" font-family="Arial, sans-serif" font-size="15" fill="#475569">No re-keying of name,</text><text x="906" y="298" font-family="Arial, sans-serif" font-size="15" fill="#475569">role, or start date</text><text x="906" y="320" font-family="Arial, sans-serif" font-size="15" fill="#475569">between systems.</text></g>
  <rect x="40" y="372" width="1120" height="88" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="404" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Privacy and retention, by design</text>
  <text x="64" y="430" font-family="Arial, sans-serif" font-size="16" fill="#475569">Role-based access to candidate records at each stage — visibility follows the hiring role, not curiosity.</text>
  <text x="64" y="452" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Candidate communication is recorded with the application; retention is reviewed on a schedule.</text>
  <rect x="40" y="484" width="1120" height="72" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="516" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Reporting is defined before go-live</text>
  <text x="64" y="542" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Requisitions by stage, time in stage, and source of application — proven in the pilot.</text>
  <text x="40" y="600" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Figure 2 — Recruiting control diagram</text>
</svg>
