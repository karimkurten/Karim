<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Stakeholder map for an HCM implementation showing sponsors, owners, users, and partners">
  <rect x="0" y="0" width="1200" height="700" fill="#F4F6F8"/>
  <rect x="16" y="16" width="1168" height="668" rx="16" fill="#FFFFFF"/>

  <text x="60" y="66" font-size="26" font-weight="700" fill="#16294A">HCM Implementation Stakeholder Map</text>
  <text x="60" y="94" font-size="14" fill="#5A6C7D">Proximity to the center reflects influence over project outcomes.</text>

  <defs>
    <path id="arc1" d="M 205,350 A 225,225 0 0 1 655,350" fill="none"/>
    <path id="arc2" d="M 262,350 A 168,168 0 0 1 598,350" fill="none"/>
    <path id="arc3" d="M 318,350 A 112,112 0 0 1 542,350" fill="none"/>
  </defs>

  <!-- Rings: outermost to innermost -->
  <circle cx="430" cy="350" r="300" fill="#E9EEF4" stroke="#1E3A5F" stroke-width="2"/>
  <circle cx="430" cy="350" r="225" fill="#DCE4EE" stroke="#1E3A5F" stroke-width="2"/>
  <circle cx="430" cy="350" r="150" fill="#CBD6E6" stroke="#1E3A5F" stroke-width="2"/>
  <circle cx="430" cy="350" r="75" fill="#E8A33D" stroke="#16294A" stroke-width="2"/>

  <!-- Curved labels along the top of each ring -->
  <text font-size="14" font-weight="700" fill="#16294A">
    <textPath href="#arc1" startOffset="50%" text-anchor="middle">Peripheral Stakeholders — IT · Vendors · Carriers · Banks · Regulators</textPath>
  </text>
  <text font-size="14" font-weight="700" fill="#16294A">
    <textPath href="#arc2" startOffset="50%" text-anchor="middle">End Users — HR Operations · Payroll Admins · Managers · Employees</textPath>
  </text>
  <text font-size="14" font-weight="700" fill="#16294A">
    <textPath href="#arc3" startOffset="50%" text-anchor="middle">Process Owners &amp; Workstream Leads</textPath>
  </text>

  <text x="430" y="346" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Executive</text>
  <text x="430" y="365" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Sponsor</text>

  <!-- Right-side detail cards -->
  <g>
    <rect x="790" y="120" width="350" height="118" rx="12" fill="#FFFFFF" stroke="#DCE4EE" stroke-width="2"/>
    <circle cx="818" cy="146" r="13" fill="#E8A33D"/>
    <text x="818" y="151" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="840" y="151" font-size="15" font-weight="700" fill="#16294A">Executive Sponsor</text>
    <text x="806" y="176" font-size="12" fill="#33475B">Influence: highest — scope, budget &amp; go/no-go calls</text>
    <text x="806" y="196" font-size="12" fill="#5A6C7D">Needs: top risks, decisions needed, trade-offs</text>
    <text x="806" y="216" font-size="12" fill="#5A6C7D">early — never a surprise</text>
  </g>
  <g>
    <rect x="790" y="252" width="350" height="118" rx="12" fill="#FFFFFF" stroke="#DCE4EE" stroke-width="2"/>
    <circle cx="818" cy="278" r="13" fill="#1E3A5F"/>
    <text x="818" y="283" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="840" y="283" font-size="15" font-weight="700" fill="#16294A">Process Owners &amp; Leads</text>
    <text x="806" y="308" font-size="12" fill="#33475B">Influence: high — design detail &amp; sign-off authority</text>
    <text x="806" y="328" font-size="12" fill="#5A6C7D">Needs: design documents, test outcomes, defect calls</text>
    <text x="806" y="348" font-size="12" fill="#5A6C7D">— participation converts opponents</text>
  </g>
  <g>
    <rect x="790" y="384" width="350" height="118" rx="12" fill="#FFFFFF" stroke="#DCE4EE" stroke-width="2"/>
    <circle cx="818" cy="410" r="13" fill="#1E3A5F"/>
    <text x="818" y="415" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="840" y="415" font-size="15" font-weight="700" fill="#16294A">End Users</text>
    <text x="806" y="440" font-size="12" fill="#33475B">Influence: medium-high — adoption makes or breaks value</text>
    <text x="806" y="460" font-size="12" fill="#5A6C7D">Needs: role-based training, clear communication,</text>
    <text x="806" y="480" font-size="12" fill="#5A6C7D">answered feedback, quick reference guides</text>
  </g>
  <g>
    <rect x="790" y="516" width="350" height="118" rx="12" fill="#FFFFFF" stroke="#DCE4EE" stroke-width="2"/>
    <circle cx="818" cy="542" r="13" fill="#1E3A5F"/>
    <text x="818" y="547" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="840" y="547" font-size="15" font-weight="700" fill="#16294A">Peripheral Stakeholders</text>
    <text x="806" y="572" font-size="12" fill="#33475B">Influence: low-medium — can block via dependencies</text>
    <text x="806" y="592" font-size="12" fill="#5A6C7D">Needs: schedules, specs, booked testing windows</text>
    <text x="806" y="612" font-size="12" fill="#5A6C7D">— engage during design, not during testing</text>
  </g>

  <text x="430" y="678" font-size="12" font-style="italic" fill="#5A6C7D" text-anchor="middle">Map influence vs. interest early — know who can block you and who needs attention.</text>
</svg>
