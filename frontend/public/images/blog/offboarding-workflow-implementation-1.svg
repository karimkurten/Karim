<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="The offboarding journey: notice received, handover window, final day, access closed, and record closed, with lead owners at each stage">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="88" fill="url(#hdr)"/>
  <text x="48" y="40" font-family="Georgia, serif" font-size="29" fill="#ffffff">Offboarding: From Notice to Record Closure</text>
  <text x="48" y="70" font-family="Arial, sans-serif" font-size="20" fill="#94A3B8">Five stages — each with a purpose and lead owners</text>
  <g>
    <rect x="40" y="108" width="204" height="252" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="58" y="142" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">Notice</text>
    <text x="58" y="166" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">Received</text>
    <text x="58" y="200" font-family="Arial, sans-serif" font-size="16" fill="#475569">Confirm last day</text>
    <text x="58" y="224" font-family="Arial, sans-serif" font-size="16" fill="#475569">and exit type.</text>
    <text x="58" y="262" font-family="Arial, sans-serif" font-size="16" fill="#475569">Decide who needs</text>
    <text x="58" y="286" font-family="Arial, sans-serif" font-size="16" fill="#475569">to know, and when.</text>
    <text x="58" y="330" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2B6CB0">Lead: HR, Manager</text>
  </g>
  <g>
    <rect x="264" y="108" width="204" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="282" y="142" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">Handover</text>
    <text x="282" y="166" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">Window</text>
    <text x="282" y="200" font-family="Arial, sans-serif" font-size="16" fill="#475569">Move owned work</text>
    <text x="282" y="224" font-family="Arial, sans-serif" font-size="16" fill="#475569">to named cover.</text>
    <text x="282" y="262" font-family="Arial, sans-serif" font-size="16" fill="#475569">Receiver confirms</text>
    <text x="282" y="286" font-family="Arial, sans-serif" font-size="16" fill="#475569">they can act.</text>
    <text x="282" y="330" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2B6CB0">Lead: Employee, Mgr</text>
  </g>
  <g>
    <rect x="488" y="108" width="204" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="506" y="142" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">Final</text>
    <text x="506" y="166" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">Day</text>
    <text x="506" y="200" font-family="Arial, sans-serif" font-size="16" fill="#475569">Return assets and</text>
    <text x="506" y="224" font-family="Arial, sans-serif" font-size="16" fill="#475569">badge. Complete</text>
    <text x="506" y="262" font-family="Arial, sans-serif" font-size="16" fill="#475569">last documents</text>
    <text x="506" y="286" font-family="Arial, sans-serif" font-size="16" fill="#475569">and farewells.</text>
    <text x="506" y="330" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2B6CB0">Lead: HR, IT</text>
  </g>
  <g>
    <rect x="712" y="108" width="204" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="730" y="142" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">Access</text>
    <text x="730" y="166" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">Closed</text>
    <text x="730" y="200" font-family="Arial, sans-serif" font-size="16" fill="#475569">Close accounts at</text>
    <text x="730" y="224" font-family="Arial, sans-serif" font-size="16" fill="#475569">the agreed time.</text>
    <text x="730" y="262" font-family="Arial, sans-serif" font-size="16" fill="#475569">Confirm closure</text>
    <text x="730" y="286" font-family="Arial, sans-serif" font-size="16" fill="#475569">system by system.</text>
    <text x="730" y="330" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2B6CB0">Lead: IT</text>
  </g>
  <g>
    <rect x="936" y="108" width="204" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="954" y="142" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">Record</text>
    <text x="954" y="166" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">Closed</text>
    <text x="954" y="200" font-family="Arial, sans-serif" font-size="16" fill="#475569">Final pay in the</text>
    <text x="954" y="224" font-family="Arial, sans-serif" font-size="16" fill="#475569">correct cycle.</text>
    <text x="954" y="262" font-family="Arial, sans-serif" font-size="16" fill="#475569">Retain the record</text>
    <text x="954" y="286" font-family="Arial, sans-serif" font-size="16" fill="#475569">as policy defines.</text>
    <text x="954" y="330" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2B6CB0">Lead: HR, Payroll</text>
  </g>
  <rect x="40" y="392" width="1100" height="72" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="424" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Every stage reads the employment record</text>
  <text x="64" y="450" font-family="Arial, sans-serif" font-size="16" fill="#475569">Person, position, manager, location, and last working day drive the tasks, the timing, and the closure checks.</text>
  <rect x="40" y="488" width="1100" height="72" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="520" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">If the last day moves, the plan moves with it</text>
  <text x="64" y="546" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Re-time access, assets, and pay tasks explicitly, and notify every owner whose date changed.</text>
  <text x="40" y="600" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Figure 1 — Offboarding journey</text>
</svg>
