<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Obligations register flow from external obligations to evidence">
<rect width="1200" height="675" fill="#0f172a"/>
<text x="600" y="52" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="bold">From Obligation to Evidence</text>
<rect x="40" y="110" width="190" height="300" rx="10" fill="#1e3a5f"/>
<text x="135" y="150" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">OBLIGATIONS</text>
<text x="135" y="195" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="15">Law</text>
<text x="135" y="235" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="15">Regulation</text>
<text x="135" y="275" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="15">Contract</text>
<text x="135" y="315" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="15">Policy</text>
<text x="135" y="355" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="15">Standard adopted</text>
<text x="255" y="265" fill="#60a5fa" font-family="Arial, sans-serif" font-size="34">&#8594;</text>
<rect x="310" y="110" width="190" height="300" rx="10" fill="#1e3a5f"/>
<text x="405" y="150" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">OWNER</text>
<text x="405" y="195" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="15">One named owner</text>
<text x="405" y="235" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="15">per obligation</text>
<text x="405" y="275" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="15">No shared</text>
<text x="405" y="315" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="15">accountability</text>
<text x="405" y="355" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="15">without a lead</text>
<text x="525" y="265" fill="#60a5fa" font-family="Arial, sans-serif" font-size="34">&#8594;</text>
<rect x="580" y="110" width="190" height="300" rx="10" fill="#1e3a5f"/>
<text x="675" y="150" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">CONTROLS</text>
<text x="675" y="195" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="15">Preventive</text>
<text x="675" y="235" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="15">Detective</text>
<text x="675" y="275" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="15">In the workflow,</text>
<text x="675" y="315" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="15">not beside it</text>
<text x="675" y="355" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="15">Frequency stated</text>
<text x="795" y="265" fill="#60a5fa" font-family="Arial, sans-serif" font-size="34">&#8594;</text>
<rect x="850" y="110" width="150" height="300" rx="10" fill="#1e3a5f"/>
<text x="925" y="150" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">EVIDENCE</text>
<text x="925" y="195" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="15">Dated</text>
<text x="925" y="235" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="15">Retained</text>
<text x="925" y="275" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="15">Retrievable</text>
<text x="925" y="315" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="15">Reviewed</text>
<text x="1025" y="265" fill="#60a5fa" font-family="Arial, sans-serif" font-size="34">&#8594;</text>
<rect x="1050" y="110" width="120" height="300" rx="10" fill="#1e3a5f"/>
<text x="1110" y="150" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="bold">REVIEW</text>
<text x="1110" y="200" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="14">Next date</text>
<text x="1110" y="245" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="14">set before</text>
<text x="1110" y="290" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="14">the current</text>
<text x="1110" y="335" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="14">one closes</text>
<text x="600" y="480" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">An obligation with no owner, no control, and no evidence is a hope written in formal language.</text>
<text x="600" y="525" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="16">The register is the Map discipline of the Proof System: every row must complete the full chain.</text>
<text x="600" y="580" text-anchor="middle" fill="#93c5fd" font-family="Arial, sans-serif" font-size="16">Review the chain, not the document: pick any row at random and walk it end to end.</text>
</svg>
