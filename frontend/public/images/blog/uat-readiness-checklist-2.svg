<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Georgia, 'DM Serif Display', serif">
  <defs>
    <linearGradient id="hdr2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <filter id="sh2" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2B6CB0"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="104" fill="url(#hdr2)"/>
  <text x="60" y="48" font-size="30" fill="#ffffff">Three Honest Readiness Outcomes</text>
  <text x="60" y="80" font-size="17" fill="#94A3B8" font-family="Arial, sans-serif">Check the five domains against their ready tests — the evidence, not the start date, decides the outcome</text>

  <g filter="url(#sh2)"><rect x="350" y="150" width="500" height="120" rx="12" fill="#1e3a5f"/></g>
  <text x="600" y="198" font-size="23" fill="#ffffff" text-anchor="middle">Check the Five Domains</text>
  <text x="600" y="230" font-size="15" fill="#E2E8F0" font-family="Arial, sans-serif" text-anchor="middle">Scope, data, environment, people, process — proven live</text>

  <path d="M600 272 L600 310 L225 310 L225 340" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M600 272 L600 340" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M600 272 L600 310 L975 310 L975 340" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>

  <g filter="url(#sh2)"><rect x="60" y="348" width="330" height="170" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/></g>
  <text x="225" y="396" font-size="22" fill="#1A202C" text-anchor="middle">Ready</text>
  <text x="225" y="428" font-size="15" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">Every domain passes its ready test</text>
  <text x="225" y="452" font-size="15" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">on live evidence at the gate</text>
  <text x="225" y="486" font-size="15" fill="#2B6CB0" font-family="Arial, sans-serif" text-anchor="middle">Next: start the cycle as planned,</text>
  <text x="225" y="508" font-size="15" fill="#2B6CB0" font-family="Arial, sans-serif" text-anchor="middle">with the check on record</text>

  <g filter="url(#sh2)"><rect x="435" y="348" width="330" height="170" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g>
  <text x="600" y="396" font-size="22" fill="#1A202C" text-anchor="middle">Ready With Conditions</text>
  <text x="600" y="428" font-size="15" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">Gaps contained, with each condition</text>
  <text x="600" y="452" font-size="15" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">owned, dated, and scoped</text>
  <text x="600" y="486" font-size="15" fill="#2B6CB0" font-family="Arial, sans-serif" text-anchor="middle">Next: start what is safe; the waiting</text>
  <text x="600" y="508" font-size="15" fill="#2B6CB0" font-family="Arial, sans-serif" text-anchor="middle">testing is named in the record</text>

  <g filter="url(#sh2)"><rect x="810" y="348" width="330" height="170" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g>
  <text x="975" y="396" font-size="22" fill="#1A202C" text-anchor="middle">Not Ready</text>
  <text x="975" y="428" font-size="15" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">A failing domain would corrupt the</text>
  <text x="975" y="452" font-size="15" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">results themselves — access, data, scope</text>
  <text x="975" y="486" font-size="15" fill="#2B6CB0" font-family="Arial, sans-serif" text-anchor="middle">Next: move the start — the sponsor</text>
  <text x="975" y="508" font-size="15" fill="#2B6CB0" font-family="Arial, sans-serif" text-anchor="middle">owns the date and the decision</text>

  <text x="60" y="580" font-size="16" fill="#1A202C">Not ready must stay a real option</text>
  <text x="60" y="608" font-size="15" fill="#475569" font-family="Arial, sans-serif">If a delay is never possible, readiness is a ceremony, not a check. Every outcome is recorded with owners and dates.</text>
  <text x="60" y="634" font-size="15" fill="#64748B" font-family="Arial, sans-serif">Conditions pass to the risk register, so they are reviewed until they close — not forgotten once testing begins.</text>
</svg>
