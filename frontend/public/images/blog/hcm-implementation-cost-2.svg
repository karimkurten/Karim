<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Arial, Helvetica, sans-serif">
<defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient></defs>
<rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="72" fill="url(#hdr)"/>
<text x="40" y="45" font-size="26" font-weight="bold" fill="#ffffff">Building a budget that survives delivery: five moves</text>
<text x="40" y="105" font-size="15" fill="#64748B">From a single early number to a driver-based budget the steering committee can actually govern.</text>
<rect x="30" y="130" width="1140" height="100" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="54" y="166" font-size="16" font-weight="bold" fill="#1A202C">1. Start from scope, not a number</text><text x="54" y="192" font-size="13" fill="#475569">List modules, populations, countries, integrations and history first. Cost follows scope; a budget set</text><text x="54" y="212" font-size="13" fill="#475569">before scope is fiction.</text><rect x="30" y="245" width="1140" height="100" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="54" y="281" font-size="16" font-weight="bold" fill="#1A202C">2. Price each family by its driver</text><text x="54" y="307" font-size="13" fill="#475569">Subscription from the agreement, services from effort, integrations per system, data from quality and</text><text x="54" y="327" font-size="13" fill="#475569">history, change from populations.</text><rect x="30" y="360" width="1140" height="100" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="54" y="396" font-size="16" font-weight="bold" fill="#1A202C">3. Cost internal time honestly</text><text x="54" y="422" font-size="13" fill="#475569">Expert hours, backfill and operational cover are real costs even when no invoice arrives. Show them as their</text><text x="54" y="442" font-size="13" fill="#475569">own line.</text><rect x="30" y="475" width="1140" height="100" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="54" y="511" font-size="16" font-weight="bold" fill="#1A202C">4. Hold contingency against named risks</text><text x="54" y="537" font-size="13" fill="#475569">Tie contingency to specific risks — data quality, integration unknowns, decision delays — and release it</text><text x="54" y="557" font-size="13" fill="#475569">only when those risks retire.</text><rect x="30" y="590" width="1140" height="100" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="54" y="626" font-size="16" font-weight="bold" fill="#1A202C">5. Re-forecast at every phase gate</text><text x="54" y="652" font-size="13" fill="#475569">Compare actual effort and remaining drivers at each gate. A budget reviewed only at the end is a report, not</text><text x="54" y="672" font-size="13" fill="#475569">a control.</text></svg>