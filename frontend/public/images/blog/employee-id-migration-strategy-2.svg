<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1020" role="img" aria-label="Decision flowchart: four yes-or-no questions resolve every employee ID collision — rehire merges, overlapping series, cross-border overlap, and contingent workers.">
  <defs>
    <filter id="ds2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="panel2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#F0F4F8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="820" height="1020" fill="#ffffff"/>
  <text x="40" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1A202C">Collision resolution decision flow</text>
  <text x="40" y="80" font-family="Arial, sans-serif" font-size="15" fill="#64748B">Answer each question once per record type — the rule replaces judgment calls during the load.</text>

  <!-- Start panel -->
  <g filter="url(#ds2)">
    <rect x="180" y="104" width="300" height="58" rx="10" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="180" y="104" width="6" height="58" fill="#2B6CB0"/>
    <text x="330" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Record arrives with an ID</text>
  </g>
  <g stroke="#2B6CB0" stroke-width="2" fill="none">
    <line x1="330" y1="162" x2="330" y2="192"/><polygon points="330,192 322,180 338,180" fill="#2B6CB0" stroke="none"/>
  </g>

  <!-- Diamond 1 -->
  <g filter="url(#ds2)">
    <polygon points="330,192 500,252 330,312 160,252" fill="#2B6CB0"/>
    <text x="330" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Same person,</text>
    <text x="330" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">two IDs?</text>
  </g>
  <text x="420" y="222" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2B6CB0">Yes</text>
  <text x="344" y="330" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2B6CB0">No</text>
  <g filter="url(#ds2)">
    <rect x="520" y="214" width="260" height="76" rx="8" fill="url(#panel2)" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="650" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Merge rule: which ID survives,</text>
    <text x="650" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">history carried on the survivor</text>
  </g>
  <g stroke="#2B6CB0" stroke-width="2" fill="none">
    <line x1="500" y1="252" x2="520" y2="252"/>
    <line x1="330" y1="312" x2="330" y2="342"/><polygon points="330,342 322,330 338,330" fill="#2B6CB0" stroke="none"/>
  </g>

  <!-- Diamond 2 -->
  <g filter="url(#ds2)">
    <polygon points="330,342 500,402 330,462 160,402" fill="#2B6CB0"/>
    <text x="330" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Overlapping series</text>
    <text x="330" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">across sources?</text>
  </g>
  <text x="420" y="372" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2B6CB0">Yes</text>
  <text x="344" y="480" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2B6CB0">No</text>
  <g filter="url(#ds2)">
    <rect x="520" y="364" width="260" height="76" rx="8" fill="url(#panel2)" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="650" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Source prefix, or generation</text>
    <text x="650" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">with source distinction</text>
  </g>
  <g stroke="#2B6CB0" stroke-width="2" fill="none">
    <line x1="500" y1="402" x2="520" y2="402"/>
    <line x1="330" y1="462" x2="330" y2="492"/><polygon points="330,492 322,480 338,480" fill="#2B6CB0" stroke="none"/>
  </g>

  <!-- Diamond 3 -->
  <g filter="url(#ds2)">
    <polygon points="330,492 500,552 330,612 160,552" fill="#2B6CB0"/>
    <text x="330" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Cross-border</text>
    <text x="330" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">ID overlap?</text>
  </g>
  <text x="420" y="522" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2B6CB0">Yes</text>
  <text x="344" y="630" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2B6CB0">No</text>
  <g filter="url(#ds2)">
    <rect x="520" y="514" width="260" height="76" rx="8" fill="url(#panel2)" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="650" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Country prefix or series partition,</text>
    <text x="650" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">tested on both datasets</text>
  </g>
  <g stroke="#2B6CB0" stroke-width="2" fill="none">
    <line x1="500" y1="552" x2="520" y2="552"/>
    <line x1="330" y1="612" x2="330" y2="642"/><polygon points="330,642 322,630 338,630" fill="#2B6CB0" stroke="none"/>
  </g>

  <!-- Diamond 4 -->
  <g filter="url(#ds2)">
    <polygon points="330,642 500,702 330,762 160,702" fill="#2B6CB0"/>
    <text x="330" y="698" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Contingent</text>
    <text x="330" y="720" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">worker?</text>
  </g>
  <text x="420" y="672" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2B6CB0">Yes</text>
  <text x="344" y="780" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2B6CB0">No</text>
  <g filter="url(#ds2)">
    <rect x="520" y="664" width="260" height="76" rx="8" fill="url(#panel2)" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="650" y="692" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Separate series,</text>
    <text x="650" y="712" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">flagged population</text>
  </g>
  <g stroke="#2B6CB0" stroke-width="2" fill="none">
    <line x1="500" y1="702" x2="520" y2="702"/>
    <line x1="330" y1="762" x2="330" y2="792"/><polygon points="330,792 322,780 338,780" fill="#2B6CB0" stroke="none"/>
  </g>

  <!-- Terminal -->
  <g filter="url(#ds2)">
    <rect x="180" y="792" width="300" height="58" rx="10" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="330" y="827" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1A202C">Load with the target ID</text>
  </g>
  <text x="330" y="872" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#64748B">National identifiers stay protected attributes — never the join key.</text>

  <text x="40" y="990" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="#64748B">Every collision gets a rule — never a judgment call during the load.</text>
</svg>
