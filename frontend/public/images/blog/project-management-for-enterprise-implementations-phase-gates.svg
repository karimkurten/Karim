<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Eight implementation phases with a gate review between each phase, from kickoff to stable operations">
  <rect width="1200" height="560" fill="#F4F6F8"/>
  <text x="600" y="52" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#16294A">Eight Phases, Seven Gates</text>
  <text x="600" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#5A6C7D">Nobody enters the next phase without passing the gate — that is what makes a plan real</text>

  <!-- Timeline line -->
  <line x1="60" y1="330" x2="1140" y2="330" stroke="#2B6CB0" stroke-width="4"/>

  <!-- Phase boxes (x, width, title, subtitle, gate after) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="60" y="180" width="118" height="110" rx="10" fill="#16294A"/>
    <text x="119" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">1. Initiate</text>
    <text x="119" y="244" text-anchor="middle" font-size="12" fill="#BCD0E8">charter &amp; case</text>
    <polygon points="216,318 228,330 216,342 204,330" fill="#E8A33D"/>
    <text x="216" y="372" text-anchor="middle" font-size="11" font-weight="700" fill="#16294A">Case approved</text>

    <rect x="254" y="180" width="118" height="110" rx="10" fill="#2B6CB0"/>
    <text x="313" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">2. Plan</text>
    <text x="313" y="244" text-anchor="middle" font-size="12" fill="#D7E5F5">WBS &amp; baseline</text>
    <polygon points="410,318 422,330 410,342 398,330" fill="#E8A33D"/>
    <text x="410" y="372" text-anchor="middle" font-size="11" font-weight="700" fill="#16294A">Plan baselined</text>

    <rect x="448" y="180" width="118" height="110" rx="10" fill="#2B6CB0"/>
    <text x="507" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">3. Design</text>
    <text x="507" y="236" text-anchor="middle" font-size="12" fill="#D7E5F5">discover &amp;</text>
    <text x="507" y="252" text-anchor="middle" font-size="12" fill="#D7E5F5">configure plan</text>
    <polygon points="604,318 616,330 604,342 592,330" fill="#E8A33D"/>
    <text x="604" y="372" text-anchor="middle" font-size="11" font-weight="700" fill="#16294A">Design signed off</text>

    <rect x="642" y="180" width="118" height="110" rx="10" fill="#2B6CB0"/>
    <text x="701" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">4. Build</text>
    <text x="701" y="236" text-anchor="middle" font-size="12" fill="#D7E5F5">configure &amp;</text>
    <text x="701" y="252" text-anchor="middle" font-size="12" fill="#D7E5F5">migrate</text>
    <polygon points="798,318 810,330 798,342 786,330" fill="#E8A33D"/>
    <text x="798" y="372" text-anchor="middle" font-size="11" font-weight="700" fill="#16294A">Data reconciled</text>

    <rect x="836" y="180" width="118" height="110" rx="10" fill="#2B6CB0"/>
    <text x="895" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">5. Validate</text>
    <text x="895" y="236" text-anchor="middle" font-size="12" fill="#D7E5F5">test &amp; UAT</text>
    <text x="895" y="252" text-anchor="middle" font-size="12" fill="#D7E5F5">sign-off</text>
    <polygon points="992,318 1004,330 992,342 980,330" fill="#E8A33D"/>
    <text x="992" y="372" text-anchor="middle" font-size="11" font-weight="700" fill="#16294A">Fit for purpose</text>

    <rect x="1030" y="180" width="110" height="110" rx="10" fill="#2B6CB0"/>
    <text x="1085" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">6. Deploy</text>
    <text x="1085" y="236" text-anchor="middle" font-size="12" fill="#D7E5F5">cutover &amp;</text>
    <text x="1085" y="252" text-anchor="middle" font-size="12" fill="#D7E5F5">go-live</text>
  </g>

  <!-- Lower row: 7, 8 + legend -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="420" y="420" width="160" height="90" rx="10" fill="#2B6CB0"/>
    <text x="500" y="456" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">7. Stabilize</text>
    <text x="500" y="478" text-anchor="middle" font-size="12" fill="#D7E5F5">hypercare &amp; issues</text>
    <rect x="620" y="420" width="160" height="90" rx="10" fill="#16294A"/>
    <text x="700" y="456" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">8. Close</text>
    <text x="700" y="478" text-anchor="middle" font-size="12" fill="#BCD0E8">transition &amp; lessons</text>

    <text x="120" y="455" font-size="15" fill="#16294A"><tspan font-weight="700">Gate rule:</tspan> entry criteria to enter, exit criteria to leave.</text>
    <text x="120" y="480" font-size="15" fill="#5A6C7D">A phase is not "80% done". It is gated or it is not.</text>
    <text x="870" y="455" font-size="15" fill="#16294A"><tspan font-weight="700">Each gate</tspan> is a sponsor decision:</text>
    <text x="870" y="480" font-size="15" fill="#5A6C7D">proceed, remediate, or stop.</text>
  </g>
</svg>
