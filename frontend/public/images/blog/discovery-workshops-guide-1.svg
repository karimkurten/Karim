<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
  <rect width="1200" height="440" fill="#ffffff"/>
  <text x="600" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#1e3a5f">Half-Day Discovery Workshop Agenda</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- Block 1 -->
    <rect x="40" y="100" width="250" height="240" rx="12" fill="#1e3a5f"/>
    <text x="165" y="185" text-anchor="middle" font-size="23" font-weight="bold" fill="#ffffff">
      <tspan x="165" dy="0">Current-state</tspan><tspan x="165" dy="32">walkthrough</tspan>
    </text>
    <rect x="95" y="268" width="140" height="46" rx="8" fill="#f59e0b"/>
    <text x="165" y="299" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e3a5f">60 min</text>

    <!-- Arrow 1 -->
    <polygon points="300,202 322,220 300,238" fill="#f59e0b"/>

    <!-- Block 2 -->
    <rect x="325" y="100" width="250" height="240" rx="12" fill="#1e3a5f"/>
    <text x="450" y="185" text-anchor="middle" font-size="23" font-weight="bold" fill="#ffffff">
      <tspan x="450" dy="0">Pain points</tspan><tspan x="450" dy="32">&amp; workarounds</tspan>
    </text>
    <rect x="380" y="268" width="140" height="46" rx="8" fill="#f59e0b"/>
    <text x="450" y="299" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e3a5f">30 min</text>

    <!-- Arrow 2 -->
    <polygon points="585,202 607,220 585,238" fill="#f59e0b"/>

    <!-- Block 3 -->
    <rect x="610" y="100" width="250" height="240" rx="12" fill="#1e3a5f"/>
    <text x="735" y="185" text-anchor="middle" font-size="23" font-weight="bold" fill="#ffffff">
      <tspan x="735" dy="0">Future-state</tspan><tspan x="735" dy="32">needs</tspan>
    </text>
    <rect x="665" y="268" width="140" height="46" rx="8" fill="#f59e0b"/>
    <text x="735" y="299" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e3a5f">60 min</text>

    <!-- Arrow 3 -->
    <polygon points="870,202 892,220 870,238" fill="#f59e0b"/>

    <!-- Block 4 -->
    <rect x="895" y="100" width="250" height="240" rx="12" fill="#1e3a5f"/>
    <text x="1020" y="185" text-anchor="middle" font-size="23" font-weight="bold" fill="#ffffff">
      <tspan x="1020" dy="0">Decisions</tspan><tspan x="1020" dy="32">&amp; parking lot</tspan>
    </text>
    <rect x="950" y="268" width="140" height="46" rx="8" fill="#f59e0b"/>
    <text x="1020" y="299" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e3a5f">30 min</text>
  </g>

  <text x="600" y="400" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-style="italic" fill="#1e3a5f">Timebox each block — a workshop that runs over teaches participants the schedule is decorative.</text>
</svg>
