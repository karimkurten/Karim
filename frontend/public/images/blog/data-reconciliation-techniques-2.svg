<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780" role="img" aria-label="Variance triage decision flow">
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0F4F8"/>
    </linearGradient>
    <filter id="soft2" x="-8%" y="-20%" width="116%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2B6CB0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="780" fill="#F0F4F8"/>
  <g filter="url(#soft2)">
    <rect x="350" y="40" width="200" height="54" rx="10" fill="url(#boxGrad)" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="350" y="40" width="8" height="54" rx="4" fill="#2B6CB0"/>
    <text x="454" y="73" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#1A202C">Variance found</text>
    <polygon points="450,150 560,200 450,250 340,200" fill="url(#boxGrad)" stroke="#2B6CB0" stroke-width="2"/>
    <text x="450" y="207" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1A202C">Within tolerance?</text>
    <rect x="90" y="290" width="200" height="54" rx="10" fill="url(#boxGrad)" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="90" y="290" width="8" height="54" rx="4" fill="#2B6CB0"/>
    <text x="194" y="323" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1A202C">Document as expected</text>
    <rect x="90" y="390" width="200" height="54" rx="10" fill="url(#boxGrad)" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="90" y="390" width="8" height="54" rx="4" fill="#2B6CB0"/>
    <text x="194" y="423" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1A202C">Accept load</text>
    <rect x="610" y="290" width="200" height="54" rx="10" fill="url(#boxGrad)" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="610" y="290" width="8" height="54" rx="4" fill="#2B6CB0"/>
    <text x="714" y="323" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1A202C">Investigate root cause</text>
    <rect x="610" y="390" width="200" height="64" rx="10" fill="url(#boxGrad)" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="610" y="390" width="8" height="64" rx="4" fill="#2B6CB0"/>
    <text x="714" y="416" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1A202C">Source, mapping, or</text>
    <text x="714" y="436" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1A202C">transform issue?</text>
    <rect x="610" y="490" width="200" height="54" rx="10" fill="url(#boxGrad)" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="610" y="490" width="8" height="54" rx="4" fill="#2B6CB0"/>
    <text x="714" y="523" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#1A202C">Fix and reload</text>
    <rect x="610" y="590" width="200" height="64" rx="10" fill="url(#boxGrad)" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="610" y="590" width="8" height="64" rx="4" fill="#2B6CB0"/>
    <text x="714" y="616" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1A202C">Re-run full</text>
    <text x="714" y="636" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#1A202C">reconciliation battery</text>
    <rect x="320" y="700" width="260" height="54" rx="10" fill="#2B6CB0" stroke="#2B6CB0" stroke-width="2"/>
    <text x="450" y="733" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Sign off — per load, in writing</text>
  </g>
  <g stroke="#2B6CB0" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="450" y1="94" x2="450" y2="148"/>
    <polyline points="340,200 190,200 190,288"/>
    <polyline points="560,200 710,200 710,288"/>
    <line x1="190" y1="344" x2="190" y2="388"/>
    <line x1="710" y1="344" x2="710" y2="388"/>
    <line x1="710" y1="454" x2="710" y2="488"/>
    <line x1="710" y1="544" x2="710" y2="588"/>
    <polyline points="710,654 710,727 582,727"/>
  </g>
  <text x="255" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2B6CB0">Yes</text>
  <text x="632" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#2B6CB0">No</text>
</svg>
