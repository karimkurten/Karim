<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Georgia, 'DM Serif Display', serif">
  <defs>
    <linearGradient id="hdr2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <filter id="sh2" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2B6CB0"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="104" fill="url(#hdr2)"/>
  <text x="60" y="48" font-size="30" fill="#ffffff">The Triage Decision Flow</text>
  <text x="60" y="80" font-size="17" fill="#94A3B8" font-family="Arial, sans-serif">Every defect follows the same path, in the same order — no step is skipped</text>

  <g filter="url(#sh2)"><rect x="40" y="150" width="200" height="130" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g>
  <text x="140" y="195" font-size="21" fill="#1A202C" text-anchor="middle">1. Reproduce</text>
  <text x="140" y="226" font-size="14" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">Same script, data,</text>
  <text x="140" y="248" font-size="14" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">and steps — result repeats</text>

  <g filter="url(#sh2)"><rect x="272" y="150" width="200" height="130" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g>
  <text x="372" y="195" font-size="21" fill="#1A202C" text-anchor="middle">2. Confirm</text>
  <text x="372" y="226" font-size="14" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">Behaviour checked against</text>
  <text x="372" y="248" font-size="14" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">requirement and design</text>

  <g filter="url(#sh2)"><rect x="504" y="150" width="200" height="130" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g>
  <text x="604" y="195" font-size="21" fill="#1A202C" text-anchor="middle">3. Severity</text>
  <text x="604" y="226" font-size="14" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">Impact and workaround,</text>
  <text x="604" y="248" font-size="14" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">from the severity model</text>

  <g filter="url(#sh2)"><rect x="736" y="150" width="200" height="130" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g>
  <text x="836" y="195" font-size="21" fill="#1A202C" text-anchor="middle">4. Priority</text>
  <text x="836" y="226" font-size="14" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">Timing, dependencies,</text>
  <text x="836" y="248" font-size="14" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">and remaining calendar</text>

  <g filter="url(#sh2)"><rect x="968" y="150" width="200" height="130" rx="12" fill="#1e3a5f"/></g>
  <text x="1068" y="195" font-size="21" fill="#ffffff" text-anchor="middle">5. Decide</text>
  <text x="1068" y="226" font-size="14" fill="#E2E8F0" font-family="Arial, sans-serif" text-anchor="middle">One decision, a named</text>
  <text x="1068" y="248" font-size="14" fill="#E2E8F0" font-family="Arial, sans-serif" text-anchor="middle">owner, and a next step</text>

  <line x1="240" y1="215" x2="270" y2="215" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="472" y1="215" x2="502" y2="215" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="704" y1="215" x2="734" y2="215" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="936" y1="215" x2="966" y2="215" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>

  <path d="M140 282 L140 330 L1068 330 L1068 284" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  <text x="604" y="322" font-size="15" fill="#64748B" font-family="Arial, sans-serif" text-anchor="middle">Cannot reproduce — return for more evidence: script, step, data, screenshot</text>

  <line x1="1068" y1="360" x2="1068" y2="392" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>

  <g filter="url(#sh2)"><rect x="60" y="400" width="330" height="150" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/></g>
  <text x="225" y="448" font-size="22" fill="#1A202C" text-anchor="middle">Fix Now</text>
  <text x="225" y="480" font-size="15" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">Named owner and fix date;</text>
  <text x="225" y="504" font-size="15" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">closes only after retest passes</text>

  <g filter="url(#sh2)"><rect x="435" y="400" width="330" height="150" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g>
  <text x="600" y="448" font-size="22" fill="#1A202C" text-anchor="middle">Defer With Workaround</text>
  <text x="600" y="480" font-size="15" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">Tested workaround, named owner,</text>
  <text x="600" y="504" font-size="15" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">fix date, written risk acceptance</text>

  <g filter="url(#sh2)"><rect x="810" y="400" width="330" height="150" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g>
  <text x="975" y="448" font-size="22" fill="#1A202C" text-anchor="middle">Reject With Reasons</text>
  <text x="975" y="480" font-size="15" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">Not a defect — a design question</text>
  <text x="975" y="504" font-size="15" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">or change request, routed onward</text>

  <line x1="1068" y1="394" x2="225" y2="394" stroke="#2B6CB0" stroke-width="0"/>
  <path d="M1068 394 L225 394" fill="none" stroke="#2B6CB0" stroke-width="2"/>
  <line x1="225" y1="394" x2="225" y2="398" stroke="#2B6CB0" stroke-width="2"/>
  <line x1="600" y1="394" x2="600" y2="398" stroke="#2B6CB0" stroke-width="2"/>
  <line x1="975" y1="394" x2="975" y2="398" stroke="#2B6CB0" stroke-width="2"/>

  <text x="60" y="610" font-size="16" fill="#1A202C">Go-live gate reminder</text>
  <text x="60" y="638" font-size="15" fill="#475569" font-family="Arial, sans-serif">No critical defects open at sign-off. Deferred defects live on the risk register until fixed and retested.</text>
  <text x="60" y="664" font-size="15" fill="#64748B" font-family="Arial, sans-serif">Every defect leaves triage with a decision, an owner, and a next step.</text>
</svg>
