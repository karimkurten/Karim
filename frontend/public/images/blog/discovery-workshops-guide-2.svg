<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
  <defs>
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>
  <rect width="1200" height="470" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#1e3a5f">Workshop Series Sequence</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- Row 1 -->
    <g>
      <polygon points="60,110 350,110 390,165 350,220 60,220 100,165" fill="#1e3a5f"/>
      <circle cx="140" cy="165" r="27" fill="#f59e0b"/>
      <text x="140" y="174" text-anchor="middle" font-size="25" font-weight="bold" fill="#1e3a5f">1</text>
      <text x="262" y="174" text-anchor="middle" font-size="23" font-weight="bold" fill="#ffffff">Core HR</text>
      <polygon points="404,148 428,165 404,182" fill="#f59e0b"/>

      <polygon points="440,110 730,110 770,165 730,220 440,220 480,165" fill="#1e3a5f"/>
      <circle cx="520" cy="165" r="27" fill="#f59e0b"/>
      <text x="520" y="174" text-anchor="middle" font-size="25" font-weight="bold" fill="#1e3a5f">2</text>
      <text x="645" y="174" text-anchor="middle" font-size="23" font-weight="bold" fill="#ffffff">Payroll</text>
      <polygon points="784,148 808,165 784,182" fill="#f59e0b"/>

      <polygon points="820,110 1110,110 1150,165 1110,220 820,220 860,165" fill="#1e3a5f"/>
      <circle cx="900" cy="165" r="27" fill="#f59e0b"/>
      <text x="900" y="174" text-anchor="middle" font-size="25" font-weight="bold" fill="#1e3a5f">3</text>
      <text x="1030" y="165" text-anchor="middle" font-size="21" font-weight="bold" fill="#ffffff">
        <tspan x="1030" dy="-12">Time &amp;</tspan><tspan x="1030" dy="28">Attendance</tspan>
      </text>
    </g>

    <!-- Connector: end of row 1 down to start of row 2 -->
    <path d="M 1160 230 C 1190 300, 180 290, 60 320" stroke="#f59e0b" stroke-width="6" fill="none" marker-end="url(#arrowHead)"/>

    <!-- Row 2 -->
    <g>
      <polygon points="60,280 350,280 390,335 350,390 60,390 100,335" fill="#1e3a5f"/>
      <circle cx="140" cy="335" r="27" fill="#f59e0b"/>
      <text x="140" y="344" text-anchor="middle" font-size="25" font-weight="bold" fill="#1e3a5f">4</text>
      <text x="262" y="335" text-anchor="middle" font-size="21" font-weight="bold" fill="#ffffff">
        <tspan x="262" dy="-12">Benefits</tspan><tspan x="262" dy="28">&amp; Leave</tspan>
      </text>
      <polygon points="404,318 428,335 404,352" fill="#f59e0b"/>

      <polygon points="440,280 730,280 770,335 730,390 440,390 480,335" fill="#1e3a5f"/>
      <circle cx="520" cy="335" r="27" fill="#f59e0b"/>
      <text x="520" y="344" text-anchor="middle" font-size="25" font-weight="bold" fill="#1e3a5f">5</text>
      <text x="645" y="335" text-anchor="middle" font-size="21" font-weight="bold" fill="#ffffff">
        <tspan x="645" dy="-12">Talent</tspan><tspan x="645" dy="28">Modules</tspan>
      </text>
      <polygon points="784,318 808,335 784,352" fill="#f59e0b"/>

      <polygon points="820,280 1110,280 1150,335 1110,390 820,390 860,335" fill="#1e3a5f"/>
      <circle cx="900" cy="335" r="27" fill="#f59e0b"/>
      <text x="900" y="344" text-anchor="middle" font-size="25" font-weight="bold" fill="#1e3a5f">6</text>
      <text x="1035" y="335" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">
        <tspan x="1035" dy="-12">Integrations</tspan><tspan x="1035" dy="28">&amp; Reporting</tspan>
      </text>
    </g>
  </g>

  <text x="600" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-style="italic" fill="#1e3a5f">Run by process area, not org chart.</text>
</svg>
