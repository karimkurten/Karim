<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="Decision flow for history tiering">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0F4F8"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2B6CB0"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2B6CB0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="540" rx="14" fill="url(#panel)" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Top question box -->
  <g filter="url(#soft)">
    <rect x="300" y="24" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="2.5"/>
    <rect x="300" y="24" width="300" height="10" rx="5" fill="url(#accentBar)"/>
  </g>
  <text x="450" y="59" text-anchor="middle" font-family="Georgia, 'DM Serif Display', serif" font-size="19" font-weight="bold" fill="#1A202C">Who needs the history?</text>

  <!-- Bus from question to drivers -->
  <line x1="450" y1="80" x2="450" y2="106" stroke="#2B6CB0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="110" y1="106" x2="791" y2="106" stroke="#2B6CB0" stroke-width="2.5"/>
  <line x1="110" y1="106" x2="110" y2="122" stroke="#2B6CB0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="337" y1="106" x2="337" y2="122" stroke="#2B6CB0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="564" y1="106" x2="564" y2="122" stroke="#2B6CB0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="791" y1="106" x2="791" y2="122" stroke="#2B6CB0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Driver boxes -->
  <g filter="url(#soft)">
    <rect x="10" y="122" width="200" height="66" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="237" y="122" width="200" height="66" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="464" y="122" width="200" height="66" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="691" y="122" width="200" height="66" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  </g>
  <g font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#475569" text-anchor="middle">
    <text x="110" y="150"><tspan x="110" dy="0">Audit and year-end</tspan><tspan x="110" dy="20">reporting</tspan></text>
    <text x="337" y="150"><tspan x="337" dy="0">Statutory retention</tspan><tspan x="337" dy="20">policy</tspan></text>
    <text x="564" y="160">Employee self-service</text>
    <text x="791" y="160">Analytics baseline</text>
  </g>

  <!-- Bus from drivers to tiers -->
  <line x1="110" y1="188" x2="110" y2="212" stroke="#2B6CB0" stroke-width="2.5"/>
  <line x1="337" y1="188" x2="337" y2="212" stroke="#2B6CB0" stroke-width="2.5"/>
  <line x1="564" y1="188" x2="564" y2="212" stroke="#2B6CB0" stroke-width="2.5"/>
  <line x1="791" y1="188" x2="791" y2="212" stroke="#2B6CB0" stroke-width="2.5"/>
  <line x1="156" y1="212" x2="744" y2="212" stroke="#2B6CB0" stroke-width="2.5"/>
  <line x1="156" y1="212" x2="156" y2="244" stroke="#2B6CB0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="212" x2="450" y2="244" stroke="#2B6CB0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="744" y1="212" x2="744" y2="244" stroke="#2B6CB0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Tier container -->
  <rect x="10" y="244" width="880" height="262" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  <g filter="url(#soft)">
    <rect x="30" y="272" width="260" height="196" rx="10" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="2"/>
    <rect x="320" y="272" width="260" height="196" rx="10" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="2"/>
    <rect x="610" y="272" width="260" height="196" rx="10" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="2"/>
  </g>
  <g>
    <rect x="30" y="272" width="260" height="12" rx="6" fill="url(#accentBar)"/>
    <rect x="320" y="272" width="260" height="12" rx="6" fill="url(#accentBar)"/>
    <rect x="610" y="272" width="260" height="12" rx="6" fill="url(#accentBar)"/>
  </g>
  <!-- Tier depth bars: visual depth, no extra text -->
  <g>
    <rect x="60" y="330" width="200" height="26" rx="6" fill="#2B6CB0" opacity="0.9"/>
    <rect x="60" y="362" width="200" height="26" rx="6" fill="#2B6CB0" opacity="0.9"/>
    <rect x="60" y="394" width="200" height="26" rx="6" fill="#2B6CB0" opacity="0.9"/>
    <rect x="350" y="346" width="200" height="26" rx="6" fill="#2B6CB0" opacity="0.5"/>
    <rect x="350" y="378" width="200" height="26" rx="6" fill="#2B6CB0" opacity="0.5"/>
    <rect x="640" y="362" width="200" height="26" rx="6" fill="#2B6CB0" opacity="0.22"/>
  </g>
  <g font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14.5" font-weight="600" fill="#1A202C" text-anchor="middle">
    <text x="160" y="310">Full detail — last 2 years</text>
    <text x="450" y="310">Summarized balances — years 3–6</text>
    <text x="740" y="310">Read-only archive — everything older</text>
  </g>
</svg>
