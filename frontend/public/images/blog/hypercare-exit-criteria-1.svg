<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="Hypercare exit criteria framework: five evidence domains covering defect state, business cycle proven, support readiness and knowledge transfer, adoption and user confidence, and backlog and ownership handover">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="780" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="92" fill="url(#hdr)"/>
  <text x="48" y="46" font-family="Georgia, serif" font-size="30" fill="#ffffff">Hypercare Exit: Five Evidence Domains</text>
  <text x="48" y="74" font-family="Arial, sans-serif" font-size="16" fill="#94A3B8">Exit is earned domain by domain — every domain shows evidence, not an opinion</text>

  <g>
    <rect x="40" y="124" width="1120" height="108" rx="12" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="2"/>
    <text x="64" y="160" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Domain 1 · Defect State</text>
    <text x="64" y="188" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">No process-stopping defects open; open items are minor,</text>
    <text x="64" y="212" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">workarounded, and honestly described</text>
    <text x="830" y="160" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Evidence:</text>
    <text x="830" y="188" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Triage log, severity mix</text>
    <text x="830" y="212" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">reviewed and stable</text>
  </g>
  <g>
    <rect x="40" y="246" width="1120" height="108" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="64" y="282" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Domain 2 · Business Cycle Proven</text>
    <text x="64" y="310" font-family="Arial, sans-serif" font-size="14" fill="#475569">A full pay cycle and the period tasks around it have</text>
    <text x="64" y="334" font-family="Arial, sans-serif" font-size="14" fill="#475569">run live, owned by the business, not the project</text>
    <text x="830" y="282" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A202C">Evidence:</text>
    <text x="830" y="310" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Cycle completed, checks</text>
    <text x="830" y="334" font-family="Arial, sans-serif" font-size="14" fill="#64748B">signed off by owners</text>
  </g>
  <g>
    <rect x="40" y="368" width="1120" height="108" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="64" y="404" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Domain 3 · Support Readiness and Knowledge Transfer</text>
    <text x="64" y="432" font-family="Arial, sans-serif" font-size="14" fill="#475569">Support can receive, route, and resolve without the</text>
    <text x="64" y="456" font-family="Arial, sans-serif" font-size="14" fill="#475569">project team in the room</text>
    <text x="830" y="404" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A202C">Evidence:</text>
    <text x="830" y="432" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Shadowing done, guides</text>
    <text x="830" y="456" font-family="Arial, sans-serif" font-size="14" fill="#64748B">and routes tested live</text>
  </g>
  <g>
    <rect x="40" y="490" width="1120" height="108" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
    <text x="64" y="526" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Domain 4 · Adoption and User Confidence</text>
    <text x="64" y="554" font-family="Arial, sans-serif" font-size="14" fill="#475569">Users work in the new process; questions are how-to,</text>
    <text x="64" y="578" font-family="Arial, sans-serif" font-size="14" fill="#475569">not how-do-I-survive, and workarounds are retiring</text>
    <text x="830" y="526" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A202C">Evidence:</text>
    <text x="830" y="554" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Question pattern, floor</text>
    <text x="830" y="578" font-family="Arial, sans-serif" font-size="14" fill="#64748B">feedback, super-user view</text>
  </g>
  <g>
    <rect x="40" y="612" width="1120" height="108" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="64" y="648" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Domain 5 · Backlog and Ownership Handover</text>
    <text x="64" y="676" font-family="Arial, sans-serif" font-size="14" fill="#475569">Every remaining item has a named owner, a priority,</text>
    <text x="64" y="700" font-family="Arial, sans-serif" font-size="14" fill="#475569">and a home in business-as-usual governance</text>
    <text x="830" y="648" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A202C">Evidence:</text>
    <text x="830" y="676" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Backlog accepted item</text>
    <text x="830" y="700" font-family="Arial, sans-serif" font-size="14" fill="#64748B">by item, owners named</text>
  </g>
  <text x="48" y="752" font-family="Arial, sans-serif" font-size="14" fill="#64748B">One weak domain holds the exit — strengthen it, step cover down, and review again.</text>
</svg>
