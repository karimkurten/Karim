<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="The PM's go-live arc across five phases, each with the command responsibility the project manager personally carries">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2B6CB0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="92" fill="url(#hdr)"/>
  <text x="48" y="46" font-family="Georgia, serif" font-size="30" fill="#ffffff">The PM's Go-Live Arc</text>
  <text x="48" y="74" font-family="Arial, sans-serif" font-size="16" fill="#94A3B8">Five phases — and the command responsibility the project manager personally carries in each</text>

  <!-- phase 1 -->
  <g>
    <rect x="40" y="140" width="204" height="360" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="60" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">1 · Readiness</text>
    <text x="60" y="216" font-family="Arial, sans-serif" font-size="13" fill="#475569">Confirms decision</text>
    <text x="60" y="238" font-family="Arial, sans-serif" font-size="13" fill="#475569">rights, criteria and</text>
    <text x="60" y="260" font-family="Arial, sans-serif" font-size="13" fill="#475569">the freeze point</text>
    <text x="60" y="296" font-family="Arial, sans-serif" font-size="13" fill="#475569">Builds the decision</text>
    <text x="60" y="318" font-family="Arial, sans-serif" font-size="13" fill="#475569">on evidence, not</text>
    <text x="60" y="340" font-family="Arial, sans-serif" font-size="13" fill="#475569">status reporting</text>
    <text x="60" y="392" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1A202C">PM owns:</text>
    <text x="60" y="418" font-family="Arial, sans-serif" font-size="13" fill="#64748B">The preparation</text>
    <text x="60" y="440" font-family="Arial, sans-serif" font-size="13" fill="#64748B">and its verdict</text>
  </g>
  <path d="M 248 320 L 258 320" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>

  <!-- phase 2 -->
  <g>
    <rect x="262" y="140" width="204" height="360" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="282" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">2 · The Decision</text>
    <text x="282" y="216" font-family="Arial, sans-serif" font-size="13" fill="#475569">Chairs the go/no-go</text>
    <text x="282" y="238" font-family="Arial, sans-serif" font-size="13" fill="#475569">on pre-agreed</text>
    <text x="282" y="260" font-family="Arial, sans-serif" font-size="13" fill="#475569">criteria</text>
    <text x="282" y="296" font-family="Arial, sans-serif" font-size="13" fill="#475569">Records conditions</text>
    <text x="282" y="318" font-family="Arial, sans-serif" font-size="13" fill="#475569">and dissent, confirms</text>
    <text x="282" y="340" font-family="Arial, sans-serif" font-size="13" fill="#475569">the rollback point</text>
    <text x="282" y="392" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1A202C">PM owns:</text>
    <text x="282" y="418" font-family="Arial, sans-serif" font-size="13" fill="#64748B">The decision</text>
    <text x="282" y="440" font-family="Arial, sans-serif" font-size="13" fill="#64748B">record</text>
  </g>
  <path d="M 470 320 L 480 320" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>

  <!-- phase 3 -->
  <g>
    <rect x="484" y="140" width="204" height="360" rx="12" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="2"/>
    <text x="504" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff">3 · Cutover Weekend</text>
    <text x="504" y="216" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">Runs checkpoints,</text>
    <text x="504" y="238" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">one issue log and</text>
    <text x="504" y="260" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">scheduled updates</text>
    <text x="504" y="296" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">Triages by impact,</text>
    <text x="504" y="318" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">escalates by the</text>
    <text x="504" y="340" font-family="Arial, sans-serif" font-size="13" fill="#ffffff">agreed path</text>
    <text x="504" y="392" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">PM owns:</text>
    <text x="504" y="418" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">The rhythm of</text>
    <text x="504" y="440" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">the weekend</text>
  </g>
  <path d="M 692 320 L 702 320" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>

  <!-- phase 4 -->
  <g>
    <rect x="706" y="140" width="204" height="360" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="726" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">4 · First Live Cycle</text>
    <text x="726" y="216" font-family="Arial, sans-serif" font-size="13" fill="#475569">Stays visible through</text>
    <text x="726" y="238" font-family="Arial, sans-serif" font-size="13" fill="#475569">the first live processes</text>
    <text x="726" y="260" font-family="Arial, sans-serif" font-size="13" fill="#475569">and first pay cycle</text>
    <text x="726" y="296" font-family="Arial, sans-serif" font-size="13" fill="#475569">Chairs hypercare</text>
    <text x="726" y="318" font-family="Arial, sans-serif" font-size="13" fill="#475569">triage, prioritised</text>
    <text x="726" y="340" font-family="Arial, sans-serif" font-size="13" fill="#475569">by business impact</text>
    <text x="726" y="392" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1A202C">PM owns:</text>
    <text x="726" y="418" font-family="Arial, sans-serif" font-size="13" fill="#64748B">Presence in the</text>
    <text x="726" y="440" font-family="Arial, sans-serif" font-size="13" fill="#64748B">first live weeks</text>
  </g>
  <path d="M 914 320 L 924 320" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr)"/>

  <!-- phase 5 -->
  <g>
    <rect x="928" y="140" width="232" height="360" rx="12" fill="#ffffff" stroke="#2B6CB0" stroke-width="2"/>
    <text x="948" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">5 · Exit and Closure</text>
    <text x="948" y="216" font-family="Arial, sans-serif" font-size="13" fill="#475569">Exits hypercare against</text>
    <text x="948" y="238" font-family="Arial, sans-serif" font-size="13" fill="#475569">criteria agreed in</text>
    <text x="948" y="260" font-family="Arial, sans-serif" font-size="13" fill="#475569">advance</text>
    <text x="948" y="296" font-family="Arial, sans-serif" font-size="13" fill="#475569">Hands every open item</text>
    <text x="948" y="318" font-family="Arial, sans-serif" font-size="13" fill="#475569">to a named owner and</text>
    <text x="948" y="340" font-family="Arial, sans-serif" font-size="13" fill="#475569">closes the record</text>
    <text x="948" y="392" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1A202C">PM owns:</text>
    <text x="948" y="418" font-family="Arial, sans-serif" font-size="13" fill="#64748B">The ending — clean,</text>
    <text x="948" y="440" font-family="Arial, sans-serif" font-size="13" fill="#64748B">complete, handed over</text>
  </g>

  <rect x="40" y="540" width="1120" height="110" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="580" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A202C">The artefacts sequence the work — the project manager owns the decisions, the rhythm, and the record.</text>
  <text x="64" y="608" font-family="Arial, sans-serif" font-size="15" fill="#475569">Each phase hands the next a PM who is already in charge of it.</text>
</svg>
