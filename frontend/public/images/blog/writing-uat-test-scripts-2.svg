<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="UAT script review and approval flow: draft, peer review, business owner approval, sign-off, with revise-and-resubmit decision gates between stages">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2B6CB0"/>
    </marker>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="110" fill="url(#heroGrad)"/>
  <text x="40" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#ffffff">UAT Script Review and Approval Flow</text>
  <text x="40" y="80" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#94A3B8">Two reviews before execution. Only signed scripts enter the test cycle.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- connectors behind cards -->
    <line x1="295" y1="330" x2="289" y2="330" stroke="#2B6CB0" stroke-width="3"/>
    <line x1="346" y1="330" x2="295" y2="330" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arrowBlue)"/>

    <!-- Stage 1 -->
    <g filter="url(#cardShadow)">
      <rect x="50" y="180" width="245" height="300" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
      <text x="80" y="222" font-size="12" font-weight="bold" letter-spacing="2" fill="#2B6CB0">STAGE 1</text>
      <text x="80" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#1A202C">Draft</text>
      <line x1="80" y1="272" x2="265" y2="272" stroke="#E2E8F0" stroke-width="2"/>
      <text x="80" y="306" font-size="14.5" fill="#475569">&#10003; Plain, unambiguous</text>
      <text x="104" y="328" font-size="14.5" fill="#475569">language</text>
      <text x="80" y="362" font-size="14.5" fill="#475569">&#10003; Atomic steps,</text>
      <text x="104" y="384" font-size="14.5" fill="#475569">named test data</text>
      <text x="80" y="418" font-size="14.5" fill="#475569">&#10003; Observable</text>
      <text x="104" y="440" font-size="14.5" fill="#475569">expected results</text>
    </g>

    <!-- Diamond 1 -->
    <line x1="295" y1="330" x2="302" y2="330" stroke="#2B6CB0" stroke-width="3"/>
    <polygon points="320,290 360,330 320,370 280,330" fill="#ffffff" stroke="#2B6CB0" stroke-width="3"/>
    <line x1="360" y1="330" x2="327" y2="330" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <text x="320" y="410" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#64748B">Revise and</text>
    <text x="320" y="428" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#64748B">resubmit</text>

    <!-- Stage 2 -->
    <g filter="url(#cardShadow)">
      <rect x="335" y="180" width="245" height="300" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
      <text x="365" y="222" font-size="12" font-weight="bold" letter-spacing="2" fill="#2B6CB0">STAGE 2</text>
      <text x="365" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#1A202C">Peer Review</text>
      <line x1="365" y1="272" x2="550" y2="272" stroke="#E2E8F0" stroke-width="2"/>
      <text x="365" y="306" font-size="14.5" fill="#475569">&#10003; Traceability and</text>
      <text x="389" y="328" font-size="14.5" fill="#475569">coverage</text>
      <text x="365" y="362" font-size="14.5" fill="#475569">&#10003; Steps are atomic</text>
      <text x="365" y="396" font-size="14.5" fill="#475569">&#10003; Results are</text>
      <text x="389" y="418" font-size="14.5" fill="#475569">observable</text>
      <text x="365" y="452" font-size="14.5" fill="#475569">&#10003; Data confirmed</text>
      <text x="389" y="474" font-size="14.5" fill="#475569">to exist</text>
    </g>

    <!-- Diamond 2 -->
    <line x1="580" y1="330" x2="587" y2="330" stroke="#2B6CB0" stroke-width="3"/>
    <polygon points="605,290 645,330 605,370 565,330" fill="#ffffff" stroke="#2B6CB0" stroke-width="3"/>
    <line x1="645" y1="330" x2="612" y2="330" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <text x="605" y="410" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#64748B">Revise and</text>
    <text x="605" y="428" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#64748B">resubmit</text>

    <!-- Stage 3 -->
    <g filter="url(#cardShadow)">
      <rect x="620" y="180" width="245" height="300" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
      <text x="650" y="222" font-size="12" font-weight="bold" letter-spacing="2" fill="#2B6CB0">STAGE 3</text>
      <text x="650" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#1A202C">Business Owner</text>
      <text x="650" y="276" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#1A202C">Approval</text>
      <line x1="650" y1="294" x2="835" y2="294" stroke="#E2E8F0" stroke-width="2"/>
      <text x="650" y="326" font-size="14.5" fill="#475569">&#10003; Tests the real</text>
      <text x="674" y="348" font-size="14.5" fill="#475569">process as lived</text>
      <text x="650" y="382" font-size="14.5" fill="#475569">&#10003; Fair test of the</text>
      <text x="674" y="404" font-size="14.5" fill="#475569">business's work</text>
      <text x="650" y="438" font-size="14.5" fill="#475569">&#10003; Confirms the</text>
      <text x="674" y="460" font-size="14.5" fill="#475569">workflow reality</text>
    </g>

    <!-- Diamond 3 -->
    <line x1="865" y1="330" x2="872" y2="330" stroke="#2B6CB0" stroke-width="3"/>
    <polygon points="890,290 930,330 890,370 850,330" fill="#ffffff" stroke="#2B6CB0" stroke-width="3"/>
    <line x1="930" y1="330" x2="897" y2="330" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <text x="890" y="410" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#64748B">Revise and</text>
    <text x="890" y="428" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#64748B">resubmit</text>

    <!-- Stage 4 -->
    <g filter="url(#cardShadow)">
      <rect x="905" y="180" width="245" height="300" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
      <text x="935" y="222" font-size="12" font-weight="bold" letter-spacing="2" fill="#2B6CB0">STAGE 4</text>
      <text x="935" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#1A202C">Sign-Off:</text>
      <text x="935" y="276" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#1A202C">Ready for Execution</text>
      <line x1="935" y1="294" x2="1120" y2="294" stroke="#E2E8F0" stroke-width="2"/>
      <text x="935" y="326" font-size="14.5" fill="#475569">&#10003; Approval recorded</text>
      <text x="959" y="348" font-size="14.5" fill="#475569">with reviewer, date</text>
      <text x="935" y="382" font-size="14.5" fill="#475569">&#10003; Defect-evidence</text>
      <text x="959" y="404" font-size="14.5" fill="#475569">standard defined</text>
      <text x="935" y="438" font-size="14.5" fill="#475569">&#10003; Enters the</text>
      <text x="959" y="460" font-size="14.5" fill="#475569">execution cycle</text>
    </g>
  </g>
</svg>
