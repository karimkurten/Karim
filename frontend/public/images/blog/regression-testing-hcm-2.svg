<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Georgia, 'DM Serif Display', serif">
  <defs>
    <linearGradient id="hdr2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <filter id="sh2" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2B6CB0"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="104" fill="url(#hdr2)"/>
  <text x="60" y="48" font-size="30" fill="#ffffff">The Regression Cycle</text>
  <text x="60" y="80" font-size="17" fill="#94A3B8" font-family="Arial, sans-serif">Every change batch moves through the same loop — a fail returns through fix and a full re-run</text>

  <g filter="url(#sh2)"><rect x="40" y="150" width="200" height="110" rx="12" fill="#1e3a5f"/></g>
  <text x="140" y="194" font-size="19" fill="#ffffff" text-anchor="middle">1. Change</text>
  <text x="140" y="220" font-size="14" fill="#E2E8F0" font-family="Arial, sans-serif" text-anchor="middle">Configuration</text>
  <text x="140" y="240" font-size="14" fill="#E2E8F0" font-family="Arial, sans-serif" text-anchor="middle">batch promoted</text>

  <path d="M242 205 L282 205" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr2)"/>

  <g filter="url(#sh2)"><rect x="290" y="150" width="200" height="110" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g>
  <text x="390" y="194" font-size="19" fill="#1A202C" text-anchor="middle">2. Impact Analysis</text>
  <text x="390" y="220" font-size="14" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">Direct, adjacent,</text>
  <text x="390" y="240" font-size="14" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">and core impact</text>

  <path d="M492 205 L532 205" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr2)"/>

  <g filter="url(#sh2)"><rect x="540" y="150" width="200" height="110" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g>
  <text x="640" y="194" font-size="19" fill="#1A202C" text-anchor="middle">3. Select the Pack</text>
  <text x="640" y="220" font-size="14" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">Three tiers scoped</text>
  <text x="640" y="240" font-size="14" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">for this batch</text>

  <path d="M742 205 L782 205" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr2)"/>

  <g filter="url(#sh2)"><rect x="790" y="150" width="200" height="110" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/></g>
  <text x="890" y="194" font-size="19" fill="#1A202C" text-anchor="middle">4. Execute</text>
  <text x="890" y="220" font-size="14" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">Run and compare</text>
  <text x="890" y="240" font-size="14" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">results to expected</text>

  <path d="M890 262 L890 300 L600 300 L600 338" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr2)"/>

  <g filter="url(#sh2)"><rect x="400" y="346" width="400" height="96" rx="12" fill="#1e3a5f"/></g>
  <text x="600" y="388" font-size="22" fill="#ffffff" text-anchor="middle">5. Outcome</text>
  <text x="600" y="416" font-size="15" fill="#E2E8F0" font-family="Arial, sans-serif" text-anchor="middle">Every variance investigated — no unexplained differences</text>

  <path d="M600 444 L600 478 L300 478 L300 510" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr2)"/>
  <path d="M600 444 L600 478 L900 478 L900 510" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr2)"/>

  <g filter="url(#sh2)"><rect x="110" y="518" width="380" height="150" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/></g>
  <text x="300" y="562" font-size="21" fill="#1A202C" text-anchor="middle">Pass — Proceed</text>
  <text x="300" y="592" font-size="15" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">Evidence recorded against the batch</text>
  <text x="300" y="616" font-size="15" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">Batch accepted; pack kept for reuse</text>
  <text x="300" y="646" font-size="15" fill="#2B6CB0" font-family="Arial, sans-serif" text-anchor="middle">Next: next batch or sign-off</text>

  <g filter="url(#sh2)"><rect x="710" y="518" width="380" height="150" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/></g>
  <text x="900" y="562" font-size="21" fill="#1A202C" text-anchor="middle">Fail — Fix and Full Re-Run</text>
  <text x="900" y="592" font-size="15" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">Defect logged and triaged by severity</text>
  <text x="900" y="616" font-size="15" fill="#475569" font-family="Arial, sans-serif" text-anchor="middle">Fix is a new change with its own impact</text>
  <text x="900" y="646" font-size="15" fill="#2B6CB0" font-family="Arial, sans-serif" text-anchor="middle">Re-run affected tiers plus golden core</text>

  <text x="60" y="716" font-size="15" fill="#64748B" font-family="Arial, sans-serif">A spot-check after a regression fix repeats the mistake that let the regression through. The loop always closes in full.</text>
</svg>
