<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="The investigation funnel from alert to disclosure, with quality gates at each stage">
<rect width="1200" height="675" fill="#0f172a"/>
<text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">The Investigation Funnel — Quality at Every Gate</text>
<text x="60" y="105" font-family="Arial, sans-serif" font-size="18" fill="#bfdbfe">No benchmark conversion rate is published by an authoritative body. Measure your own funnel — honestly.</text>
<g font-family="Arial, sans-serif">
<path d="M200 150 L1000 150 L920 250 L280 250 Z" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/><text x="600" y="195" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">ALERTS</text><text x="600" y="225" text-anchor="middle" font-size="16" fill="#dbeafe">Triage: is this explainable by what we know of the customer?</text>
<path d="M280 270 L920 270 L850 370 L350 370 Z" fill="#1e40af" stroke="#60a5fa" stroke-width="2"/><text x="600" y="315" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">CASES</text><text x="600" y="345" text-anchor="middle" font-size="16" fill="#dbeafe">Investigate: facts, context, counter-evidence, network view</text>
<path d="M350 390 L850 390 L780 490 L420 490 Z" fill="#2563eb" stroke="#93c5fd" stroke-width="2"/><text x="600" y="435" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">DECISIONS</text><text x="600" y="465" text-anchor="middle" font-size="16" fill="#dbeafe">Report, monitor, restrict, or exit — with reasons recorded</text>
<path d="M420 510 L780 510 L730 600 L470 600 Z" fill="#3b82f6" stroke="#93c5fd" stroke-width="2"/><text x="600" y="552" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">STR / SAR FILINGS</text><text x="600" y="580" text-anchor="middle" font-size="15" fill="#eff6ff">Clear narrative: who, what, when, why it is suspicious</text>
</g>
</svg>
