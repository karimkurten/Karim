<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Five-phase data cleansing playbook flow: profile, define rules, cleanse, validate, prevent recurrence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0F4F8"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B6CB0"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="640" fill="url(#bg)"/>
  <text x="600" y="64" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="40" fill="#F0F4F8">The 5-Phase Cleansing Playbook</text>
  <text x="600" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#94A3B8">Run in order. Each phase gates the next — cleansing without profiling is just guessing.</text>

  <!-- connector line -->
  <rect x="90" y="252" width="1020" height="6" fill="#2B6CB0" opacity="0.55" rx="3"/>

  <!-- Phase 1 -->
  <g filter="url(#shadow)">
    <rect x="70" y="120" width="180" height="300" rx="14" fill="url(#card)" stroke="#2B6CB0" stroke-width="3"/>
    <circle cx="160" cy="172" r="30" fill="url(#num)"/>
    <text x="160" y="183" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold" font-size="26" fill="#F0F4F8">1</text>
    <text x="160" y="226" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="21" fill="#1A202C">Profile</text>
    <text x="160" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" fill="#475569">
      <tspan x="160" dy="0">Extract and analyze the</tspan>
      <tspan x="160" dy="18">legacy dataset: counts,</tspan>
      <tspan x="160" dy="18">value distributions,</tspan>
      <tspan x="160" dy="18">nulls, outliers,</tspan>
      <tspan x="160" dy="18">duplicate candidates.</tspan>
      <tspan x="160" dy="18">Know the mess</tspan>
      <tspan x="160" dy="18">before you touch it.</tspan>
    </text>
  </g>

  <!-- Phase 2 -->
  <g filter="url(#shadow)">
    <rect x="286" y="120" width="180" height="300" rx="14" fill="url(#card)" stroke="#2B6CB0" stroke-width="3"/>
    <circle cx="376" cy="172" r="30" fill="url(#num)"/>
    <text x="376" y="183" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold" font-size="26" fill="#F0F4F8">2</text>
    <text x="376" y="226" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="21" fill="#1A202C">Define Rules</text>
    <text x="376" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" fill="#475569">
      <tspan x="376" dy="0">With HR and payroll, set</tspan>
      <tspan x="376" dy="18">cleansing rules: formats,</tspan>
      <tspan x="376" dy="18">code lists, match criteria,</tspan>
      <tspan x="376" dy="18">field-level decisions —</tspan>
      <tspan x="376" dy="18">keep, fix, archive,</tspan>
      <tspan x="376" dy="18">or drop.</tspan>
    </text>
  </g>

  <!-- Phase 3 -->
  <g filter="url(#shadow)">
    <rect x="502" y="120" width="180" height="300" rx="14" fill="url(#card)" stroke="#2B6CB0" stroke-width="3"/>
    <circle cx="592" cy="172" r="30" fill="url(#num)"/>
    <text x="592" y="183" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold" font-size="26" fill="#F0F4F8">3</text>
    <text x="592" y="226" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="21" fill="#1A202C">Cleanse</text>
    <text x="592" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" fill="#475569">
      <tspan x="592" dy="0">Execute in the agreed</tspan>
      <tspan x="592" dy="18">environment: deduplicate,</tspan>
      <tspan x="592" dy="18">standardize, complete</tspan>
      <tspan x="592" dy="18">mandatory fields, resolve</tspan>
      <tspan x="592" dy="18">orphans. Log every</tspan>
      <tspan x="592" dy="18">change — reversibility</tspan>
      <tspan x="592" dy="18">is non-negotiable.</tspan>
    </text>
  </g>

  <!-- Phase 4 -->
  <g filter="url(#shadow)">
    <rect x="718" y="120" width="180" height="300" rx="14" fill="url(#card)" stroke="#2B6CB0" stroke-width="3"/>
    <circle cx="808" cy="172" r="30" fill="url(#num)"/>
    <text x="808" y="183" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold" font-size="26" fill="#F0F4F8">4</text>
    <text x="808" y="226" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="21" fill="#1A202C">Validate</text>
    <text x="808" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" fill="#475569">
      <tspan x="808" dy="0">Re-profile and reconcile</tspan>
      <tspan x="808" dy="18">against legacy sources:</tspan>
      <tspan x="808" dy="18">counts balance, rules pass,</tspan>
      <tspan x="808" dy="18">payroll-critical fields</tspan>
      <tspan x="808" dy="18">complete. Sign-off by</tspan>
      <tspan x="808" dy="18">HR and payroll owners.</tspan>
    </text>
  </g>

  <!-- Phase 5 -->
  <g filter="url(#shadow)">
    <rect x="934" y="120" width="180" height="300" rx="14" fill="url(#card)" stroke="#2B6CB0" stroke-width="3"/>
    <circle cx="1024" cy="172" r="30" fill="url(#num)"/>
    <text x="1024" y="183" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold" font-size="26" fill="#F0F4F8">5</text>
    <text x="1024" y="226" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="21" fill="#1A202C">Prevent</text>
    <text x="1024" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" fill="#475569">
      <tspan x="1024" dy="0">Recurrence: lock the gains.</tspan>
      <tspan x="1024" dy="18">Entry validation,</tspan>
      <tspan x="1024" dy="18">stewardship, scheduled</tspan>
      <tspan x="1024" dy="18">re-profiling, and clear</tspan>
      <tspan x="1024" dy="18">ownership so dirty data</tspan>
      <tspan x="1024" dy="18">never comes back.</tspan>
    </text>
  </g>

  <!-- arrows on connector -->
  <g fill="#2B6CB0">
    <polygon points="262,244 278,255 262,266"/>
    <polygon points="478,244 494,255 478,266"/>
    <polygon points="694,244 710,255 694,266"/>
    <polygon points="910,244 926,255 910,266"/>
  </g>

  <!-- footer note -->
  <rect x="70" y="470" width="1060" height="120" rx="12" fill="#0f172a" stroke="#E2E8F0" stroke-width="1" opacity="0.85"/>
  <text x="110" y="512" font-family="'DM Serif Display', Georgia, serif" font-size="20" fill="#F0F4F8">The rule that protects every phase</text>
  <text x="110" y="544" font-family="system-ui, sans-serif" font-size="16" fill="#94A3B8">
    <tspan x="110" dy="0">Cleanse BEFORE the migration loads — never during testing. Dirty data loaded early becomes</tspan>
    <tspan x="110" dy="24">"test data" by default, and the project spends weeks debating whether failures are data or configuration.</tspan>
  </text>
</svg>
