<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Time tracking control diagram: schedules and pay rules feeding capture methods, validation and exception handling, and approval and payroll, with an audit trail around every correction">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="88" fill="url(#hdr)"/>
  <text x="48" y="40" font-family="Georgia, serif" font-size="29" fill="#ffffff">One Rule Set, Three Controls Before Payroll</text>
  <text x="48" y="70" font-family="Arial, sans-serif" font-size="20" fill="#94A3B8">Controls match the work — capture, validate, or approve</text>
  <g>
    <rect x="400" y="116" width="400" height="150" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="424" y="150" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A202C">Schedules and Pay Rules</text>
    <text x="424" y="182" font-family="Arial, sans-serif" font-size="16" fill="#475569">Schedules — Rounding — Overtime</text>
    <text x="424" y="208" font-family="Arial, sans-serif" font-size="16" fill="#475569">Breaks — Locations — Cost Centres</text>
    <text x="424" y="234" font-family="Arial, sans-serif" font-size="16" fill="#475569">Grace periods and shift patterns</text>
  </g>
  <g>
    <rect x="40" y="306" width="346" height="150" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="60" y="338" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Capture Methods</text>
    <text x="60" y="366" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2B6CB0">Control: fit and identity</text>
    <text x="60" y="394" font-family="Arial, sans-serif" font-size="16" fill="#475569">Terminal, mobile, and web</text>
    <text x="60" y="418" font-family="Arial, sans-serif" font-size="16" fill="#475569">matched to each population,</text>
    <text x="60" y="442" font-family="Arial, sans-serif" font-size="16" fill="#475569">with offline rules set.</text>
  </g>
  <g>
    <rect x="406" y="306" width="346" height="150" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="426" y="338" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Validation and Exceptions</text>
    <text x="426" y="366" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2B6CB0">Control: owners and reasons</text>
    <text x="426" y="394" font-family="Arial, sans-serif" font-size="16" fill="#475569">Missed punches, late starts,</text>
    <text x="426" y="418" font-family="Arial, sans-serif" font-size="16" fill="#475569">and unscheduled work routed</text>
    <text x="426" y="442" font-family="Arial, sans-serif" font-size="16" fill="#475569">to a named corrector.</text>
  </g>
  <g>
    <rect x="772" y="306" width="388" height="150" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="792" y="338" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Approval and Payroll</text>
    <text x="792" y="366" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2B6CB0">Control: judgement and audit</text>
    <text x="792" y="394" font-family="Arial, sans-serif" font-size="16" fill="#475569">Managers judge exceptions</text>
    <text x="792" y="418" font-family="Arial, sans-serif" font-size="16" fill="#475569">against the schedule before</text>
    <text x="792" y="442" font-family="Arial, sans-serif" font-size="16" fill="#475569">time is released to pay.</text>
  </g>
  <rect x="40" y="488" width="1120" height="72" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="520" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Around every correction: who changed it, when, before and after, and why</text>
  <text x="64" y="546" font-family="Arial, sans-serif" font-size="16" fill="#64748B">The audit trail protects employees and managers when pay is questioned months later.</text>
  <text x="40" y="600" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Figure 2 — Time tracking controls and dependencies</text>
</svg>
