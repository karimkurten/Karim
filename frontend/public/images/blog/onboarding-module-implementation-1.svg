<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="The onboarding journey: offer accepted, preboarding, day one, first week, and first 90 days, with lead owners at each stage">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="88" fill="url(#hdr)"/>
  <text x="48" y="40" font-family="Georgia, serif" font-size="29" fill="#ffffff">Onboarding: From Offer to First 90 Days</text>
  <text x="48" y="70" font-family="Arial, sans-serif" font-size="20" fill="#94A3B8">Five stages — each with a purpose and lead owners</text>

  <g>
    <rect x="40" y="108" width="204" height="252" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/>
    <text x="58" y="142" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">Offer</text>
    <text x="58" y="166" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">Accepted</text>
    <text x="58" y="200" font-family="Arial, sans-serif" font-size="17" fill="#475569">Signed offer</text>
    <text x="58" y="224" font-family="Arial, sans-serif" font-size="17" fill="#475569">creates the</text>
    <text x="58" y="248" font-family="Arial, sans-serif" font-size="17" fill="#475569">hire record</text>
    <text x="58" y="292" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#2B6CB0">Lead: HR</text>
    <text x="58" y="318" font-family="Arial, sans-serif" font-size="17" fill="#64748B">Trigger stage</text>
  </g>
  <text x="246" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2B6CB0">&#8250;</text>
  <g>
    <rect x="264" y="108" width="204" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="282" y="142" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">Preboarding</text>
    <text x="282" y="200" font-family="Arial, sans-serif" font-size="17" fill="#475569">Forms, documents</text>
    <text x="282" y="224" font-family="Arial, sans-serif" font-size="17" fill="#475569">and payroll inputs</text>
    <text x="282" y="248" font-family="Arial, sans-serif" font-size="17" fill="#475569">collected early</text>
    <text x="282" y="292" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#2B6CB0">Lead: New hire</text>
    <text x="282" y="318" font-family="Arial, sans-serif" font-size="17" fill="#64748B">Verified by HR</text>
  </g>
  <text x="470" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2B6CB0">&#8250;</text>
  <g>
    <rect x="488" y="108" width="204" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="506" y="142" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">Day One</text>
    <text x="506" y="200" font-family="Arial, sans-serif" font-size="17" fill="#475569">Expected, met,</text>
    <text x="506" y="224" font-family="Arial, sans-serif" font-size="17" fill="#475569">equipped and</text>
    <text x="506" y="248" font-family="Arial, sans-serif" font-size="17" fill="#475569">able to sign in</text>
    <text x="506" y="292" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#2B6CB0">Lead: Manager</text>
    <text x="506" y="318" font-family="Arial, sans-serif" font-size="17" fill="#64748B">With IT ready</text>
  </g>
  <text x="694" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2B6CB0">&#8250;</text>
  <g>
    <rect x="712" y="108" width="204" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="730" y="142" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">First Week</text>
    <text x="730" y="200" font-family="Arial, sans-serif" font-size="17" fill="#475569">Introductions,</text>
    <text x="730" y="224" font-family="Arial, sans-serif" font-size="17" fill="#475569">role clarity and</text>
    <text x="730" y="248" font-family="Arial, sans-serif" font-size="17" fill="#475569">essential training</text>
    <text x="730" y="292" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#2B6CB0">Lead: Buddy</text>
    <text x="730" y="318" font-family="Arial, sans-serif" font-size="17" fill="#64748B">With manager</text>
  </g>
  <text x="918" y="244" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2B6CB0">&#8250;</text>
  <g>
    <rect x="936" y="108" width="204" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
    <text x="954" y="142" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1A202C">First 90 Days</text>
    <text x="954" y="200" font-family="Arial, sans-serif" font-size="17" fill="#475569">Goals, check-ins</text>
    <text x="954" y="224" font-family="Arial, sans-serif" font-size="17" fill="#475569">and role training</text>
    <text x="954" y="248" font-family="Arial, sans-serif" font-size="17" fill="#475569">completed</text>
    <text x="954" y="292" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#2B6CB0">Lead: Manager</text>
    <text x="954" y="318" font-family="Arial, sans-serif" font-size="17" fill="#64748B">With new hire</text>
  </g>

  <g>
    <rect x="40" y="384" width="1100" height="120" rx="12" fill="#ffffff" stroke="#2B6CB0" stroke-width="2"/>
    <text x="60" y="422" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#1A202C">Owners Across the Journey</text>
    <text x="60" y="454" font-family="Arial, sans-serif" font-size="20" fill="#475569">HR verifies — Manager welcomes — IT provisions — Buddy orients — New hire supplies</text>
    <text x="60" y="484" font-family="Arial, sans-serif" font-size="20" fill="#64748B">Every task has one owner, one trigger and one due rule.</text>
  </g>
  <text x="48" y="548" font-family="Arial, sans-serif" font-size="20" fill="#64748B">Every stage reads the Core HR record: person, position, manager, location, start date.</text>
  <text x="48" y="580" font-family="Arial, sans-serif" font-size="20" fill="#94A3B8">Preboarding removes friction. Day one delivers belonging. Ninety days build capability.</text>
</svg>
