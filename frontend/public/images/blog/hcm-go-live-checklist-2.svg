<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-label="Go/no-go decision flow: every unchecked checklist item must be completed, formally risk-accepted, or descoped">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1E3A5F"/>
    </marker>
    <style>text{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}</style>
  </defs>
  <rect x="0" y="0" width="960" height="680" rx="16" fill="#F4F6F8"/>
  <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#16294A">Go/No-Go Decision Flow</text>
  <text x="480" y="72" text-anchor="middle" font-size="15" fill="#5A6B7C">Any unchecked item needs a disposition — pick one of three</text>

  <!-- Invalid option callout -->
  <rect x="640" y="96" width="280" height="104" rx="12" fill="#EDEFF1" stroke="#B0BEC5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="660" y="130" font-size="15" font-weight="700" fill="#6B7683">&#10005; Not a disposition</text>
  <text x="660" y="156" font-size="14" fill="#6B7683">'We'll figure it out</text>
  <text x="660" y="178" font-size="14" fill="#6B7683">after go-live.'</text>

  <!-- Start card -->
  <rect x="170" y="96" width="300" height="60" rx="12" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="1.5"/>
  <text x="320" y="132" text-anchor="middle" font-size="16" font-weight="700" fill="#16294A">Review all 30 checklist items</text>
  <line x1="320" y1="156" x2="320" y2="180" stroke="#1E3A5F" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Decision diamond -->
  <polygon points="320,180 430,242 320,304 210,242" fill="#FFFFFF" stroke="#1E3A5F" stroke-width="2"/>
  <text x="320" y="236" text-anchor="middle" font-size="16" font-weight="700" fill="#16294A">Unchecked</text>
  <text x="320" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#16294A">item?</text>

  <!-- No branch -->
  <line x1="430" y1="242" x2="610" y2="242" stroke="#1E3A5F" stroke-width="2" marker-end="url(#arr)"/>
  <text x="520" y="232" text-anchor="middle" font-size="14" fill="#5A6B7C">No</text>
  <rect x="610" y="214" width="250" height="56" rx="10" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="1.5"/>
  <text x="735" y="238" text-anchor="middle" font-size="14" fill="#16294A">All green — move</text>
  <text x="735" y="258" text-anchor="middle" font-size="14" fill="#16294A">to the next item</text>
  <line x1="735" y1="270" x2="735" y2="620" stroke="#1E3A5F" stroke-width="2"/>
  <line x1="735" y1="620" x2="512" y2="620" stroke="#1E3A5F" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Yes branch -->
  <line x1="320" y1="304" x2="320" y2="328" stroke="#1E3A5F" stroke-width="2" marker-end="url(#arr)"/>
  <text x="338" y="322" font-size="14" fill="#5A6B7C">Yes</text>

  <!-- Disposition 1 -->
  <rect x="170" y="340" width="300" height="62" rx="10" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="1.5"/>
  <circle cx="200" cy="371" r="15" fill="#E8A33D"/>
  <text x="200" y="376" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
  <text x="226" y="366" font-size="15" font-weight="700" fill="#16294A">Complete before launch</text>
  <text x="226" y="388" font-size="13" fill="#5A6B7C">Launch date moves until it's done</text>

  <!-- Disposition 2 -->
  <rect x="170" y="414" width="300" height="62" rx="10" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="1.5"/>
  <circle cx="200" cy="445" r="15" fill="#E8A33D"/>
  <text x="200" y="450" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
  <text x="226" y="440" font-size="15" font-weight="700" fill="#16294A">Accept the risk formally</text>
  <text x="226" y="462" font-size="13" fill="#5A6B7C">Sponsor signs; remediation dated</text>

  <!-- Disposition 3 -->
  <rect x="170" y="488" width="300" height="62" rx="10" fill="#FFFFFF" stroke="#D9E1E8" stroke-width="1.5"/>
  <circle cx="200" cy="519" r="15" fill="#E8A33D"/>
  <text x="200" y="524" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
  <text x="226" y="514" font-size="15" font-weight="700" fill="#16294A">Descope the item</text>
  <text x="226" y="536" font-size="13" fill="#5A6B7C">Documented and communicated</text>

  <line x1="320" y1="550" x2="320" y2="574" stroke="#1E3A5F" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Final decision -->
  <rect x="130" y="586" width="380" height="66" rx="12" fill="#16294A"/>
  <text x="320" y="614" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">GO / NO-GO DECISION</text>
  <text x="320" y="636" text-anchor="middle" font-size="13" fill="#C8D3DE">Every item has a disposition</text>
</svg>
