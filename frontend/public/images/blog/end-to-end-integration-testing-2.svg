<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" role="img" aria-label="Comparison of test levels: System, Integration, End-to-End, and UAT across scope, who tests, when, and what each proves">
  <defs>
    <linearGradient id="heroBg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="headBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B6CB0"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="rowCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#F0F4F8"/>
    </linearGradient>
    <filter id="softShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="640" rx="18" fill="url(#heroBg2)"/>

  <text x="60" y="62" font-family="Georgia, serif" font-size="30" fill="#ffffff">Test levels at a glance</text>
  <text x="60" y="92" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#94A3B8">System vs Integration vs End-to-End vs UAT — what each one proves, and who owns it</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- Header row -->
    <rect x="220" y="130" width="230" height="64" rx="10" fill="url(#headBar)" filter="url(#softShadow2)"/>
    <text x="335" y="168" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">System</text>
    <rect x="462" y="130" width="230" height="64" rx="10" fill="url(#headBar)" filter="url(#softShadow2)"/>
    <text x="577" y="168" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Integration</text>
    <rect x="704" y="130" width="230" height="64" rx="10" fill="url(#headBar)" filter="url(#softShadow2)" stroke="#ffffff" stroke-width="2"/>
    <text x="819" y="168" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">End-to-End</text>
    <rect x="946" y="130" width="230" height="64" rx="10" fill="url(#headBar)" filter="url(#softShadow2)"/>
    <text x="1061" y="168" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">UAT</text>

    <!-- Row 1: Scope -->
    <rect x="60" y="214" width="148" height="88" rx="10" fill="#1e3a5f" stroke="#2B6CB0" stroke-width="1.5"/>
    <text x="134" y="263" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Scope</text>
    <rect x="220" y="214" width="230" height="88" rx="10" fill="url(#rowCard)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow2)"/>
    <text x="335" y="251" text-anchor="middle" font-size="13.5" fill="#475569">One system</text>
    <text x="335" y="271" text-anchor="middle" font-size="13.5" fill="#475569">or module</text>
    <rect x="462" y="214" width="230" height="88" rx="10" fill="url(#rowCard)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow2)"/>
    <text x="577" y="251" text-anchor="middle" font-size="13.5" fill="#475569">One interface</text>
    <text x="577" y="271" text-anchor="middle" font-size="13.5" fill="#475569">between two systems</text>
    <rect x="704" y="214" width="230" height="88" rx="10" fill="url(#rowCard)" stroke="#2B6CB0" stroke-width="2.5" filter="url(#softShadow2)"/>
    <text x="819" y="251" text-anchor="middle" font-size="13.5" fill="#475569">Whole landscape,</text>
    <text x="819" y="271" text-anchor="middle" font-size="13.5" fill="#475569">full business process</text>
    <rect x="946" y="214" width="230" height="88" rx="10" fill="url(#rowCard)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow2)"/>
    <text x="1061" y="251" text-anchor="middle" font-size="13.5" fill="#475569">Business</text>
    <text x="1061" y="271" text-anchor="middle" font-size="13.5" fill="#475569">requirements</text>

    <!-- Row 2: Who tests -->
    <rect x="60" y="318" width="148" height="88" rx="10" fill="#1e3a5f" stroke="#2B6CB0" stroke-width="1.5"/>
    <text x="134" y="367" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Who tests</text>
    <rect x="220" y="318" width="230" height="88" rx="10" fill="url(#rowCard)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow2)"/>
    <text x="335" y="355" text-anchor="middle" font-size="13.5" fill="#475569">Config consultants</text>
    <text x="335" y="375" text-anchor="middle" font-size="13.5" fill="#475569">&amp; functional testers</text>
    <rect x="462" y="318" width="230" height="88" rx="10" fill="url(#rowCard)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow2)"/>
    <text x="577" y="355" text-anchor="middle" font-size="13.5" fill="#475569">Integration developers</text>
    <text x="577" y="375" text-anchor="middle" font-size="13.5" fill="#475569">&amp; functional testers</text>
    <rect x="704" y="318" width="230" height="88" rx="10" fill="url(#rowCard)" stroke="#2B6CB0" stroke-width="2.5" filter="url(#softShadow2)"/>
    <text x="819" y="355" text-anchor="middle" font-size="13.5" fill="#475569">Test lead with HR,</text>
    <text x="819" y="375" text-anchor="middle" font-size="13.5" fill="#475569">payroll, finance</text>
    <rect x="946" y="318" width="230" height="88" rx="10" fill="url(#rowCard)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow2)"/>
    <text x="1061" y="355" text-anchor="middle" font-size="13.5" fill="#475569">Business end</text>
    <text x="1061" y="375" text-anchor="middle" font-size="13.5" fill="#475569">users</text>

    <!-- Row 3: When -->
    <rect x="60" y="422" width="148" height="88" rx="10" fill="#1e3a5f" stroke="#2B6CB0" stroke-width="1.5"/>
    <text x="134" y="471" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">When</text>
    <rect x="220" y="422" width="230" height="88" rx="10" fill="url(#rowCard)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow2)"/>
    <text x="335" y="459" text-anchor="middle" font-size="13.5" fill="#475569">During and right</text>
    <text x="335" y="479" text-anchor="middle" font-size="13.5" fill="#475569">after build</text>
    <rect x="462" y="422" width="230" height="88" rx="10" fill="url(#rowCard)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow2)"/>
    <text x="577" y="459" text-anchor="middle" font-size="13.5" fill="#475569">After connected</text>
    <text x="577" y="479" text-anchor="middle" font-size="13.5" fill="#475569">systems are stable</text>
    <rect x="704" y="422" width="230" height="88" rx="10" fill="url(#rowCard)" stroke="#2B6CB0" stroke-width="2.5" filter="url(#softShadow2)"/>
    <text x="819" y="459" text-anchor="middle" font-size="13.5" fill="#475569">After interfaces</text>
    <text x="819" y="479" text-anchor="middle" font-size="13.5" fill="#475569">are proven</text>
    <rect x="946" y="422" width="230" height="88" rx="10" fill="url(#rowCard)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow2)"/>
    <text x="1061" y="459" text-anchor="middle" font-size="13.5" fill="#475569">After E2E</text>
    <text x="1061" y="479" text-anchor="middle" font-size="13.5" fill="#475569">exit criteria met</text>

    <!-- Row 4: What it proves -->
    <rect x="60" y="526" width="148" height="88" rx="10" fill="#1e3a5f" stroke="#2B6CB0" stroke-width="1.5"/>
    <text x="134" y="567" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">What it</text>
    <text x="134" y="587" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">proves</text>
    <rect x="220" y="526" width="230" height="88" rx="10" fill="url(#rowCard)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow2)"/>
    <text x="335" y="563" text-anchor="middle" font-size="13.5" fill="#475569">The system does what</text>
    <text x="335" y="583" text-anchor="middle" font-size="13.5" fill="#475569">it was configured to do</text>
    <rect x="462" y="526" width="230" height="88" rx="10" fill="url(#rowCard)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow2)"/>
    <text x="577" y="563" text-anchor="middle" font-size="13.5" fill="#475569">Data crosses the</text>
    <text x="577" y="583" text-anchor="middle" font-size="13.5" fill="#475569">boundary intact</text>
    <rect x="704" y="526" width="230" height="88" rx="10" fill="url(#rowCard)" stroke="#2B6CB0" stroke-width="2.5" filter="url(#softShadow2)"/>
    <text x="819" y="563" text-anchor="middle" font-size="13.5" fill="#475569">The business process</text>
    <text x="819" y="583" text-anchor="middle" font-size="13.5" fill="#475569">works, in order, in full</text>
    <rect x="946" y="526" width="230" height="88" rx="10" fill="url(#rowCard)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#softShadow2)"/>
    <text x="1061" y="563" text-anchor="middle" font-size="13.5" fill="#475569">The business can</text>
    <text x="1061" y="583" text-anchor="middle" font-size="13.5" fill="#475569">operate and accepts it</text>
  </g>
</svg>
