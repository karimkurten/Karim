<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" font-family="Georgia, 'DM Serif Display', serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="780" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="104" fill="url(#hdr)"/>
  <text x="60" y="48" font-size="30" fill="#ffffff">UAT Defect Severity Model</text>
  <text x="60" y="80" font-size="17" fill="#94A3B8" font-family="Arial, sans-serif">Defined by business impact and workaround — never by who reported the defect</text>

  <rect x="60" y="140" width="52" height="560" rx="10" fill="#F0F4F8" stroke="#E2E8F0"/>
  <text x="86" y="200" font-size="16" fill="#2B6CB0" font-family="Arial, sans-serif" text-anchor="middle" transform="rotate(-90 86 420)">BUSINESS IMPACT — HIGHEST AT TOP</text>
  <path d="M86 640 L74 616 L98 616 Z" fill="#2B6CB0"/>

  <g filter="url(#sh)">
    <rect x="140" y="132" width="1000" height="128" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  </g>
  <rect x="140" y="132" width="14" height="128" fill="#0f172a"/>
  <text x="178" y="172" font-size="24" fill="#1A202C">Critical</text>
  <text x="178" y="202" font-size="17" fill="#475569" font-family="Arial, sans-serif">Core process blocked, or pay, benefits, or statutory output materially wrong.</text>
  <text x="178" y="230" font-size="16" fill="#2B6CB0" font-family="Arial, sans-serif">Workaround test: no workable workaround exists.</text>
  <text x="760" y="202" font-size="16" fill="#64748B" font-family="Arial, sans-serif">Example: payroll cannot be</text>
  <text x="760" y="226" font-size="16" fill="#64748B" font-family="Arial, sans-serif">calculated for a population.</text>

  <g filter="url(#sh)">
    <rect x="140" y="284" width="1000" height="128" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  </g>
  <rect x="140" y="284" width="14" height="128" fill="#1e3a5f"/>
  <text x="178" y="324" font-size="24" fill="#1A202C">Major</text>
  <text x="178" y="354" font-size="17" fill="#475569" font-family="Arial, sans-serif">Process completes with a wrong result, or fails for a significant group.</text>
  <text x="178" y="382" font-size="16" fill="#2B6CB0" font-family="Arial, sans-serif">Workaround test: cumbersome manual correction is possible.</text>
  <text x="760" y="354" font-size="16" fill="#64748B" font-family="Arial, sans-serif">Example: cross-border tax wrong,</text>
  <text x="760" y="378" font-size="16" fill="#64748B" font-family="Arial, sans-serif">correctable before the deadline.</text>

  <g filter="url(#sh)">
    <rect x="140" y="436" width="1000" height="128" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  </g>
  <rect x="140" y="436" width="14" height="128" fill="#2B6CB0"/>
  <text x="178" y="476" font-size="24" fill="#1A202C">Minor</text>
  <text x="178" y="506" font-size="17" fill="#475569" font-family="Arial, sans-serif">Result is correct, but the path carries a small extra step or inconvenience.</text>
  <text x="178" y="534" font-size="16" fill="#2B6CB0" font-family="Arial, sans-serif">Workaround test: a small manual step affecting few users.</text>
  <text x="760" y="506" font-size="16" fill="#64748B" font-family="Arial, sans-serif">Example: an extra approval step</text>
  <text x="760" y="530" font-size="16" fill="#64748B" font-family="Arial, sans-serif">for one small employee group.</text>

  <g filter="url(#sh)">
    <rect x="140" y="588" width="1000" height="128" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  </g>
  <rect x="140" y="588" width="14" height="128" fill="#94A3B8"/>
  <text x="178" y="628" font-size="24" fill="#1A202C">Cosmetic</text>
  <text x="178" y="658" font-size="17" fill="#475569" font-family="Arial, sans-serif">Presentation only — alignment, wording, or formatting; meaning unchanged.</text>
  <text x="178" y="686" font-size="16" fill="#2B6CB0" font-family="Arial, sans-serif">Workaround test: none needed; record and batch the fix.</text>
  <text x="760" y="658" font-size="16" fill="#64748B" font-family="Arial, sans-serif">Example: deduction shown in an</text>
  <text x="760" y="682" font-size="16" fill="#64748B" font-family="Arial, sans-serif">unexpected order, amounts correct.</text>

  <text x="60" y="752" font-size="15" fill="#64748B" font-family="Arial, sans-serif">Severity is impact. Priority — when to fix — is a separate judgment recorded at triage.</text>
</svg>
