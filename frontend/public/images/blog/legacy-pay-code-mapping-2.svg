<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Validation loop for pay-code mappings through parallel payroll and reconciliation">
  <defs>
    <linearGradient id="hero2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0F4F8"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2B6CB0"/>
    </marker>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748B"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#0f172a"/>
  <rect x="0" y="0" width="1200" height="120" fill="url(#hero2)"/>
  <text x="600" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#ffffff">The Validation Loop: Mapping to Proven Payroll</text>
  <text x="600" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#94A3B8">The workbook declares intent — parallel payroll and code-level reconciliation declare truth</text>

  <g font-family="Arial, sans-serif">
    <!-- Step 1: approved mapping loads -->
    <rect x="60" y="180" width="220" height="150" rx="12" fill="url(#node)" stroke="#2B6CB0" stroke-width="2"/>
    <text x="170" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">1. Approved mappings</text>
    <text x="170" y="235" text-anchor="middle" font-size="14" fill="#475569">load into the test</text>
    <text x="170" y="257" text-anchor="middle" font-size="14" fill="#475569">environment</text>
    <text x="170" y="295" text-anchor="middle" font-size="13" fill="#2B6CB0">Workbook sign-off gate:</text>
    <text x="170" y="313" text-anchor="middle" font-size="13" fill="#2B6CB0">nothing loads unapproved</text>

    <!-- Step 2: parallel payroll -->
    <rect x="360" y="180" width="220" height="150" rx="12" fill="url(#node)" stroke="#E2E8F0" stroke-width="1"/>
    <text x="470" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">2. Parallel payroll</text>
    <text x="470" y="235" text-anchor="middle" font-size="14" fill="#475569">runs for the same</text>
    <text x="470" y="257" text-anchor="middle" font-size="14" fill="#475569">pay period — legacy vs new</text>
    <text x="470" y="295" text-anchor="middle" font-size="13" fill="#64748B">Multiple cycles to catch</text>
    <text x="470" y="313" text-anchor="middle" font-size="13" fill="#64748B">quarterly / annual codes</text>

    <!-- Step 3: reconcile code by code -->
    <rect x="660" y="180" width="220" height="150" rx="12" fill="url(#node)" stroke="#E2E8F0" stroke-width="1"/>
    <text x="770" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">3. Reconcile</text>
    <text x="770" y="235" text-anchor="middle" font-size="14" fill="#475569">code by code,</text>
    <text x="770" y="257" text-anchor="middle" font-size="14" fill="#475569">not by totals</text>
    <text x="770" y="295" text-anchor="middle" font-size="13" fill="#64748B">Totals can balance while</text>
    <text x="770" y="313" text-anchor="middle" font-size="13" fill="#64748B">individual codes offset</text>

    <!-- Step 4: classify variances -->
    <rect x="960" y="180" width="180" height="150" rx="12" fill="url(#node)" stroke="#E2E8F0" stroke-width="1"/>
    <text x="1050" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#1A202C">4. Classify</text>
    <text x="1050" y="235" text-anchor="middle" font-size="14" fill="#475569">variances</text>
    <text x="1050" y="260" text-anchor="middle" font-size="12" fill="#475569">mapping error · config</text>
    <text x="1050" y="278" text-anchor="middle" font-size="12" fill="#475569">error · expected change</text>
    <text x="1050" y="296" text-anchor="middle" font-size="12" fill="#475569">· data error</text>

    <!-- Forward arrows -->
    <line x1="280" y1="255" x2="355" y2="255" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr2)"/>
    <line x1="580" y1="255" x2="655" y2="255" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr2)"/>
    <line x1="880" y1="255" x2="955" y2="255" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arr2)"/>

    <!-- Loop back: correct workbook and re-approve -->
    <rect x="360" y="400" width="520" height="140" rx="12" fill="#1e3a5f" stroke="#2B6CB0" stroke-width="2"/>
    <text x="620" y="435" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">5. Correct the workbook, re-approve, repeat</text>
    <text x="620" y="462" text-anchor="middle" font-size="14" fill="#cbd5e1">Mapping errors → fix the mapping, not the payroll</text>
    <text x="620" y="486" text-anchor="middle" font-size="14" fill="#cbd5e1">Re-approval gate before the next parallel cycle</text>
    <text x="620" y="512" text-anchor="middle" font-size="13" fill="#94A3B8">Finish line: the fully approved, reconciled workbook — not the first parallel that "looks close"</text>

    <!-- Return arrows -->
    <path d="M 1050 330 L 1050 470 L 880 470" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="8,6" marker-end="url(#arr3)"/>
    <path d="M 470 400 L 470 340" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="8,6" marker-end="url(#arr3)"/>
    <text x="1090" y="420" font-size="13" fill="#94A3B8">loop</text>
  </g>
</svg>
