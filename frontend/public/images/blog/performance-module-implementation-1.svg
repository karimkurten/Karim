<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="The performance cycle journey: goals set, check-ins, review, calibration, and outcomes linked, with the lead owner named at each stage">
  <defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient></defs>
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="88" fill="url(#hdr)"/>
  <text x="48" y="40" font-family="Georgia, serif" font-size="29" fill="#ffffff">Performance Cycle: From Goals Set to Outcomes Linked</text>
  <text x="48" y="70" font-family="Arial, sans-serif" font-size="20" fill="#94A3B8">Five stages — each with a purpose and lead owners</text>
  <g><rect x="40" y="108" width="208" height="252" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/><text x="56" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Goals</text><text x="56" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Set</text><text x="56" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Priorities cascade</text><text x="56" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">to teams and</text><text x="56" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">individuals, with</text><text x="56" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">evidence agreed.</text><text x="56" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: Manager</text></g>
  <g><rect x="268" y="108" width="208" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="284" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Check-ins</text><text x="284" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Held</text><text x="284" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Light, frequent</text><text x="284" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">conversations keep</text><text x="284" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">goals current and</text><text x="284" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">surface problems.</text><text x="284" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: Manager</text></g>
  <g><rect x="496" y="108" width="208" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="512" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Review</text><text x="512" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Written</text><text x="512" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Self-review first,</text><text x="512" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">then the manager</text><text x="512" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">assessment against</text><text x="512" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">the scale anchors.</text><text x="512" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: Employee, Mgr</text></g>
  <g><rect x="724" y="108" width="208" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="740" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Calibration</text><text x="740" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Held</text><text x="740" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Leaders compare</text><text x="740" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">ratings across teams</text><text x="740" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">and record reasons</text><text x="740" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">for every change.</text><text x="740" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: HR, Leaders</text></g>
  <g><rect x="952" y="108" width="208" height="252" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="968" y="142" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Outcomes</text><text x="968" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Linked</text><text x="968" y="200" font-family="Arial, sans-serif" font-size="15" fill="#475569">Final outcomes feed</text><text x="968" y="222" font-family="Arial, sans-serif" font-size="15" fill="#475569">development plans</text><text x="968" y="244" font-family="Arial, sans-serif" font-size="15" fill="#475569">and, by design, pay</text><text x="968" y="266" font-family="Arial, sans-serif" font-size="15" fill="#475569">decisions and reports.</text><text x="968" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2B6CB0">Lead: HR</text></g>
  <rect x="40" y="392" width="1120" height="72" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="424" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Every stage depends on accurate Core HR data and a scale people interpret the same way</text>
  <text x="64" y="450" font-family="Arial, sans-serif" font-size="16" fill="#475569">Wrong manager, job, or organisation data becomes a defect in the cycle itself.</text>
  <rect x="40" y="488" width="1120" height="72" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="520" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Calibration finishes before any pay process reads the outcomes</text>
  <text x="64" y="546" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Ratings are moderated, with reasons recorded, before they feed any other decision.</text>
  <text x="40" y="600" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Figure 1 — Performance cycle journey</text>
</svg>
