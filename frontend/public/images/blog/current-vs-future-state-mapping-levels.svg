<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="lv3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#274a76"/><stop offset="1" stop-color="#16294A"/>
    </linearGradient>
    <linearGradient id="lv2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6391"/><stop offset="1" stop-color="#1E3A5F"/>
    </linearGradient>
    <linearGradient id="lv1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5b942"/><stop offset="1" stop-color="#dd8f1c"/>
    </linearGradient>
    <filter id="lv-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#16294A" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="960" height="540" rx="14" fill="#f4f6f8"/>
  <text x="30" y="44" font-size="22" font-weight="700" fill="#16294A">Mapping Granularity: Three Levels, Three Jobs</text>
  <text x="30" y="66" font-size="13" fill="#5b6478">Map at the level where decisions, handoffs, and system interactions change</text>

  <!-- Pyramid layers with depth -->
  <g filter="url(#lv-shadow)">
    <!-- top layer L3 -->
    <polygon points="480,100 600,100 720,200 240,200" fill="url(#lv1)"/>
    <polygon points="600,100 720,200 700,214 580,114" fill="#c67c14" opacity="0.55"/>
    <!-- middle L2 -->
    <polygon points="480,100 240,200 140,320 820,320 720,200" fill="url(#lv2)"/>
    <polygon points="720,200 820,320 800,334 700,214" fill="#0f1f3a" opacity="0.5"/>
    <!-- bottom L1 -->
    <polygon points="140,320 820,320 920,450 40,450" fill="url(#lv3)"/>
    <polygon points="820,320 920,450 900,464 800,334" fill="#0a1626" opacity="0.5"/>
  </g>

  <!-- Layer labels -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <text x="480" y="168" fill="#16294A">L3 · Task</text>
    <text x="480" y="272" fill="#ffffff">L2 · Process</text>
    <text x="480" y="404" fill="#ffffff">L1 · Value Chain</text>
  </g>

  <!-- Right-side annotations -->
  <g font-size="12.5" fill="#16294A">
    <g filter="url(#lv-shadow)">
      <rect x="560" y="120" width="350" height="66" rx="10" fill="#ffffff" stroke="#e3e8f0"/>
    </g>
    <text x="580" y="146" font-weight="700">What the workshop maps</text>
    <text x="580" y="166" fill="#5b6478">Steps, decisions, handoffs — e.g. “verify documents → create pay record”</text>

    <g filter="url(#lv-shadow)">
      <rect x="560" y="228" width="350" height="66" rx="10" fill="#ffffff" stroke="#e3e8f0"/>
    </g>
    <text x="580" y="254" font-weight="700">What the design builds from</text>
    <text x="580" y="274" fill="#5b6478">End-to-end flows — e.g. “hire to first pay”, “time to paycheck”</text>

    <g filter="url(#lv-shadow)">
      <rect x="560" y="352" width="350" height="66" rx="10" fill="#ffffff" stroke="#e3e8f0"/>
    </g>
    <text x="580" y="378" font-weight="700">What the scope agreement covers</text>
    <text x="580" y="398" fill="#5b6478">Domains in scope — core HR, payroll, time, benefits, talent</text>
  </g>

  <!-- Left callout -->
  <g>
    <rect x="30" y="470" width="900" height="48" rx="10" fill="#FFF9F0" stroke="#E8A33D" stroke-width="1.5"/>
    <text x="52" y="499" font-size="13" fill="#16294A"><tspan font-weight="700">Too high?</tspan> the map can’t generate test scenarios. <tspan font-weight="700">Too low?</tspan> the workshop never finishes. Aim for the task level.</text>
  </g>
</svg>
