<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Compensation control diagram: Core HR job and salary data plus performance outcomes feeding the compensation cycle, budget pools and approval controls applied to recommendations, then the payroll handoff and employee letters, with a privacy strip covering role-based visibility">
  <defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient></defs>
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="88" fill="url(#hdr)"/>
  <text x="48" y="40" font-family="Georgia, serif" font-size="29" fill="#ffffff">Compensation Data: From Core HR to Payroll Handoff</text>
  <text x="48" y="70" font-family="Arial, sans-serif" font-size="20" fill="#94A3B8">Each step is controlled before a pay change reaches payroll</text>
  <g><rect x="40" y="120" width="240" height="220" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/><text x="60" y="154" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Core HR and Performance</text><text x="60" y="188" font-family="Arial, sans-serif" font-size="15" fill="#475569">Job, grade, and salary</text><text x="60" y="210" font-family="Arial, sans-serif" font-size="15" fill="#475569">data from the Core HR</text><text x="60" y="232" font-family="Arial, sans-serif" font-size="15" fill="#475569">record; outcomes from</text><text x="60" y="254" font-family="Arial, sans-serif" font-size="15" fill="#475569">performance.</text><text x="60" y="298" font-family="Arial, sans-serif" font-size="15" fill="#475569">Structures and ranges</text><text x="60" y="320" font-family="Arial, sans-serif" font-size="15" fill="#475569">kept by a named owner.</text></g>
  <text x="288" y="238" font-family="Arial, sans-serif" font-size="24" fill="#2B6CB0">&#8594;</text>
  <g><rect x="322" y="120" width="240" height="220" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="342" y="154" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Compensation Cycle</text><text x="342" y="188" font-family="Arial, sans-serif" font-size="15" fill="#475569">Merit, bonus, and</text><text x="342" y="210" font-family="Arial, sans-serif" font-size="15" fill="#475569">adjustment cycles run</text><text x="342" y="232" font-family="Arial, sans-serif" font-size="15" fill="#475569">in manager self-service.</text><text x="342" y="276" font-family="Arial, sans-serif" font-size="15" fill="#475569">Recommendations made</text><text x="342" y="298" font-family="Arial, sans-serif" font-size="15" fill="#475569">against ranges and</text><text x="342" y="320" font-family="Arial, sans-serif" font-size="15" fill="#475569">remaining budget.</text></g>
  <text x="570" y="238" font-family="Arial, sans-serif" font-size="24" fill="#2B6CB0">&#8594;</text>
  <g><rect x="604" y="120" width="240" height="220" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="624" y="154" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Budget and Approvals</text><text x="624" y="188" font-family="Arial, sans-serif" font-size="15" fill="#475569">Pools allocated before</text><text x="624" y="210" font-family="Arial, sans-serif" font-size="15" fill="#475569">recommendations open;</text><text x="624" y="232" font-family="Arial, sans-serif" font-size="15" fill="#475569">guardrails flag issues.</text><text x="624" y="276" font-family="Arial, sans-serif" font-size="15" fill="#475569">Approvals in sequence</text><text x="624" y="298" font-family="Arial, sans-serif" font-size="15" fill="#475569">with absence cover and</text><text x="624" y="320" font-family="Arial, sans-serif" font-size="15" fill="#475569">recorded exceptions.</text></g>
  <text x="852" y="238" font-family="Arial, sans-serif" font-size="24" fill="#2B6CB0">&#8594;</text>
  <g><rect x="886" y="120" width="274" height="220" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="906" y="154" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Payroll Handoff</text><text x="906" y="188" font-family="Arial, sans-serif" font-size="15" fill="#475569">Approved changes pass</text><text x="906" y="210" font-family="Arial, sans-serif" font-size="15" fill="#475569">to payroll reconciled,</text><text x="906" y="232" font-family="Arial, sans-serif" font-size="15" fill="#475569">with effective dates.</text><text x="906" y="276" font-family="Arial, sans-serif" font-size="15" fill="#475569">Letters generated from</text><text x="906" y="298" font-family="Arial, sans-serif" font-size="15" fill="#475569">the approved record —</text><text x="906" y="320" font-family="Arial, sans-serif" font-size="15" fill="#475569">no re-keying.</text></g>
  <rect x="40" y="372" width="1120" height="88" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="404" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Privacy and access control, by design</text>
  <text x="64" y="430" font-family="Arial, sans-serif" font-size="16" fill="#475569">Role-based visibility — each person sees only the pay data their role's decisions require.</text>
  <text x="64" y="452" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Exception reasons and approvals form the audit trail; access is reviewed on a schedule.</text>
  <rect x="40" y="484" width="1120" height="72" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="516" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Reporting is defined before go-live</text>
  <text x="64" y="542" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Completion by stage, budget against pool, exceptions by type — proven in the pilot.</text>
  <text x="40" y="600" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Figure 2 — Compensation control diagram</text>
</svg>
