<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Performance data control diagram: Core HR job, manager, and organisation data feeding forms and workflows, manager and employee actions, and calibration before reporting, with a privacy and access strip">
  <defs><linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient></defs>
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="88" fill="url(#hdr)"/>
  <text x="48" y="40" font-family="Georgia, serif" font-size="29" fill="#ffffff">Performance Data: From Core HR Record to Reporting</text>
  <text x="48" y="70" font-family="Arial, sans-serif" font-size="20" fill="#94A3B8">Each step is controlled before outcomes reach reporting</text>
  <g><rect x="40" y="120" width="240" height="220" rx="12" fill="#F0F4F8" stroke="#2B6CB0" stroke-width="2"/><text x="60" y="154" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Core HR Data</text><text x="60" y="188" font-family="Arial, sans-serif" font-size="15" fill="#475569">Job, manager, and</text><text x="60" y="210" font-family="Arial, sans-serif" font-size="15" fill="#475569">organisation feed</text><text x="60" y="232" font-family="Arial, sans-serif" font-size="15" fill="#475569">every cycle step.</text><text x="60" y="276" font-family="Arial, sans-serif" font-size="15" fill="#475569">Mid-cycle manager</text><text x="60" y="298" font-family="Arial, sans-serif" font-size="15" fill="#475569">changes re-route</text><text x="60" y="320" font-family="Arial, sans-serif" font-size="15" fill="#475569">work, not stall it.</text></g>
  <text x="288" y="238" font-family="Arial, sans-serif" font-size="24" fill="#2B6CB0">&#8594;</text>
  <g><rect x="322" y="120" width="240" height="220" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="342" y="154" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Forms and Workflows</text><text x="342" y="188" font-family="Arial, sans-serif" font-size="15" fill="#475569">Goal, check-in, and</text><text x="342" y="210" font-family="Arial, sans-serif" font-size="15" fill="#475569">review forms carry</text><text x="342" y="232" font-family="Arial, sans-serif" font-size="15" fill="#475569">the scale anchors.</text><text x="342" y="276" font-family="Arial, sans-serif" font-size="15" fill="#475569">Deadlines remind,</text><text x="342" y="298" font-family="Arial, sans-serif" font-size="15" fill="#475569">then escalate when</text><text x="342" y="320" font-family="Arial, sans-serif" font-size="15" fill="#475569">a step stalls.</text></g>
  <text x="570" y="238" font-family="Arial, sans-serif" font-size="24" fill="#2B6CB0">&#8594;</text>
  <g><rect x="604" y="120" width="240" height="220" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="624" y="154" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Actions and Calibration</text><text x="624" y="188" font-family="Arial, sans-serif" font-size="15" fill="#475569">Employees self-review;</text><text x="624" y="210" font-family="Arial, sans-serif" font-size="15" fill="#475569">managers assess and</text><text x="624" y="232" font-family="Arial, sans-serif" font-size="15" fill="#475569">submit to calibration.</text><text x="624" y="276" font-family="Arial, sans-serif" font-size="15" fill="#475569">Calibration compares</text><text x="624" y="298" font-family="Arial, sans-serif" font-size="15" fill="#475569">evidence across teams</text><text x="624" y="320" font-family="Arial, sans-serif" font-size="15" fill="#475569">and records changes.</text></g>
  <text x="852" y="238" font-family="Arial, sans-serif" font-size="24" fill="#2B6CB0">&#8594;</text>
  <g><rect x="886" y="120" width="274" height="220" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/><text x="906" y="154" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1A202C">Reporting</text><text x="906" y="188" font-family="Arial, sans-serif" font-size="15" fill="#475569">Completion, rating</text><text x="906" y="210" font-family="Arial, sans-serif" font-size="15" fill="#475569">distribution, and</text><text x="906" y="232" font-family="Arial, sans-serif" font-size="15" fill="#475569">calibration movement</text><text x="906" y="254" font-family="Arial, sans-serif" font-size="15" fill="#475569">by organisation.</text><text x="906" y="298" font-family="Arial, sans-serif" font-size="15" fill="#475569">Defined before the</text><text x="906" y="320" font-family="Arial, sans-serif" font-size="15" fill="#475569">cycle opens.</text></g>
  <rect x="40" y="372" width="1120" height="88" rx="12" fill="#F0F4F8" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="404" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">Privacy and access, by design</text>
  <text x="64" y="430" font-family="Arial, sans-serif" font-size="16" fill="#475569">Role-based visibility for reviews, ratings, and calibration notes — access follows the role, not curiosity.</text>
  <text x="64" y="452" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Calibration discussion stays inside the calibration group; retention follows policy in each jurisdiction.</text>
  <rect x="40" y="484" width="1120" height="72" rx="12" fill="#ffffff" stroke="#E2E8F0" stroke-width="2"/>
  <text x="64" y="516" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1A202C">History is a decision, not a default</text>
  <text x="64" y="542" font-family="Arial, sans-serif" font-size="16" fill="#64748B">Migrate the recent cycle in structured form; archive older material under retention policy.</text>
  <text x="40" y="600" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Figure 2 — Performance data control diagram</text>
</svg>
